    we_depend_on:
      - 'WSClient({ appId, appSecret, domain, logger, loggerLevel, autoReconnect, onReady, onReconnecting, onReconnected, onError }) + start({ eventDispatcher }) + close({ force })'
      - 'WSClient.start 对不合 /^cli_[0-9a-fA-F]{16}$/ 的 appId 悄悄不连（我们在前面先校验：isFeishuAppId）'
      - 'pullConnectConfig 的错误码：514 鉴权失败 / 403 / 1000040350 连接数超限 → onError(Error("pullConnectConfig failed: code=…"))'
      - 'EventDispatcher.register({ "im.message.receive_v1": handler })；handler 返回之后 SDK 才回执'
      - 'Client.im.v1.message.reply({ path: { message_id }, data: { msg_type, content } }) 与 Client.request GET /open-apis/bot/v3/info'
    wishlist:
