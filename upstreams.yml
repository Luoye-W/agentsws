# 上游登记表（docs/10 §3.2 的那份清单，WP91 落地）
#
# 这份文件回答三个问题：**我们在盯谁、盯它的什么、锁在哪一版**。
# 哨兵（`.github/workflows/upstream-watch.yml` 与 `scripts/upstream-watch.mjs`）只读它；
# `scripts/check-upstreams.mjs --check` 在 CI 里校验它没写坏、锁的版本和仓库里真装的一致。
#
# ── 字段 ───────────────────────────────────────────────────────────────────
#
# id                  必填。全表唯一的短名，只许 a-z 0-9 与连字符。报告里按它分节。
# kind                必填。docs/10 §3.1 的四类 + 16 §6 的 wrapped-plugin：
#                       runtime-dep    版本锁定的运行依赖 —— 要升级，可能破坏契约
#                       vendored       fork + 我们的补丁 —— 要 rebase
#                       ported         抄进来的源码 —— 上游改了要对照回来
#                       reference      只参考 —— 不升级，只看"有没有新想法"
#                       wrapped-plugin 我们包了一层的社区插件（16 §6）
# why                 必填，一句话：**我们哪里用到它**。空话不如不写。
# watch               必填，至少一项。哨兵这一周替你看什么：
#                       versions       npm 的 dist-tags 与版本表（要 `npm:`）
#                       releases       GitHub 的 release / tag（要 `repo:`）
#                       readme         README 这一周有没有被改（要 `repo:`）
#                       stars          星数（只对 reference 有意义，看热度拐点，要 `repo:`）
#                       default_flips  默认值扫描：克隆两个 tag 的源码 grep `.default(`
#                                      （docs/42 ④bis；`.d.ts` 的 diff 看不见默认值的翻转）
#                       wishlist       `wishlist:` 里的词命中 release notes / README 就单独提醒
#
# npm / repo / image  至少要有一个。repo 写 `owner/name`；image 不带 tag，tag 另写。
# image_tag           镜像的 tag。写 `latest` 就是"没锁"，报告里会照实说；runtime-dep 不许写 latest。
# image_digest        镜像的 digest（`sha256:…`；多架构镜像取 index 那一层的，WP146）。tag 会被重打，只有它不会变。
# image_in            这些文件里对 `image` 的每一处带 tag / digest 的引用都必须**逐字等于**
#                     `image:image_tag@image_digest`（`--check` 查；改坏一处 digest 就红）。
# bin_version         不走 npm 的二进制锁的版本（BrowserSkill 的 `bsk`）。三项要么都写、要么都不写：
# bin_tag_prefix        它在上游 GitHub releases 里的 tag 前缀（`cli-v`），周报拿最新正式 release 比；
# bin_lock_file         钉版本与 sha256 的那份 JSON（`{ cli: { version, tag }, plugin?: { name, version } }`），
#                       `--check` 要求 cli.version = bin_version、plugin.version = locked_version。
# locked_version      我们锁的版本（精确版本，或 `^x.y.z` 这种范围 —— 后者要 `pin: allow_caret`）。
# pinned_commit       git 固定的上游写这个（与 locked_version 二选一）。
# pin                 exact（默认）| allow_caret。docs/42 红线 3：runtime-dep 一律锁精确版本；
#                     写 allow_caret 就是"记录在案的例外"，必须在注释里说清为什么。
# locked_in           这些 package.json 里声明的版本必须**逐字等于** locked_version。
# lockfile_single     默认 true（有 npm + locked_version 时）：pnpm-lock.yaml 的 packages: 段里
#                     这个包只许解析出**一个**版本，且等于 locked_version。
# npm_lock_file       不进 pnpm 的 npm 运行时（WP252：桌面按需下载的 OpenConnector）的 npm 锁文件。
#                     `--check` 要求根依赖与那个包的 version 都等于 locked_version、每个要下载的包都钉 sha512；
#                     写了它就要写 `lockfile_single: false`。
# npm_pin_in          代码里钉这个版本的文件（WP252）：每个都要逐字含 `'<npm>'` 与 `'<locked_version>'`。
# pinned_tag          按 git tag 钉的上游写它（WP253）：上游的 release tag；与 `pinned_commit`（那个 tag 指的 commit）一起写。
# pin_file            代码里唯一的钉子文件（WP253，JSON：`{ repo, tag, commit, sha256 }`）：`--check` 要求 repo / tag / commit
#                     逐字等于这一条的 repo / pinned_tag / pinned_commit、sha256 是 64 位十六进制。换 tag 三处一起改。
# release_age_prefix  pnpm-workspace.yaml 的 minimumReleaseAgeExclude 里，以这个前缀开头的
#                     每一条都必须是 locked_version（docs/42 红线 3：写死版本、不写通配）。
# we_depend_on        我们碰到的 seam，一行一条。docs/42 §4 第 1 条说的就是这份清单：
#                     "我们碰了哪些 seam"以前散在 docs/17 §4 的表、gate.ts 的注释和 UPGRADE.md 里。
# watch_paths         只盯上游仓库的这些路径（给"转正信号"这类局部观察用）。
# wishlist            等上游做的事，一行一条。命中就单独提醒（docs/10 §3.3 ②）。
# covered_by          我们这一侧钉住它的测试 / 记录。**路径必须真存在**，`--check` 会查。
#
# ── 纪律 ───────────────────────────────────────────────────────────────────
#
# · 改了 locked_version 就要同步改 locked_in 里的每个文件 —— 不同步 CI 会红。
# · 报告只到 issue 为止：哨兵不改版本号、不开 PR、不合并（docs/10 §3.3 第 ⑤ 步是人看）。
# · reference 类不升级。它出现在报告里只是为了让人一周看一眼"有没有新想法"。

upstreams:
  # ── runtime-dep：版本锁定的运行依赖 ──────────────────────────────────────
  - id: dsh
    kind: runtime-dep
    why: 我们的 Agent 运行时本体；`packages/dsh-adapter` 是全仓唯一 import dsh 的地方（docs/34）
    npm: '@deepseek-ai/dsh'
    repo: deepseek-ai/deepseek-harness
    locked_version: 0.2.0-rc.1
    pin: exact
    watch: [versions, releases, default_flips, wishlist]
    locked_in:
      - packages/dsh-adapter/package.json
      - profiles/agentsws/package.json
    release_age_prefix: '@deepseek-ai/dsh'
    we_depend_on:
      - 'dsh-tools: pre-execute 的 allow / deny / ask'
      - 'dsh-tools: post-execute 的 replace / enrich / block'
      - 'dsh-user-approval: answerer waterfall 的四个结果值与 fail-closed'
      - 'dsh-system-prompt: section({ complete: true }) 的遮蔽、systemPrompt.context 的分节'
      - 'dsh-scope: ctx.tools.restrict({ allow }) 在 scoped context 里的过滤'
      - 'dsh-agent: ctx.agents.create / followup / whenIdle（WP81 起两档运行时都走它）'
      - 'dsh-session-projection: session/event 的投影（我们的事件序列就是从它来的）'
      - 'dsh-browser-use + dsh-experimental-browser-use-*: mountSessionMcp，一个 Agent 一个 MCP 客户端（WP82）'
      # WP132：0.1.7 起 `dsh-agent-presets`（按目录扫）整包下线，换成 registry（不扫目录、不收路径）
      - 'dsh-agent-preset-registry: ctx.agentPresets.register(definition) + mount(agentCtx, id)；注册即激活'
      - 'dsh-llm: ctx.llm.stream({ system, messages, tools }) 这条"一次性调用方"的路'
      # WP134：第三种模型来源「用我的 DeepSeek 账号登录」（选了才挂，apps/server/src/deepseek-account.ts）
      - 'dsh-deepseek-account-platform: startSignIn / cancelSignIn / signOut / getState / getProfile / getBalance / resolveToken / watch；宿主只提供 ctx.webServer.register({ kind: exact })'
      # WP149：rc.2 起 getProfile / getBalance / startSignIn / signOut 都收 AccountClientMetadata（version / locale / timezoneOffsetSeconds），
      # 官方据它拼 x-client-version / -locale / -timezone-offset；我们送装着的 dsh 版本（deepseek-account.test.ts 钉住相等）
      - 'dsh-deepseek-account: AccountClientMetadata 三个字段 → platformClientHeaders（每次平台调用）'
      # WP143：移植（不 import）自 dsh-llm-deepseek 的 Files 复用 / 推理回传（packages/model-gateway/src/providers/deepseek-files.ts）
      - 'dsh-llm-deepseek（移植）: Files 复用——POST /v1/files、anthropic-beta files-api-2025-04-14、按字节去重、失败或超时整份退内联、陈旧 file id 作废重传一次'
      - 'dsh-llm-deepseek（移植）: 推理回传——此前 assistant 轮次的 thinking 块与 signature 原样传回，跨模型去签名'
      # WP147（截图给 AI 看）：MCP 结果里的图片准入 = 挂着 ctx.attachments + 确切路由 resolveModel 声明 inputModalities 含 image
      - 'dsh-mcp-client: 图片准入（ctx.attachments + 路由 inputModalities 含 image），projectContent 在 post-execute 之前装好图片块'
      - 'dsh-attachment-local: dshHome 指一次运行的临时目录；readImageRequest(ref, { width, height, maxBytes })'
      - 'dsh-llm: requestImageDimensions / requiredImageOffload / projectOffloadedImages / offloadedImageText / requestImageHandleText；IMAGE_OFFLOAD_REQUIRED'
      - 'dsh-compaction-image-offload: agent/request-error 上的 IMAGE_OFFLOAD_REQUIRED → 记 image/offload、retry'
      # WP181：官方「自动化任务」在两档运行时里用起来（官方 Host 服务不挂，只用它公开的这些；src/official-schedule.ts）
      - 'dsh-schedule: create*ScheduleRecord 六种时间写法的校验与报错码、resolveEveryOccurrence、scheduleView、renderReminderFraming / renderRecurringReminderBatchFraming'
      - 'dsh-schedule: registerScheduleTools 注册那一刻不碰 Host 服务（我们拿假 tools.register 接住四份定义）'
      # WP225（WP218 决定 ④）：Windows 上跑命令走 PowerShell，不要求装 Git Bash（src/shell.ts / harness.ts）
      - 'dsh-pwsh-sandbox + dsh-tool-pwsh: Windows 上 ctx.shell 与模型面的 pwsh 工具（参数与 tool-bash 同形：command / workdir / sandbox_permissions / run_in_background）'
      - 'dsh-pwsh-local: argv(spec) 是可覆盖的 protected seam（我们在 -Command 前插 -ExecutionPolicy Bypass）；resolvePwshPath 先 pwsh 7 再 PATH 再 Windows PowerShell 5.1'
    wishlist:
      - 官方 SDK 出现 server→client 请求（dsh-sdk-jsonrpc-server 里的 transport.request）
      - headless 的 turn 驱动能被宿主接管（--json 只是单向投影，不算）
      - browser-use 从 experimental 转正，且后端不需要开原生构建就能起
      # WP133：`session.eventAt()` 已不再用（`runTurn` 的摘要改成边收 `session/event` 边折），原来那条
      # "替代接口定下来"撤掉。0.1.7-rc.1 与上游 master 的 Session 都没有 `read()`；Agent Note 2026-09-09
      # 只说"按需展示的历史走显式异步分页"——真出了分页读接口，才用得上会话历史回看那类功能。
      - Session 出现正式的异步分页读接口（Agent Note 2026-09-09 说的 explicit asynchronous pagination）
      - 出现渠道 seam（现在入站只能靠 agent.followup()）
      # WP93 加：`.d.ts` 与 README 的 diff 看不见 bundle 自己的 patch 层。alpha.2 就是往
      # `packages/bundle/base/cordis.patch.yml` 里 insert 了一行默认开的 `plugin-manager`
      # （按 `!ctx.get('profileContext')` 判），而我们的 profile 正好把 base 列进 bundles。
      - bundle 的 cordis.patch.yml 里新增默认开启的行（plugin-manager / hmr 那一类）
      # WP132 加：0.1.7-rc.1 的 base patch 又 insert 了 config-editor / settings / deepseek-account
      # 三行（写回 profile patch、默认出网登录），已在 profile 层写死 disabled。
      - 上游给 bundle 里的出网 / 写回类服务加上"headless 默认关"的开关（deepseek-account 现在任何组合默认就挂）
      # WP134 加：0.1.7-rc.1 的 `dsh-deepseek-account-platform` 里 `Config({}).desktopPlatform` 是 undefined
      # （文档说默认 null → x-client-platform: web；实际 desktopClientHeaders(undefined) 给的是 desktop-mac）。
      # 官方组合靠 base patch 显式写这一项所以看不出来；我们不走 bundle，显式传 null。修了就删 OFFICIAL_DEFAULTS。
      - dsh-deepseek-account-platform 的 desktopPlatform 默认值真的落成 null（schemastery .default(null)）
      # WP149 加：rc.2 的 dsh-llm-deepseek-account 在推理 401 时调 deepseekAccount.rejectToken(token)（只清还对得上的那份登录）。
      # 我们的账号推理不经它（model-gateway 自己的 provider），所以登录失效后本机状态仍是"已登录"、每次请求 401；
      # 要跟就是在 provider 的 401 分支里调 rejectToken（见 dsh-adapter/UPGRADE.md WP149 §5）。
      - 官方把"推理 401 → rejectToken"做成宿主可复用的库函数（我们就不用在 model-gateway 里照抄）
    covered_by:
      - packages/dsh-adapter/test/seams.test.ts
      - packages/dsh-adapter/test/browser-seam.test.ts
      - packages/dsh-adapter/test/upgrade.test.ts
      # WP133：profile 锁定每一行的 id 对照新版 dsh 的 `--dump-config-schema` 校验（升级时它先红）
      - packages/dsh-adapter/test/profile-lockdown.test.ts
      # WP134：官方账号模块原样跑的状态机 + 那条上游默认值的哨兵
      - packages/dsh-adapter/test/deepseek-account.test.ts
      # WP143：移植自 dsh-llm-deepseek 的 Files 复用与推理回传
      - packages/model-gateway/test/deepseek-files.test.ts
      - packages/model-gateway/test/deepseek-replay.test.ts
      # WP147：截图进模型（官方 MCP 桥 + 附件库 + 旧图换占位）
      - packages/dsh-adapter/test/screenshots-to-model.test.ts
      - packages/dsh-adapter/UPGRADE.md
      - docs/42-上游升级流程-v1.md

  # 34 §核实里的"共享兄弟包"：dsh vendored 出来独立发，packages/kernel 也在用。
  # 跟着 dsh 升是"必要时"才做的事，不是默认动作（改了就要跑 kernel 全部测试）。
  - id: cordis
    kind: runtime-dep
    why: 内核的插件容器（docs/09 契约选型"采用"的那一条），packages/kernel 与 dsh 两边共用
    npm: '@deepseek-ai/cordis'
    # WP132：dsh 0.1.7 的 peer 是 `~4.0.4`，4.0.2 进不了同一棵树——这是"必要时"那一次
    locked_version: 4.0.4
    pin: exact
    watch: [versions]
    locked_in:
      - packages/kernel/package.json
      - packages/dsh-adapter/package.json
      - profiles/agentsws/package.json
    covered_by:
      - packages/kernel/test

  - id: schemastery
    kind: runtime-dep
    # WP132：上次记录在案的例外（dsh-adapter 写 `^3.18.2`）已统一成精确版本；
    # dsh 0.1.7 要 `~3.18.4`，kernel / roles / dsh-adapter 三处一起升到 3.18.4。
    why: dsh 的配置 schema 库，packages/kernel 也在用；它翻默认值等于翻我们的配置默认值
    npm: '@deepseek-ai/schemastery'
    locked_version: 3.18.4
    pin: exact
    watch: [versions, default_flips]
    locked_in:
      - packages/kernel/package.json
      - packages/dsh-adapter/package.json
    covered_by:
      - packages/kernel/test

  - id: open-connector
    kind: runtime-dep
    # 它是两样东西：SDK（npm，锁 1.2.0）与 runtime 镜像。镜像 WP146 起钉 tag + digest
    # （09-24 实测 v1.6.5 = 当时的 latest；真 runtime 录制 + 回放 + 一致性套件全绿）。
    # 周报拿"锁的 tag / digest"比 ghcr 上最新的正式版标签；升级走 docs/42 §2「镜像怎么升」。
    why: 唯一的系统动作执行面（Shopify / Gmail / Meta …），`packages/connect-adapter` 是唯一 import 处
    npm: '@oomol-lab/connector'
    repo: oomol-lab/open-connector
    image: ghcr.io/oomol-lab/open-connector
    image_tag: v1.6.5
    image_digest: sha256:aa088c5d3f308937ec9b9e8c959a940ff4a6ce3b8ee0abe30a755d5b2400a5b1
    image_in:
      - docker-compose.yml
      - scripts/dev-real.sh
      - packages/connect-adapter/test/record-fixtures.test.ts
      # 磁带是在哪一版上录的：换镜像版本就得重录，不然这一行先红
      - packages/connect-adapter/test/fixtures/runtime.meta.json
    locked_version: 1.2.0
    pin: exact
    watch: [versions, releases, readme, wishlist]
    locked_in:
      - packages/connect-adapter/package.json
    release_age_prefix: '@oomol-lab/connector'
    we_depend_on:
      - 'runtime HTTP：SDK 覆盖不到的三块（见 packages/connect-adapter/src/http.ts 的注释）'
      - 'errorCode 优先于 HTTP 状态的判错顺序（09-09 对真容器实测出来的）'
      - 'provider 目录：shopify_admin / gmail / meta / whatsapp / klaviyo'
    wishlist:
      - amazon_sp_api provider
      - tiktok_shop provider
      - imap provider
      - feishu_contacts provider
      - merchant_center provider
    covered_by:
      - packages/connect-adapter/test/conformance-adapter.test.ts
      - packages/connect-adapter/test/record-fixtures.test.ts
      - packages/connect-adapter/test/errors.test.ts
      - packages/connect-adapter/test/fixtures
      - packages/connect-adapter/README.md

  - id: open-connector-runtime
    kind: runtime-dep
    # WP252：open-connector 现在有两种形态。上面那条是 SDK + Docker 镜像（自托管 / 开发 / 录磁带）；
    # 这一条是 WP247 起桌面版按需下载的 **npm 包 + 我们的锁文件**（`npm ci --ignore-scripts`，318 个包逐个
    # sha512）。它不进 package.json / pnpm-lock.yaml，版本钉在 `OPEN_CONNECTOR_PIN` 与锁文件里，
    # `--check` 对账这三处；升级走 docs/42「npm 运行时怎么升」（改钉版本 → 重出锁文件 → 测试）。
    # 发行 / release notes 由上面那条盯（同一个仓库），这一条只盯 npm 版本表。
    why: 桌面版的本机连接器（WP247：用户第一次点「连接」时下载、桌面壳当后台服务起停，不要 Docker）
    npm: '@oomol-lab/open-connector'
    repo: oomol-lab/open-connector
    locked_version: 1.8.0
    pin: exact
    lockfile_single: false
    npm_lock_file: packages/connect-adapter/src/open-connector-lock.json
    npm_pin_in:
      - packages/connect-adapter/src/local-runtime.ts
    watch: [versions]
    we_depend_on:
      - '无头库的入口：宿主脚本（local-runtime.ts 的 HOST_SCRIPT）自己 import 它、套 @hono/node-server 的 HTTP 外壳'
      - '与镜像同一套 HTTP 面：/api/connections、/api/runtime-tokens、/v1/*（connect-adapter 两档共用）'
      - '加固：/v1 静态令牌、加密主密钥、proxy 全封（08 §5；宿主脚本缺一样就拒绝启动）'
      - 'engines.node（1.8.0 要 >=22.18.0；安装包自带的 Node 要满足）'
    covered_by:
      - packages/connect-adapter/test/local-runtime.test.ts
      - apps/server/test/open-connector-installer.test.ts
      - apps/desktop/test/connect-launcher-live.test.ts
      - scripts/open-connector-lock.mjs

  - id: new-api
    kind: runtime-dep
    # 09-24 补登（Luoye：引用的开源项目都要纳入周评估）。只在自建形态（deploy/docker-compose.yml）里跑；
    # 官方 Cloudflare 形态现在直连 DeepSeek（apps/cloud-worker/wrangler.toml 的 AGENTSWS_NEWAPI_BASE_URL），
    # 以后换回自建 New API 只改那一行。镜像 09-24 起钉 tag + digest（原来写的 ghcr 地址匿名 401、拉不下来）。
    why: 自建云形态的 AI 转发网关（官方积分那条模型路的上游聚合），docs/49、docs/61
    repo: QuantumNous/new-api
    image: docker.io/calciumion/new-api
    image_tag: v1.0.0-rc.40
    locked_version: 1.0.0-rc.40
    pin: exact
    image_digest: sha256:37c0f99a76ed0a5d5b376b8486173415efd1ec416042b392bd564eb0ae6a55ef
    image_in:
      - deploy/docker-compose.yml
      - deploy/.env.example
    watch: [releases, readme, wishlist]
    we_depend_on:
      - 'OpenAI 兼容 /v1/chat/completions 与令牌鉴权（apps/cloud 的 AI 转发）'
      - '渠道 / 令牌在它自己的后台页里配，key 不进我们的 .env（docs/61 §4）'
    wishlist:
      - BREAKING（令牌鉴权 / 计费口径 / 管理 API 的破坏性改动）
      - 正式版 1.0.0（现在还是 rc）

  - id: mcp-sdk
    kind: runtime-dep
    why: 自定义 MCP 服务器接进运行时那条路的客户端（apps/server），也是 playwright-mcp 的底座
    npm: '@modelcontextprotocol/sdk'
    repo: modelcontextprotocol/typescript-sdk
    locked_version: 1.30.0
    pin: exact
    watch: [versions, releases]
