name: CI

# 合并门禁（docs/35 §3 的审核清单自动化）：
#   install → tsc -b --force → biome check → vitest（含覆盖率）→ 模拟回路 fast 档
# 任何一步非 0 退出即红。模拟回路那一步是 09 §3.1 的「合并门禁 = fast 全过 + 指标不劣化」。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 桌面壳在 CI 里只做 tsc + 单元测试，从不 electron-builder 打包，
  # 所以不需要每个矩阵格子都下 ~100 MB 的 Electron 平台二进制（类型声明随 npm 包一起装）。
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # 关掉 pnpm 的更新提示，让日志干净
  npm_config_update_notifier: 'false'

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # better-sqlite3 / sqlite-vec 是原生模块，两个平台各自装一次、各自跑一遍
        os: [ubuntu-latest, macos-latest]
        node: ['22']

    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取自根 package.json 的 packageManager 字段（pnpm 11）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: tsc -b --force
        run: pnpm exec tsc -b --force

      - name: biome check
        run: pnpm exec biome check .

      # WP33：SDK 是从路由声明生成并签进仓库的。这里重生成一遍再比 diff——
      # 「改了路由但忘了重生成」会红在这里，而不是等第三方接的时候才发现。
      - name: gen-sdk（生成后无 diff）
        run: |
          node scripts/gen-sdk.mjs
          git diff --exit-code -- packages/sdk/openapi.json packages/sdk/src/schema.ts

      # 覆盖率写到 out/ 下：biome.json 已经忽略 out/，否则下一次 `biome check .`
      # 会去 lint 覆盖率报告自带的那些 js
      - name: vitest
        run: pnpm exec vitest run --coverage --coverage.reportsDirectory=out/coverage

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}
          path: out/coverage/
          if-no-files-found: warn
          retention-days: 14

      # 合并门禁：8 条场景 × 6 条不变量，全替身、固定 seed、分钟级
      - name: simulate (merge gate, fast tier)
        run: >-
          pnpm -s simulate --tier fast --pack packs/dtc-3c-3p
          --scenario 'scenarios/**/*.yml' --seed 42 --report out/simulation

      - name: upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report-${{ matrix.os }}-node${{ matrix.node }}
          path: out/simulation/
          if-no-files-found: warn
          retention-days: 14

  # WP30 D：同一批场景换到 dsh 的**跨进程 headless** 档再跑一遍。
  # 17 §4「运行时可替换」不是口号：换掉运行时、换掉宿主进程，九条场景与六条不变量照样全过。
  # 基线按运行时分档（packs/*/baseline.json 的 `runtimes.dsh`），所以指标门禁也照常生效。
  dsh-subprocess:
    name: simulate · dsh headless 子进程
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # 子进程入口是编译产物（dist/headless/child.js），先建
      - name: tsc -b
        run: pnpm exec tsc -b

      - name: simulate --runtime dsh-subprocess
        run: >-
          pnpm -s simulate --tier fast --pack packs/dtc-3c-3p
          --scenario 'scenarios/**/*.yml' --seed 42 --runtime dsh-subprocess
          --report out/simulation-dsh

      - name: upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report-dsh-subprocess
          path: out/simulation-dsh/
          if-no-files-found: warn
          retention-days: 14

  # WP40 A：**同一套一致性套件换到 Postgres 上再跑一遍**。
  # 21 §3 说的「存储档切换只换配置」如果只在 SQLite 上验，那就只是一句话。
  # 这里用 service container 起 postgres:16，把 kernel / data / txn 三个包的
  # 双方言套件跑掉；本地没 docker 时这些用例会跳过，CI 里必须真跑。
  dual-dialect:
    name: 双方言 · kernel / data / txn on postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentsws
          POSTGRES_PASSWORD: agentsws
          POSTGRES_DB: agentsws_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agentsws -d agentsws_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTSWS_TEST_DATABASE_URL: postgres://agentsws:agentsws@127.0.0.1:55432/agentsws_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: tsc -b
        run: pnpm exec tsc -b
      # 跳过 = 没连上库 = 配置坏了。先自证连得上，再跑套件。
      - name: 确认 Postgres 真的连得上（跳过不算过）
        working-directory: packages/core
        run: |
          node -e "
            const postgres = require('postgres');
            const sql = postgres(process.env.AGENTSWS_TEST_DATABASE_URL);
            sql\`select 1\`.then(() => { console.log('postgres ok'); return sql.end(); })
              .catch((e) => { console.error(e); process.exit(1); });
          "
      - name: vitest（双方言套件）
        run: >-
          pnpm exec vitest run
          packages/core/test/sql-driver.test.ts
          packages/kernel/test/conformance-dual.test.ts
          packages/data/test/conformance-dual.test.ts
          packages/txn/test/dialect-portability.test.ts

  # WP40 B：对象存储的 S3 路径打真的 MinIO。
  # 自己写的 SigV4（不装 40 MB 的 aws sdk）必须有一台真服务端验证签名，
  # 不然「签名对不对」这件事就只有我们自己说了算。
  blob-s3:
    name: 对象存储 · S3 路径打 MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENTSWS_TEST_S3_ENDPOINT: http://127.0.0.1:59000
      AGENTSWS_TEST_S3_ACCESS_KEY: agentsws
      AGENTSWS_TEST_S3_SECRET_KEY: agentsws-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: tsc -b
        run: pnpm exec tsc -b
      # 官方镜像要带 `server /data` 命令，GitHub 的 service container 给不了命令，所以用 docker run
      - name: 起 MinIO（官方镜像，固定版本）
        run: |
          docker run -d --name minio -p 59000:9000 \
            -e MINIO_ROOT_USER=agentsws -e MINIO_ROOT_PASSWORD=agentsws-secret \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - name: 确认 MinIO 真的起来了（跳过不算过）
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$AGENTSWS_TEST_S3_ENDPOINT/minio/health/live" && exit 0
            sleep 2
          done
          docker logs minio; exit 1
      - name: vitest（BlobStore 一致性）
        run: pnpm exec vitest run packages/blob

  # WP40 C：compose 冒烟。40 §1.3 的「公司 Docker 档」要能在一台干净机器上起来，
  # 所以每次合并都真建一次镜像、真起一次、真打一次 /v1/health。
  compose-smoke:
    name: compose 冒烟 · 起来并打通 /v1/health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 生成 .env（与 NAS 上第一次装是同一条路）
        run: |
          cp deploy/nas/env.example .env
          sh deploy/nas/gen-keys.sh >> .env
          chmod 600 .env
      # 容器里以 node（uid 1000）跑，bind mount 的目录得先建好并交给它（NAS 说明里同一条）
      - name: 数据目录属主给容器用户
        run: mkdir -p .agentsws-data && sudo chown -R 1000:1000 .agentsws-data
      - name: docker compose up
        run: docker compose up -d --build
      - name: 等 /v1/health 变绿
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4317/v1/health || true)
            [ "$code" = "200" ] && echo "health ok after ${i}0s" && exit 0
            sleep 2
          done
          echo "服务进程没起来" >&2
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - name: 健康检查的内容也看一眼（status 不能是 halted）
        run: |
          body=$(curl -fsS http://127.0.0.1:4317/v1/health)
          echo "$body" | head -c 600
          echo "$body" | grep -q '"status":"ok"' || {
            echo "status 不是 ok" >&2
            docker compose logs --tail=200 server
            exit 1
          }
      - name: 收尾
        if: always()
        run: docker compose down -v
