name: Upstream watch

# 上游哨兵（docs/10 §3）的机器层。**WP91 起已启用**（docs/42 §3）。
#
# 两条 cron，做的是两件不同的事：
#
#   每周一 06:00 UTC（北京 14:00）   全量周报：`upstreams.yml` 里的每一个上游都看一遍
#                                     （版本 / releases / README 有没有动 / wishlist 命中），
#                                     产出一条 `上游周报 <年>-W<周>` 的 issue，同一周只开一条。
#   每天 18:30 UTC（北京次日 02:30）  只查 dsh：dist-tags 与 GitHub releases。
#                                     **没新版就零输出**——不开 issue、不评论、不试升级。
#                                     有新版才走试升级 + ④bis 默认值扫描，开一条版本专属的 issue。
#
# 为什么周报每周、dsh 每天：dsh 是唯一一个"它动我们就得动"的上游（全仓唯一 import 处在
# `packages/dsh-adapter`），而且它在预发布期，版本节奏比 pnpm 的静默期还快；其余上游一周看一次够了。
#
# 它**不做**：不改版本号、不开 PR、不推分支、不合并、不替人决定纳不纳入。
# 为什么止步于 issue：10 §3.3 第 ⑤ 步是「L1 人看报告点通过」；自动开 PR 会让"点一下 merge"
# 变成默认动作，而升级的风险恰恰在测试全绿、基线却悄悄变了的地方。

on:
  schedule:
    # 全量周报（每周一 06:00 UTC = 北京时间 14:00）
    - cron: '0 6 * * 1'
    # 只查 dsh（每天 18:30 UTC = 北京时间次日 02:30）
    - cron: '30 18 * * *'

  workflow_dispatch:
    inputs:
      scope:
        description: weekly（全量周报）还是 daily（只查 dsh）
        required: false
        default: weekly
        type: choice
        options: [weekly, daily]
      version:
        description: 试升级到哪个版本（留空 = 按 dist-tags 里最高的那个）
        required: false
        default: ''
      dry_run:
        description: 只报告不开 issue
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch-${{ github.event.schedule || inputs.scope || 'manual' }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  npm_config_update_notifier: 'false'

jobs:
  # ── ① 观察：读 upstreams.yml，把这一趟该看的都看一遍 ──────────────────────
  observe:
    name: 观察
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      title: ${{ steps.watch.outputs.title }}
      dsh_locked: ${{ steps.watch.outputs.dsh_locked }}
      dsh_target: ${{ steps.watch.outputs.dsh_target }}
      dsh_changed: ${{ steps.watch.outputs.dsh_changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 登记表本身先过一遍形状与"锁的版本对不对得上"：一份写坏的 upstreams.yml
      # 会让后面每一步都在看错的东西。这两个脚本零依赖，所以不用 pnpm install。
      - name: 校验 upstreams.yml
        run: node scripts/check-upstreams.mjs --check

      - id: scope
        name: 这一趟看什么
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SCOPE" ]; then SCOPE="$INPUT_SCOPE"
          elif [ "$SCHEDULE" = '30 18 * * *' ]; then SCOPE=daily
          else SCOPE=weekly
          fi
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "这一趟：$SCOPE" >> "$GITHUB_STEP_SUMMARY"

      - id: watch
        name: 观察（只读，不装依赖、不跑测试）
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = daily ]; then WINDOW=2; else WINDOW=7; fi
          node scripts/upstream-watch.mjs \
            --scope "$SCOPE" --window-days "$WINDOW" \
            --out out/upstream/report.md \
            --json out/upstream/summary.json
          node -e '
            const fs = require("node:fs")
            const s = JSON.parse(fs.readFileSync("out/upstream/summary.json", "utf8"))
            for (const [k, v] of Object.entries(s)) {
              if (Array.isArray(v)) continue
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v ?? ""}\n`)
            }
          '
          cat out/upstream/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: out/upstream/
          if-no-files-found: error
          retention-days: 30

  # ── ④bis 默认值扫描：`.d.ts` 的 diff 看不见的那一半（docs/42）──────────────
  # 这一步是 docs/42 §3 定的**启用前提**：没有它，一条"把整条会话日志上报给模型厂商"
  # 的开关从 false 翻成 true，类型不变、行为指纹也不变，全绿的自动报告会整条漏掉（WP70 实例）。
  default-flips:
    name: ④bis 默认值扫描
    needs: observe
    if: needs.observe.outputs.dsh_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 扫不成（私有仓 / tag 命名变了）不把流程染红：报告里会写明"没扫成，要人工补做"
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 克隆两个 tag 的源码、只看 default 那几行
        env:
          FROM: ${{ needs.observe.outputs.dsh_locked }}
          TO: ${{ inputs.version || needs.observe.outputs.dsh_target }}
        run: |
          set -euo pipefail
          mkdir -p out/upstream
          bash scripts/scan-default-flips.sh \
            deepseek-ai/deepseek-harness "dsh-v$FROM" "dsh-v$TO" packages \
            out/upstream/default-flips.md
          cat out/upstream/default-flips.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-default-flips
          path: out/upstream/
          if-no-files-found: warn
          retention-days: 30

  # ── ⑥ 试升级 + 对比：在临时工作树里做，不碰 main、不推任何分支 ─────────────
  try-upgrade:
    name: 试升级 · ${{ needs.observe.outputs.dsh_locked }} → ${{ needs.observe.outputs.dsh_target }}
    needs: observe
    if: needs.observe.outputs.dsh_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 试升级失败**不等于**流程失败：结论要进 issue 给人看，不是把 CI 染红
    continue-on-error: true
    outputs:
      verdict: ${{ steps.compare.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # 第 ① 步：基线必须来自**升级前的当前代码树**。仓库里那几份是历次升级当天的口径，
      # 直接拿来当 FROM 会把我们自己 WP 的改动算到上游头上（docs/42 ① 的 WP70 红线）。
      - name: install（升级前）
        run: pnpm install --frozen-lockfile

      - name: tsc -b（升级前）
        run: pnpm exec tsc -b

      - name: 采升级前基线
        run: node packages/dsh-adapter/test/upgrade-baseline/capture.mjs watch-before.json

      # 第 ③ 步：改版本号
      - name: 改版本号
        env:
          FROM: ${{ needs.observe.outputs.dsh_locked }}
          TO: ${{ inputs.version || needs.observe.outputs.dsh_target }}
        run: |
          set -euo pipefail
          sed -i "s/\"$FROM\"/\"$TO\"/g" packages/dsh-adapter/package.json profiles/agentsws/package.json
          git --no-pager diff --stat

      - name: install（升级后；lockfile 会被重解析）
        id: install
        run: pnpm install --no-frozen-lockfile

      # 依赖树的变化要人看：新出现的原生依赖默认 false 是人的决定，不是 CI 的
      - name: 依赖树 diff（新增 / 消失的包）
        if: always()
        run: |
          set -euo pipefail
          git show HEAD:pnpm-lock.yaml > /tmp/lock-old.yaml
          pkgs() { awk '/^packages:/{f=1;next} /^snapshots:/{f=0} f && /^  [^ ]/{print}' "$1" \
                   | sed 's/^  //;s/:$//' | sed -E 's/@[^@]*$//' | sort -u; }
          pkgs /tmp/lock-old.yaml > /tmp/old.pkgs
          pkgs pnpm-lock.yaml     > /tmp/new.pkgs
          {
            echo "## 依赖树变化"
            echo
            echo "### 新增"
            comm -13 /tmp/old.pkgs /tmp/new.pkgs | sed 's/^/- /' || true
            echo
            echo "### 消失"
            comm -23 /tmp/old.pkgs /tmp/new.pkgs | sed 's/^/- /' || true
            echo
            echo "> 新增的**原生**依赖要人来决定 \`allowBuilds\`（16 §3：默认 \`false\`）；"
            echo "> 消失的原生依赖可能解锁了以前放弃的选项（docs/42 §1 第 ③⑤ 步）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: tsc -b --force（升级后）
        id: tsc
        run: pnpm exec tsc -b --force

      - name: dsh-adapter 全部测试
        id: tests
        run: pnpm exec vitest run --project @agentsws/dsh-adapter

      - name: 采升级后基线
        id: capture
        run: node packages/dsh-adapter/test/upgrade-baseline/capture.mjs watch-after.json

      # 第 ⑥ 步：逐条对比。用与 upgrade.test.ts 同一套口径，只是这里对着刚采的两份跑
      - name: 对比两份基线
        id: compare
        if: always()
        run: |
          set -euo pipefail
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs')
          const dir = 'packages/dsh-adapter/test/upgrade-baseline'
          const read = (f) => JSON.parse(fs.readFileSync(`${dir}/${f}`, 'utf8'))
          const a = read('watch-before.json')
          const b = read('watch-after.json')
          const types = (fp) => fp.events.map((e) => e.slice(0, e.indexOf('@')))
          const rows = []
          let worst = 0
          let bad = 0
          for (const rt of ['dsh-in-process', 'dsh-subprocess']) {
            for (const id of Object.keys(a.runtimes[rt]).sort()) {
              const x = a.runtimes[rt][id]
              const y = b.runtimes[rt][id]
              if (y === undefined) { rows.push([rt, id, '场景没了', '—', '❌']); bad++; continue }
              const seq = JSON.stringify(types(x)) === JSON.stringify(types(y))
              const full = JSON.stringify(x.events) === JSON.stringify(y.events)
              const inv = Object.values(y.invariants).every(Boolean)
              const from = x.metrics.tokens_per_item ?? 0
              const to = y.metrics.tokens_per_item ?? 0
              const drift = from === 0 ? (to === 0 ? 0 : Infinity) : Math.abs((to - from) / from) * 100
              if (Number.isFinite(drift)) worst = Math.max(worst, drift)
              const ok = seq && inv && drift <= 5
              if (!ok) bad++
              rows.push([rt, id, seq ? (full ? '逐条相同' : '类型同/时刻变') : '**变了**',
                         Number.isFinite(drift) ? `${drift.toFixed(2)}%` : '∞', ok ? '✅' : '❌'])
            }
          }
          console.log('## 升级前后对比')
          console.log('')
          console.log(`\`${a.dsh_version}\` → \`${b.dsh_version}\``)
          console.log('')
          console.log('| 运行时 | 场景 | 事件序列 | tokens_per_item 偏差 | |')
          console.log('|---|---|---|---|---|')
          for (const r of rows) console.log(`| ${r.join(' | ')} |`)
          console.log('')
          const verdict = bad === 0
            ? `✅ 全部相同，最大 token 偏差 ${worst.toFixed(2)}%（阈值 5%）`
            : `❌ ${bad} 处不一致，最大 token 偏差 ${Number.isFinite(worst) ? worst.toFixed(2) + '%' : '∞'}`
          console.log(`**结论：${verdict}**`)
          console.log('')
          console.log('> 这只是"行为一不一样"。**纳不纳入是人的决定**：还要按 docs/42 第 ④ 步')
          console.log('> 逐个 seam 对着 `.d.ts` diff 看一遍、按第 ⑤ 步重判上次放弃的选项。')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `verdict=${verdict}\n`)
          JS

      # 采出来的两份基线只当 artifact，不进仓库
      - name: 上传两份基线
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-watch-baselines
          path: packages/dsh-adapter/test/upgrade-baseline/watch-*.json
          if-no-files-found: warn
          retention-days: 30

  # ── 报告：周报一周一条（已有就追评论），dsh 新版一个版本一条 ────────────────
  report:
    name: 报告 · 开 issue（不开 PR、不合并）
    needs: [observe, default-flips, try-upgrade]
    # daily 且 dsh 没新版 = 零输出：这一趟连这个 job 都不起
    if: >-
      always()
      && needs.observe.result == 'success'
      && inputs.dry_run != 'true'
      && (needs.observe.outputs.scope == 'weekly' || needs.observe.outputs.dsh_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: upstream-*
          merge-multiple: true
          path: out/upstream

      - uses: actions/github-script@v7
        env:
          SCOPE: ${{ needs.observe.outputs.scope }}
          TITLE: ${{ needs.observe.outputs.title }}
          VERDICT: ${{ needs.try-upgrade.outputs.verdict }}
          DSH_CHANGED: ${{ needs.observe.outputs.dsh_changed }}
        with:
          script: |
            const fs = require('node:fs')
            const { SCOPE, TITLE, VERDICT, DSH_CHANGED } = process.env
            const read = (p) => { try { return fs.readFileSync(p, 'utf8') } catch { return null } }

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const parts = [read('out/upstream/report.md') ?? '（报告没生成，见运行日志）']

            if (DSH_CHANGED === 'true') {
              parts.push('', '---', '')
              parts.push(read('out/upstream/default-flips.md') ??
                '### ④bis 默认值扫描\n\n❌ **没跑成**，见运行日志。这一步是 docs/42 §3 定的启用前提，要人工补做。')
              parts.push('', '### ⑥ 自动试升级', '')
              parts.push(VERDICT || '（试升级没跑完，见运行日志）')
              parts.push('', '完整对比表、依赖树 diff 与两份基线在这次运行的 artifact 里。', '')
              parts.push('### 接下来（人做）', '')
              parts.push('按 `docs/42-上游升级流程-v1.md` 的 checklist 走：', '')
              parts.push('- [ ] ② 看清 dist-tags：latest 是不是 rc？有没有同号的正式版？')
              parts.push('- [ ] ③ 依赖树 diff：新增的原生依赖 `allowBuilds: false` + 写注释；消失的删掉并想一想它解锁了什么')
              parts.push('- [ ] ④ 逐个 seam 对着 `.d.ts` diff 看，填 `packages/dsh-adapter/UPGRADE.md` 的表（「出处」列不许空）')
              parts.push('- [ ] ④bis 上面扫出来的默认值逐条判：出网 / 上报 / 遥测翻成默认开的，在 profile 的 patch 层关掉并加测试')
              parts.push('- [ ] ⑤ 重判上次放弃的选项（官方 SDK 等），换与不换的线事先说死')
              parts.push('- [ ] ⑥ 指标若真变了，逐条解释之后才可以 `--rewrite-baseline`')
              parts.push('- [ ] ⑦ 全仓验证：四运行时 × 场景矩阵 + 15 人 pack')
              parts.push('- [ ] 改完同步 `upstreams.yml` 的 `locked_version`（CI 会查它和 package.json 一致）')
            }

            parts.push('', `运行记录：${run}`, '')
            parts.push('> 17 §4：**任一红 = 不升级**。自动化只负责把事实摆出来（docs/10 §3.3 第 ⑤ 步是人看）。')
            const body = parts.join('\n')

            // 去重：周报按"上游周报 <年>-W<周>"，dsh 新版按"上游哨兵：dsh <旧> → <新>"。
            // 已经有了就追一条评论，不再开第二条 —— 一周被开五条 issue 的哨兵没人看。
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${TITLE}"`,
            })
            const hit = found.data.items.find((i) => i.title === TITLE)
            if (hit) {
              core.info(`已经有了：#${hit.number}，追一条评论`)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              })
              return
            }
            const labels = SCOPE === 'weekly' ? ['upstream'] : ['upstream', 'dsh']
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: TITLE,
              body,
              labels,
            })
