name: Release (beta)

# 内测发版（WP111）。`git tag v0.1.0-beta.1 && git push --tags` 之后这条流水线负责：
#
#   下捆绑 Node 与原生模块 → tsc -b → electron-builder → 把产物与 latest*.yml
#   传到**那个 tag 的 GitHub Release**（prerelease，不是草稿）。
#
# 三条纪律：
#
# 1. **里面没有任何密钥。** 上传用的是 workflow 自带的 `GITHUB_TOKEN`，
#    签名与公证一概不做（`CSC_*` / `APPLE_*` 一个都不设）。要签名的那天再补，
#    补的时候是往这里加 secret，不是把现在这份改成"看起来像签了"。
# 2. **每个平台在自己的机器上打。** 原生模块与捆绑的 Node 都是按平台取的，
#    交叉打包出来的包我们验不了——`after-pack.mjs` 的那道 import 冒烟也只有
#    同平台才跑得起来。
# 3. **版本号只有一个出处：tag。** 不在仓库里另存一份 `version`，也不手改
#    `package.json` —— 打包前从 tag 反写进去，对不上的可能性就没有了。

on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 手动重跑某个已经打好的 tag（例如 v0.1.0-beta.1）
        required: true
      # WP219（docs/90 §4）：只打内容包（已审的第三方内容），不打桌面壳 / 插件。tag 随便填（例如 main），不用它
      content_only:
        description: 只打内容包（已审的第三方内容），不打软件安装包
        type: boolean
        default: false
      content_channel:
        description: 内容包发到哪个渠道（只打内容包时用；推 tag 时按 tag 自动定）
        type: choice
        options: [beta, stable]
        default: beta
      content_publish:
        description: 手动触发时把内容包真传上去（默认只打包自检、留 artifact）
        type: boolean
        default: false

permissions:
  # 只为了往 Release 上传产物。没有别的权限。
  contents: write

env:
  npm_config_update_notifier: 'false'

jobs:
  build:
    name: ${{ matrix.label }}
    # WP219：只打内容包的那一趟不打安装包
    if: github.event.inputs.content_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # 一个平台挂了，别的照样发得出去——内测用户不该因为 Linux 打挂了而拿不到 Windows 包
      fail-fast: false
      matrix:
        include:
          # Windows 是第一优先：第一位内测用户用 Windows
          - os: windows-latest
            label: Windows x64（NSIS）
            target: win32-x64
            builder: --win
          - os: macos-14
            label: macOS arm64（Apple 芯片）
            target: darwin-arm64
            builder: --mac --arm64
          - os: macos-13
            label: macOS x64（Intel）
            target: darwin-x64
            builder: --mac --x64
          - os: ubuntu-latest
            label: Linux x64（AppImage，顺带）
            target: linux-x64
            builder: --linux

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      # Node 22：与安装包里捆绑的那一份**同一个大版本**。
      # 这不是口味问题——仓库里装出来的 better-sqlite3 是按这个 Node 的 ABI 编的，
      # 跟捆绑那份对不上，用户那边就是启动即 ERR_DLOPEN_FAILED。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # 版本号从 tag 来（`v0.1.0-beta.1` → `0.1.0-beta.1`），写进桌面壳的 package.json。
      # electron-builder 读它做产物名与 latest*.yml 里的版本。
      - name: 版本号取自 tag
        shell: bash
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          version="${raw#v}"
          echo "打的是 $version"
          node -e "
            const fs = require('node:fs')
            const path = 'apps/desktop/package.json'
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
            pkg.version = process.argv[1]
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          " "$version"
          echo "AGENTSWS_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      # 捆绑的 Node 与按它 ABI 编好的原生模块。sha256 对 node-runtime.lock.json；
      # 对不上就当场失败（不覆盖、不将就）。
      - name: 取捆绑的 Node 与原生模块
        run: node apps/desktop/scripts/fetch-node.mjs --target ${{ matrix.target }}

      - name: tsc -b
        run: pnpm exec tsc -b

      # `--publish always`：产物与 latest*.yml 一起传到这个 tag 的 Release。
      # Release 由 electron-builder 自己建（draft: false、prerelease: true，
      # 见 electron-builder.yml 的 `publish`）。
      - name: electron-builder（打包 + 上传到 Release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 明确关掉签名：没设证书的情况下 electron-builder 在 mac 上会去找钥匙串
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm -F @agentsws/desktop exec electron-builder ${{ matrix.builder }} --publish always

      # 打挂了要看得见是哪一步：afterPack 的那道 import 冒烟不过，日志里就是答案
      - name: 失败时留下 release 目录的清单
        if: failure()
        shell: bash
        run: ls -laR apps/desktop/release || true

  # WP119（68）：浏览器插件的 zip，挂到同一个 Release 上。
  #
  # **只加一个 job，上面那个矩阵一个字没改。** 理由是它跟桌面壳没有一点关系：
  # 不需要捆绑 Node、不需要原生模块、不分平台（MV3 的 zip 三个系统通用），
  # 挤进那个矩阵只会让它在四台机器上各打一遍同一个包。
  #
  # `needs: build`：等桌面壳那几个先把 Release 建出来（Release 是
  # electron-builder 建的），这里只往上传一个文件。桌面壳全挂了就不传——
  # 一个只有插件 zip 的 Release 对内测用户没有意义。
  extension:
    name: 浏览器插件参考实现（开源版 zip；官方完整版见私有 Release）
    needs: build
    if: github.event.inputs.content_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # 版本号同样只有 tag 一个出处（与上面那个 job 逐字同一条纪律）。
      - name: 版本号取自 tag
        shell: bash
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          version="${raw#v}"
          echo "打的是 $version"
          node -e "
            const fs = require('node:fs')
            const path = 'apps/extension/package.json'
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
            pkg.version = process.argv[1]
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          " "$version"

      - name: build（wxt build && wxt zip）
        run: pnpm -F @agentsws/extension build

      # 用 workflow 自带的 GITHUB_TOKEN 往那个 tag 的 Release 上传。
      # `--clobber`：重跑同一个 tag 时覆盖，而不是失败。
      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          zip="$(ls apps/extension/build/*.zip | head -n 1)"
          echo "上传 $zip → $tag"
          gh release upload "$tag" "$zip" --clobber

  # ── WP219（docs/90 §4）：内容包——已审的第三方内容，打包、签名、传到下载站与 GitHub Release ──
  #
  # 与上面两个作业**互不依赖**：内容包不等安装包，安装包打挂了内容包照样发（反之亦然）。
  #
  # 纪律：
  # 1. **签名私钥只在这里用**：GitHub Actions secret `CONTENT_SIGNING_KEY`（ed25519，PKCS#8 PEM），
  #    仓库里只有这个名字，值由 Luoye 填（`node scripts/content-keygen.mjs` 生成，docs/90 §4.2）。
  # 2. **签出去的就是审过的那一份**：`content-reviews.json` 里摘要对得上最新审核记录的条目才打；
  #    没审过 / 审完又改过 / 扫描命中没逐条放行的不打（列进作业摘要），没有可打的就不出包、作业照样绿。
  # 3. **上传前用应用里内置的公钥再验一遍**（`verify --builtin`）：secret 里的私钥与发出去的应用对不上，
  #    用户端一份都不会收——那就别传。
  # 4. **先传文件、再传签名、最后传清单**：客户端看到新清单时，它指的文件已经都在了。
  # 5. 推 tag 才真传；手动触发默认只打包自检（`content_publish` 打勾才传）。R2 凭据与 WP218 同三样 secret。
  content:
    name: 内容包（已审的第三方内容）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CONTENT_UPLOAD: ${{ github.event_name == 'push' || github.event.inputs.content_publish == 'true' }}
    steps:
      # 推 tag：打那个 tag 的内容；手动：打主干上（当前分支）审过的内容
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # 打包 / 签名 / 扫描都在 packages/skills（它引用的 contracts 一起编）
      - name: tsc -b（skills 与 contracts）
        run: pnpm exec tsc -b packages/skills

      - name: 渠道
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.content_channel }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          ONLY: ${{ github.event.inputs.content_only }}
        run: |
          if [ "$ONLY" = "true" ] && [ -n "$INPUT_CHANNEL" ]; then ch="$INPUT_CHANNEL"
          elif [[ "$TAG" == *-* ]]; then ch=beta
          else ch=stable
          fi
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
          echo "内容包渠道：$ch" >> "$GITHUB_STEP_SUMMARY"

      - name: 打包 + 签名（只打审过的）
        id: pack
        env:
          CONTENT_SIGNING_KEY: ${{ secrets.CONTENT_SIGNING_KEY }}
        run: node scripts/content-pack.mjs build --channel "${{ steps.channel.outputs.channel }}" --out out/content

      - name: 用应用里内置的公钥再验一遍
        if: steps.pack.outputs.published == 'true'
        run: node scripts/content-pack.mjs verify --dir "out/content/r2/${{ steps.channel.outputs.channel }}" --builtin

      - uses: actions/upload-artifact@v4
        if: steps.pack.outputs.published == 'true'
        with:
          name: content-pack
          path: out/content/
          retention-days: 14

      - name: 检查 R2 凭据都填了（只看有没有，不打印值）
        if: steps.pack.outputs.published == 'true' && env.CONTENT_UPLOAD == 'true'
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$R2_ACCESS_KEY_ID" ] && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$R2_SECRET_ACCESS_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "$R2_ACCOUNT_ID" ] && missing="$missing R2_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "缺 Actions secrets：$missing"; exit 1; fi

      # 与 WP218 同一个桶（`agentsws-downloads`，仓库变量 R2_BUCKET 可改），`content/<渠道>/` 前缀
      - name: 传到下载站（dl.agentsws.com/content/<渠道>/：先文件、再签名、最后清单）
        if: steps.pack.outputs.published == 'true' && env.CONTENT_UPLOAD == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'agentsws-downloads' }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CH: ${{ steps.channel.outputs.channel }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          put() { aws s3 cp "$1" "s3://${R2_BUCKET}/content/$2" --endpoint-url "$endpoint" \
            --content-type "$3" --cache-control "$4" --only-show-errors; }
          for f in out/content/r2/"$CH"/blobs/*; do
            put "$f" "$CH/blobs/$(basename "$f")" application/octet-stream 'public, max-age=31536000, immutable'
          done
          put "out/content/r2/$CH/content-manifest.json.sig" "$CH/content-manifest.json.sig" text/plain 'no-cache, max-age=0'
          put "out/content/r2/$CH/content-manifest.json" "$CH/content-manifest.json" application/json 'no-cache, max-age=0'

      # 镜像：每个渠道一条滚动的 Release（tag `content-<渠道>`，第一次由这一步建），文件平铺（blob-<sha256>）
      - name: 镜像到 GitHub Release content-<渠道>
        if: steps.pack.outputs.published == 'true' && env.CONTENT_UPLOAD == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CH: ${{ steps.channel.outputs.channel }}
        run: |
          rel="content-$CH"
          if ! gh release view "$rel" >/dev/null 2>&1; then
            gh release create "$rel" --target "$GITHUB_SHA" --prerelease \
              --title "内容更新（$CH）" \
              --notes "已审的第三方内容（技能等）的内容包，Agents 工坊的应用会自己取，不用手动下载。docs/90。"
          fi
          gh release upload "$rel" out/content/github/blob-* --clobber
          gh release upload "$rel" out/content/github/content-manifest.json.sig --clobber
          gh release upload "$rel" out/content/github/content-manifest.json --clobber
