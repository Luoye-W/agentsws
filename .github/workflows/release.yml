name: Release

# 发版（WP111 起；WP218 改成「自有下载站为主、GitHub Releases 为镜像」）。
#
#   推 tag（v1.2.3 = stable，v1.2.3-beta.4 = beta）
#     → 每个平台在自己的机器上打（Windows 在 windows runner、mac 在 mac runner）
#     → Windows 包装起来真跑一遍（不过不发）
#     → 收拢：两份 latest-mac.yml 合成一份、产物结构自检、生成官网 downloads.json
#     → 同一套产物传到 **R2（dl.agentsws.com/<渠道>/）** 和 **GitHub Releases**
#     → 更新 downloads.json（官网下载页与首页「下载」按钮读它）
#
# 纪律：
# 1. **只有推 tag 才发版。** 手动触发（workflow_dispatch）默认 dry_run：只打包、只收拢、只自检，
#    产物留作这次运行的 artifact，**一个字节都不上传**。
# 2. **仓库里没有任何真实凭据。** R2 的三样只按 secret 的名字引用（R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY /
#    R2_ACCOUNT_ID），值由 Luoye 在仓库 Settings → Secrets 里自己填；GitHub 那边用 workflow 自带的 GITHUB_TOKEN。
#    不签名、不公证（CSC_IDENTITY_AUTO_DISCOVERY=false）。
# 3. **版本号只有一个出处：tag。** 打包前反写进 apps/desktop/package.json。
# 4. **先传安装包、最后传 latest*.yml。** 客户端看到新的 latest.yml 时，它指的文件一定已经在了。
# 5. **每个平台在自己的机器上打。** 交叉打出来的包我们验不了（afterPack 的 import 冒烟只在同平台跑得起来）。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要打的 tag（例如 v0.2.0-beta.1）。dry_run 时不需要真有这个 tag，只借它的版本号
        required: true
      dry_run:
        description: 只打包与自检，不上传到 R2 / GitHub（默认是）
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  npm_config_update_notifier: 'false'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # 推 tag 一定是真发；手动触发看 dry_run（默认 true）
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' }}
  # 自有下载站根地址。换域名只改这一行（客户端里的默认值在 apps/desktop/src/update-feed.ts）。
  DOWNLOAD_BASE: https://dl.agentsws.com

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # 一个平台挂了另一个照样打完（publish 要求全部成功才上传）
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64（NSIS）
            target: win32-x64
            builder: --win --x64
          - os: macos-14
            label: macOS arm64（Apple 芯片）
            target: darwin-arm64
            builder: --mac --arm64
          # macos-13 已下线；Intel mac 用 macos-15-intel
          - os: macos-15-intel
            label: macOS x64（Intel）
            target: darwin-x64
            builder: --mac --x64

    steps:
      # 推 tag：打那个 tag；手动真发：打输入的那个 tag；dry_run：打当前分支
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || (github.event.inputs.dry_run == 'false' && github.event.inputs.tag) || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: 版本号与渠道取自 tag
        shell: bash
        run: |
          eval "$(node apps/desktop/scripts/release-manifest.mjs tag "$RELEASE_TAG")"
          echo "打的是 $version（$channel）"
          node -e "
            const fs = require('node:fs')
            const p = 'apps/desktop/package.json'
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
            pkg.version = process.argv[1]
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
          " "$version"
          echo "AGENTSWS_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "AGENTSWS_UPDATE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: 取捆绑的 Node 与原生模块
        run: node apps/desktop/scripts/fetch-node.mjs --target ${{ matrix.target }}

      - name: tsc -b
        run: pnpm exec tsc -b

      - name: 工作台构建（装进安装包）
        run: pnpm --filter @agentsws/workstation build

      # 更新源写进安装包的 app-update.yml：generic → $DOWNLOAD_BASE/<渠道>（scripts/dist.mjs 按变量算）
      - name: electron-builder（只打包，不上传）
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AGENTSWS_UPDATE_PROVIDER: generic
          AGENTSWS_UPDATE_BASE_URL: ${{ env.DOWNLOAD_BASE }}
        run: cd apps/desktop && node scripts/dist.mjs ${{ matrix.builder }}

      - name: Windows 包装起来真跑一遍（不过就不发）
        if: matrix.target == 'win32-x64'
        shell: bash
        run: |
          node apps/desktop/scripts/win-install-smoke.mjs \
            --installer "apps/desktop/release/Agents-Workshop-Setup-${AGENTSWS_RELEASE_VERSION}-x64.exe" \
            --out win-smoke

      # 两台 mac 各出一份 latest-mac.yml，改名带上架构，publish 那一步再合并
      - name: 收产物
        shell: bash
        run: |
          mkdir -p out
          for f in apps/desktop/release/Agents-Workshop-* apps/desktop/release/latest.yml; do
            case "$f" in *.exe|*.dmg|*.blockmap|*/latest.yml) [ -f "$f" ] && cp "$f" out/ ;; esac
          done
          if [ -f apps/desktop/release/latest-mac.yml ]; then
            cp apps/desktop/release/latest-mac.yml "out/latest-mac-${{ matrix.target }}.yml"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: out/
          retention-days: 7

      - name: 上传 Windows 冒烟日志与截图
        if: always() && matrix.target == 'win32-x64'
        uses: actions/upload-artifact@v4
        with:
          name: win-smoke
          path: win-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: 失败时留下 release 目录的清单
        if: failure()
        shell: bash
        run: ls -laR apps/desktop/release || true

  # 浏览器插件的开源版 zip（WP119）。不分平台，单独打一次。
  extension:
    name: 浏览器插件参考实现（开源版 zip）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || (github.event.inputs.dry_run == 'false' && github.event.inputs.tag) || '' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: 版本号取自 tag
        shell: bash
        run: |
          eval "$(node apps/desktop/scripts/release-manifest.mjs tag "$RELEASE_TAG")"
          node -e "
            const fs = require('node:fs')
            const p = 'apps/extension/package.json'
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
            pkg.version = process.argv[1]
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
          " "$version"
          echo "AGENTSWS_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: build（wxt build && wxt zip）
        run: pnpm -F @agentsws/extension build
      # 统一改成官网清单认的名字
      - name: 收产物
        shell: bash
        run: |
          mkdir -p out
          zip="$(ls apps/extension/build/*.zip | head -n 1)"
          cp "$zip" "out/agents-workshop-extension-${AGENTSWS_RELEASE_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-extension
          path: out/
          retention-days: 7

  publish:
    name: 收拢 → 上传 R2 与 GitHub Releases → 更新 downloads.json
    needs: [build, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 只为了建 Release、传附件。没有别的权限。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || (github.event.inputs.dry_run == 'false' && github.event.inputs.tag) || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: 收拢（合并 latest-mac.yml、自检产物结构、生成 downloads.json）
        shell: bash
        run: |
          eval "$(node apps/desktop/scripts/release-manifest.mjs tag "$RELEASE_TAG")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          node apps/desktop/scripts/release-manifest.mjs merge-mac --out artifacts/latest-mac.yml artifacts/latest-mac-*.yml
          rm artifacts/latest-mac-*.yml
          node apps/desktop/scripts/release-manifest.mjs check --dir artifacts --version "$version"
          node apps/desktop/scripts/release-manifest.mjs downloads --dir artifacts --version "$version" \
            --base "$DOWNLOAD_BASE" --released "$(date -u +%F)" --out downloads.json
          ls -la artifacts
          cat downloads.json

      - name: dry-run：留下收拢后的整套产物（不上传）
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          retention-days: 7
          path: |
            artifacts/
            downloads.json

      # ── 以下只在真发版时跑 ──────────────────────────────────────────────

      - name: 检查 R2 凭据都填了（只看有没有，不打印值）
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$R2_ACCESS_KEY_ID" ] && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$R2_SECRET_ACCESS_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "$R2_ACCOUNT_ID" ] && missing="$missing R2_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "缺 Actions secrets：$missing"; exit 1; fi

      # R2 走 S3 兼容接口。桶名在仓库变量 R2_BUCKET 里（不是机密），没设就用 agentsws-downloads。
      # 新版 aws cli 默认带的校验和头 R2 不全认，关成「需要时才算」。
      - name: 上传到 R2（先安装包、后 latest*.yml）
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'agentsws-downloads' }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          put() { # 本地文件 远端键 类型 缓存
            aws s3 cp "$1" "s3://${R2_BUCKET}/$2" --endpoint-url "$endpoint" \
              --content-type "$3" --cache-control "$4" --only-show-errors
          }
          long='public, max-age=31536000, immutable'
          short='no-cache, max-age=0'
          for f in artifacts/*.exe; do put "$f" "$CHANNEL/$(basename "$f")" application/vnd.microsoft.portable-executable "$long"; done
          for f in artifacts/*.dmg; do put "$f" "$CHANNEL/$(basename "$f")" application/x-apple-diskimage "$long"; done
          for f in artifacts/*.blockmap; do put "$f" "$CHANNEL/$(basename "$f")" application/octet-stream "$long"; done
          for f in artifacts/*.zip; do put "$f" "$CHANNEL/$(basename "$f")" application/zip "$long"; done
          # 最后才换版本信息：客户端看到它时，它指的文件已经都在了
          put artifacts/latest-mac.yml "$CHANNEL/latest-mac.yml" text/yaml "$short"
          put artifacts/latest.yml "$CHANNEL/latest.yml" text/yaml "$short"
          put downloads.json "$CHANNEL/downloads.json" application/json "$short"

      - name: 镜像到 GitHub Releases（同一套产物）
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""
          [ "$CHANNEL" = "beta" ] && pre="--prerelease"
          gh release create "$RELEASE_TAG" --verify-tag $pre \
            --title "Agents 工坊 $VERSION" \
            --notes "下载与安装：https://agentsws.com/download/ （应用内会自动提示更新）" \
            artifacts/*.exe artifacts/*.dmg artifacts/*.blockmap artifacts/*.zip \
            artifacts/latest.yml artifacts/latest-mac.yml

      # 官网下载页读根目录那份。哪个渠道上官网由仓库变量 SITE_DOWNLOAD_CHANNEL 定（没设 = beta：
      # 正式版发出来之前官网只能放 beta）；stable 发版总是更新它。
      - name: 更新官网 downloads.json
        if: env.DRY_RUN != 'true' && (env.CHANNEL == 'stable' || env.CHANNEL == (vars.SITE_DOWNLOAD_CHANNEL || 'beta'))
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'agentsws-downloads' }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp downloads.json "s3://${R2_BUCKET}/downloads.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control 'no-cache, max-age=0' --only-show-errors
