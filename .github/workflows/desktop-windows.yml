name: Desktop · Windows（打包 + 装起来真跑）

# WP218：Windows 安装包在 windows-latest 上真打、真装、真跑一遍。**不发布、不上传到任何下载站**，
# 产物只作为这次运行的 artifact（14 天后自动过期）。
#
#   取 win32-x64 的捆绑 Node 与原生模块 → tsc -b → 工作台 vite build → 装包前冒烟（WP290）→ electron-builder（NSIS x64，
#   afterPack 用捆绑 Node 冒烟 import 一遍）→ 静默安装到带中文和空格的目录 → Playwright 起装好的 exe
#   → /v1/health 200 → 打开工作台首页（截图）→ 单实例 → 只听 127.0.0.1 → 退出不留孤儿进程 → 静默卸载
#
# 为什么不在 mac 上交叉打：原生模块与捆绑的 Node 都按平台取，交叉打出来的包我们验不了。
# 里面没有任何密钥；不签名（CSC_IDENTITY_AUTO_DISCOVERY=false）。

on:
  pull_request:
    paths:
      - apps/desktop/**
      - apps/server/**
      - apps/workstation/**
      - packages/dsh-adapter/**
      - profiles/agentsws/**
      - packages/stand-ins/**
      - scripts/preinstall-smoke*.mjs
      - pnpm-lock.yaml
      - .github/workflows/desktop-windows.yml
  push:
    branches: ['wp/**']
    paths:
      - apps/desktop/**
      - apps/server/**
      - apps/workstation/**
      - packages/dsh-adapter/**
      - profiles/agentsws/**
      - packages/stand-ins/**
      - scripts/preinstall-smoke*.mjs
      - pnpm-lock.yaml
      - .github/workflows/desktop-windows.yml
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  npm_config_update_notifier: 'false'

jobs:
  nsis:
    name: NSIS x64 · 打包 + 装起来真跑
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # 与捆绑的 Node 同一个大版本（仓库里装出来的原生模块按它的 ABI 编）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: 取捆绑的 Node 与原生模块（win32-x64，sha256 对 node-runtime.lock.json）
        run: node apps/desktop/scripts/fetch-node.mjs --target win32-x64

      - name: tsc -b
        run: pnpm exec tsc -b

      - name: 工作台构建（装进安装包的 <resources>/workstation）
        run: pnpm --filter @agentsws/workstation build

      # WP290（决策 332）：装包前真机冒烟——用这次的构建、真 dsh、本机假模型，每个岗位走一遍
      # （问一句 / 交办出卡 / 点掉 / 事项状态 / 没跑成）。没过就不打安装包。表与原始错误在 win-smoke/。
      - name: 装包前冒烟（真 dsh × 每个岗位；没过就不出安装包）
        shell: bash
        run: |
          mkdir -p win-smoke
          node scripts/preinstall-smoke.mjs --json win-smoke/preinstall-smoke.json | tee win-smoke/preinstall-smoke.md

      # 版本号：CI 包标成 0.0.0-ci.<运行号>，和真发版的号不会撞
      - name: electron-builder（NSIS x64，不上传）
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node -e "
            const fs = require('node:fs')
            const p = 'apps/desktop/package.json'
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
            pkg.version = '0.0.0-ci.${{ github.run_number }}'
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
          "
          cd apps/desktop && node scripts/dist.mjs --win --x64

      # WP225：用 pwsh 跑——Git Bash 把 node 崩溃时的 Windows 退出码（NTSTATUS）一律报成 127，
      # 这里把原始退出码按十六进制打出来（0xC0000409 / 0xC0000005 …）
      - name: 装起来真跑（静默安装 → 启动 → health → 工作台首页 → 退出 → 卸载）
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release/Agents-Workshop-Setup-*.exe | Select-Object -First 1
          Write-Host "安装包：$($installer.FullName)"
          node apps/desktop/scripts/win-install-smoke.mjs --installer $installer.FullName --out win-smoke
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Host ("冒烟没过，退出码 {0}（0x{0:X8}）" -f $code); exit 1 }

      - name: 上传安装包（只是这次运行的 artifact，不是发布）
        # 冒烟没过也传：安装包本身打出来了，拿去真机上查问题（10-05 Fable）
        if: always() && hashFiles('apps/desktop/release/Agents-Workshop-Setup-*.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agentsws-windows-x64
          retention-days: 14
          path: |
            apps/desktop/release/Agents-Workshop-Setup-*.exe
            apps/desktop/release/Agents-Workshop-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml

      - name: 上传冒烟日志与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-smoke
          retention-days: 14
          if-no-files-found: ignore
          path: |
            win-smoke/
            apps/desktop/release/builder-debug.yml

      - name: 失败时留下 release 目录的清单
        if: failure()
        shell: bash
        run: ls -laR apps/desktop/release || true

  # WP225（WP218 遗留）：两个真实版本之间点一次「更新」。打 N 与 N+1 两个包（更新源都指到本机回环端口），
  # 装 N → 本机起更新源只喂 N+1 → 左下角按钮「有新版」→ 下载 → 重启并更新 → 新版本起来、数据还在。
  # 与上面那个作业并行跑；同样不发布、不上传到任何下载站。
  update-e2e:
    name: 两个版本之间点更新（N → N+1，本机更新源）
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      FEED_PORT: '47613'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: 取捆绑的 Node 与原生模块（win32-x64）
        run: node apps/desktop/scripts/fetch-node.mjs --target win32-x64

      - name: tsc -b
        run: pnpm exec tsc -b

      - name: 工作台构建
        run: pnpm --filter @agentsws/workstation build

      # 回环上的 http 更新源只为这个测试放行（src/update-feed.ts 的 normalizeBaseUrl）
      - name: 打 N 与 N+1（更新源指到 http://127.0.0.1:${{ env.FEED_PORT }}）
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AGENTSWS_UPDATE_BASE_URL: http://127.0.0.1:${{ env.FEED_PORT }}
        run: |
          set_version() {
            node -e "
              const fs = require('node:fs')
              const p = 'apps/desktop/package.json'
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
              pkg.version = process.argv[1]
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
            " "$1"
          }
          set_version "0.0.0-ci.${{ github.run_number }}"
          (cd apps/desktop && node scripts/dist.mjs --win --x64)
          mkdir -p update-e2e/n update-e2e/n1
          cp apps/desktop/release/Agents-Workshop-Setup-0.0.0-ci.*-x64.exe update-e2e/n/
          set_version "0.0.1-ci.${{ github.run_number }}"
          (cd apps/desktop && node scripts/dist.mjs --win --x64)
          cp apps/desktop/release/latest.yml apps/desktop/release/Agents-Workshop-Setup-0.0.1-ci.*-x64.exe* update-e2e/n1/
          ls -la update-e2e/n update-e2e/n1

      - name: 两个版本之间点更新（装 N → 下载 → 重启并更新 → N+1 起来、数据还在）
        shell: pwsh
        run: |
          $old = Get-ChildItem update-e2e/n/Agents-Workshop-Setup-*.exe | Select-Object -First 1
          node apps/desktop/scripts/win-update-e2e.mjs --old $old.FullName --new-dir update-e2e/n1 --port $env:FEED_PORT --out win-update
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Host ("更新端到端没过，退出码 {0}（0x{0:X8}）" -f $code); exit 1 }

      - name: 上传端到端日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-update
          retention-days: 14
          if-no-files-found: ignore
          path: win-update/
