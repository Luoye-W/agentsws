<!doctype html>
<html lang="en">
<head>

  <title>Opening soon</title>
  <link rel="stylesheet" href="//cdn.shopify.com/s/files/1/0000/0001/t/1/assets/password.css">

<body class="template-password">
  <main>
    <h1>Opening soon</h1>
    <p>Be the first to know when we launch. Read our terms of service and privacy policy for how we handle your email, refund and shipping details will follow at launch.</p>
    <form method="post" action="/password" id="login_form" accept-charset="UTF-8" class="storefront-password-form">
      <input type="hidden" name="form_type" value="storefront_password" />

      <input type="password" name="password" id="password" />
      <button type="submit">Enter</button>
