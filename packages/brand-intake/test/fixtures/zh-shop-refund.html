    <h1>退款政策</h1>
    <p>叶语茶舍的茶饼收到后 7 天内未拆封可以无理由退货，运费由我们承担。已拆封的茶饼如有受潮、霉变等质量问题，拍照联系客服即可全额退款，不需要寄回。</p>
    <p>退款会在我们确认后 3 个工作日内原路退回。整提（7 饼）购买的，单饼退货按整提折扣价计算。礼盒装拆封后不支持无理由退货，但质量问题照样全额退款。如果你对退款有任何疑问，请发邮件给客服，我们一般在一个工作日内答复。</p>
    <p>换货：同款茶饼换不同年份的，补差价即可，来回运费我们出一程。海外订单因清关原因暂不支持退货，质量问题按实际情况部分或全部退款。</p>
  </main>
