<h1>Shipping</h1>
<p>Orders leave our warehouse within one business day. Shipping inside the EU is free above 80 EUR and takes two to four working days. We ship to the US and Canada with tracked delivery in five to nine working days; import duties are paid by the recipient. We do not ship to PO boxes.</p>
