  # `apps/server/src/kol-channels.ts`。WP67 骨架期就把副作用标好的理由在这里
  # 兑现了：这张表默认 write，漏标的读动作拿不到 role-read 令牌——
  # 接上那天不用回来补一遍，也不会出现"接上了却读不了"。
  #
  # 写口也逐条列出来。红人这五条职责**不经连接器发信**（开发信是账本上的
