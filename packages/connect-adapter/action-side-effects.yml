# 18 §1：OpenConnector 目录里没有 side_effect 字段，由这张覆盖表决定。
#
# 纪律（不要放宽）：
#   - **未标的一律按 write**（`default: write`），宁可让读被当成写而多一道门，也不能让写混进 role-read；
#   - 只有"确定不改上游状态"的 Action 才标 read；
#   - GraphQL / 批量 / 代码执行类（`execute_graphql`、`submit_bulk_query`）永远是 write——
#     它们的副作用取决于运行时传入的文档，静态判不了。
#
# 校验：`actions` 的键必须是全名 `service.action`；`patterns` 支持结尾 `*` 通配。
version: 1
default: write

patterns:
  # 逃生阀：新增的 get_/list_ 类 Action 在补进下表之前仍按 write（default），
  # 这里只给"确定整族只读"的服务开通配，且必须逐个服务显式写出来。
  - match: aftership.list_*
    side_effect: read

