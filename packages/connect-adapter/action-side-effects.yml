# 18 §1：OpenConnector 目录里没有 side_effect 字段，由这张覆盖表决定。
#
# 纪律（不要放宽）：
#   - **未标的一律按 write**（`default: write`），宁可让读被当成写而多一道门，也不能让写混进 role-read；
#   - 只有"确定不改上游状态"的 Action 才标 read；
#   - GraphQL / 批量 / 代码执行类（`execute_graphql`、`submit_bulk_query`）永远是 write——
#     它们的副作用取决于运行时传入的文档，静态判不了。
#
# 校验：`actions` 的键必须是全名 `service.action`；`patterns` 支持结尾 `*` 通配。
version: 1
default: write

patterns:
  # 逃生阀：新增的 get_/list_ 类 Action 在补进下表之前仍按 write（default），
  # 这里只给"确定整族只读"的服务开通配，且必须逐个服务显式写出来。
  - match: aftership.list_*
    side_effect: read

actions:
  # ---------- Shopify Admin（客服 / 运营主力） ----------
  shopify_admin.get_order: read
  shopify_admin.get_product: read
  shopify_admin.get_customer: read
  shopify_admin.get_collection: read
  shopify_admin.get_shop: read
  shopify_admin.get_location: read
  shopify_admin.get_inventory_item: read
  shopify_admin.get_inventory_quantities: read
  shopify_admin.get_fulfillment_order: read
  shopify_admin.get_bulk_operation: read
  shopify_admin.list_orders: read
  shopify_admin.list_products: read
  shopify_admin.list_product_variants: read
  shopify_admin.list_customers: read
  shopify_admin.list_collections: read
  shopify_admin.list_locations: read
  shopify_admin.list_inventory_items: read
  shopify_admin.list_order_fulfillment_orders: read
  shopify_admin.download_bulk_result: read
  # 主题、页面、博客、元字段、折扣、发布状态的读侧（建站与运营岗位要看的那些）
  shopify_admin.get_theme: read
  shopify_admin.list_themes: read
  shopify_admin.get_theme_asset: read
  shopify_admin.list_theme_assets: read
  shopify_admin.get_page: read
  shopify_admin.list_pages: read
  shopify_admin.get_blog: read
  shopify_admin.list_blogs: read
  shopify_admin.get_article: read
  shopify_admin.list_articles: read
  shopify_admin.get_metafield: read
  shopify_admin.list_metafields: read
  shopify_admin.get_metafield_definition: read
  shopify_admin.list_metafield_definitions: read
  shopify_admin.get_discount: read
  shopify_admin.list_discounts: read
  shopify_admin.get_price_rule: read
  shopify_admin.list_price_rules: read
  shopify_admin.list_publications: read
  shopify_admin.get_product_publications: read
  shopify_admin.get_variant: read
  shopify_admin.get_refund: read
  shopify_admin.list_refunds: read
  shopify_admin.get_return: read
  shopify_admin.list_returns: read
  shopify_admin.get_market: read
  shopify_admin.list_markets: read
  # WP63（51 §2.1 店铺设置 / 数据日报）：店铺设置那一面的**只读**动作。
  # 51 §2.1 与 N2 定死了：结账 / 支付 / 税这些设置 Agent 只准看、不给写动作，
  # 人自己在后台改。所以这一组只有 read，写侧对照表里一条对应的都不会有。
  shopify_admin.get_shop_policy: read
  shopify_admin.list_shop_policies: read
  shopify_admin.get_menu: read
  shopify_admin.list_menus: read
  shopify_admin.get_shipping_zone: read
  shopify_admin.list_shipping_zones: read
  shopify_admin.list_delivery_profiles: read
  shopify_admin.get_payment_settings: read
  shopify_admin.get_tax_settings: read
  shopify_admin.list_payment_terms_templates: read
  # 数据日报那一面：销售 / 订单 / 转化 / 流量的汇总口（明细仍走 list_orders）
  shopify_admin.run_analytics_query: read
  shopify_admin.get_sales_summary: read

  # 写侧：与 `src/shopify-actions.ts` 的对照表一一对应（那张表还回答"对应哪条 ChangeKind"）。
  # 标在这里不是为了"允许"，恰恰相反——默认就是 write，写出来是为了让人一眼看全
  # Agent 有可能碰到的写口都有哪些，以及漏了哪些（漏的按 default 仍是 write）。
  shopify_admin.create_product: write
  shopify_admin.update_product: write
  shopify_admin.update_product_variant: write
  shopify_admin.update_product_price: write
  shopify_admin.publish_product: write
  shopify_admin.unpublish_product: write
  shopify_admin.delete_product: write
  shopify_admin.create_collection: write
  shopify_admin.update_collection: write
  shopify_admin.add_products_to_collection: write
  shopify_admin.remove_products_from_collection: write
  shopify_admin.create_fulfillment: write
  shopify_admin.create_refund: write
  shopify_admin.update_order: write
  shopify_admin.update_order_shipping_address: write
  shopify_admin.cancel_order: write
  shopify_admin.adjust_inventory_quantities: write
  shopify_admin.set_inventory_quantities: write
  shopify_admin.create_discount_code: write
  shopify_admin.update_discount_code: write
  shopify_admin.delete_discount_code: write
  shopify_admin.create_automatic_discount: write
  shopify_admin.update_automatic_discount: write
  shopify_admin.create_theme: write
  shopify_admin.publish_theme: write
  shopify_admin.update_theme_asset: write
  shopify_admin.delete_theme: write
  shopify_admin.set_metafields: write
  shopify_admin.delete_metafield: write
  shopify_admin.create_page: write
  shopify_admin.update_page: write
  shopify_admin.create_article: write
  shopify_admin.update_article: write
  # 副作用取决于传入的 GraphQL 文档 → 永远 write
  shopify_admin.execute_graphql: write
  shopify_admin.submit_bulk_query: write

  # ---------- Gmail ----------
  gmail.get_profile: read
  gmail.get_message: read
  gmail.get_draft: read
  gmail.get_label: read
  gmail.get_filter: read
  gmail.get_auto_forwarding: read
  gmail.get_vacation_settings: read
  gmail.get_language_settings: read
  gmail.list_threads: read
  gmail.list_labels: read
  gmail.list_drafts: read
  gmail.list_filters: read
  gmail.list_history: read
  gmail.list_forwarding_addresses: read
  gmail.search_threads: read
  gmail.fetch_emails: read
  gmail.fetch_message_by_message_id: read
  gmail.fetch_message_by_thread_id: read
  gmail.settings_get_imap: read
  gmail.settings_get_pop: read
  gmail.send_email: write
  gmail.send_draft: write
  gmail.reply_email: write
  gmail.reply_to_thread: write
  gmail.create_draft: write
  gmail.create_email_draft: write
  gmail.update_draft: write
  gmail.delete_draft: write
  gmail.create_label: write
  gmail.update_label: write
  gmail.patch_label: write
  gmail.delete_label: write
  gmail.add_label_to_email: write
  gmail.modify_thread_labels: write
  gmail.batch_modify_messages: write
  gmail.create_filter: write
  gmail.delete_filter: write
  gmail.move_to_trash: write
  gmail.move_thread_to_trash: write
  gmail.untrash_message: write
  gmail.untrash_thread: write
  gmail.stop_watch: write
  gmail.update_imap_settings: write
  gmail.update_pop_settings: write
  gmail.update_vacation_settings: write
  gmail.update_language_settings: write

  # ---------- Meta（Facebook / Instagram） ----------
  meta.get_current_user: read
  meta.get_insights: read
  meta.list_ad_accounts: read
  meta.list_campaigns: read

  # ---------- WhatsApp Cloud API ----------
  whatsapp.get_business_profile: read
  whatsapp.get_phone_number: read
  whatsapp.get_phone_numbers: read
  whatsapp.get_media_info: read
  whatsapp.get_message_templates: read
  whatsapp.get_template_status: read
  whatsapp.send_message: write
  whatsapp.send_template_message: write
  whatsapp.send_media: write
  whatsapp.send_media_by_id: write
  whatsapp.send_location: write
  whatsapp.send_contacts: write
  whatsapp.send_interactive_buttons: write
  whatsapp.send_interactive_list: write
  whatsapp.upload_media: write
  whatsapp.create_message_template: write
  whatsapp.delete_message_template: write

  # ---------- Klaviyo ----------
  klaviyo.get_profile: read
  klaviyo.get_campaign: read
  klaviyo.list_profiles: read
  klaviyo.list_campaigns: read
  klaviyo.list_events: read
  klaviyo.validate_account: read
  # WP64（51 §2.3）：邮件营销这条职责的"读"全在这几个上——分群、模板、活动效果、订阅状态。
  # 连接器还是骨架（目录 + 表单 + 这张表，真调用没接），但副作用先标好：
  # 这张表的默认是 write，漏标的读动作会被当成写而拿不到 role-read 令牌。
  klaviyo.get_segment: read
  klaviyo.list_segments: read
  klaviyo.get_segment_profiles: read
  klaviyo.get_list: read
  klaviyo.list_lists: read
  klaviyo.get_template: read
  klaviyo.list_templates: read
  klaviyo.get_flow: read
  klaviyo.list_flows: read
  klaviyo.get_flow_action: read
  klaviyo.get_campaign_metrics: read
  klaviyo.list_metrics: read
  klaviyo.query_metric_aggregates: read
  klaviyo.list_suppressions: read
  klaviyo.get_subscription_status: read
  # 写侧：这条职责不经连接器发信（`campaign_send` 是账本上的一条变更，永远人审），
  # 标出来是为了让人一眼看全 Klaviyo 那头有哪些写口——漏标的按 default 仍是 write。
  klaviyo.create_campaign: write
  klaviyo.send_campaign: write
  klaviyo.update_flow: write
  klaviyo.update_segment: write
  klaviyo.subscribe_profiles: write
  klaviyo.unsubscribe_profiles: write
  klaviyo.add_to_segment: write
  # create_event 会往 Klaviyo 里写一条事件（并可能触发 flow）→ write
  klaviyo.create_event: write

  # ---------- AfterShip ----------
  aftership.get_tracking: read
  aftership.detect_couriers: read
  # WP64（51 §2.4）：物流轨迹只读。`list_*` 整族已经由上面的 patterns 兜住，
  # 这几条单独写出来是因为它们不叫 list_（对着上游目录逐个核过的）。
  aftership.get_tracking_by_slug: read
  aftership.get_last_checkpoint: read
  aftership.get_courier: read
  aftership.get_notification: read
  aftership.create_tracking: write
  aftership.update_tracking: write
  aftership.delete_tracking: write
  aftership.retrack_tracking: write
  aftership.mark_tracking_completed: write

  # ---------- Gotify（契约一致性套件对真 runtime 用的最小 provider） ----------
  gotify.get_version: read
  gotify.get_health: read
  gotify.send_message: write
