  reddit.list_moderators: read
  reddit.submit_post: write
  reddit.reply_comment: write
  reddit.send_message: write
  reddit.approve_member: write
  # WP73：`/api/approve` 把被删的帖子 / 评论放回去（与上面那条 approve_member 不是一回事）
  reddit.approve_post: write
  reddit.remove_post: write
  reddit.ban_user: write
  reddit.unban_user: write
  reddit.mute_user: write
  # WP73：`/api/distinguish`（加管理员标记 + 置顶）。这条渠道上的"群发"= 一条置顶帖
  reddit.distinguish_post: write
  reddit.update_subreddit_rules: write

