  whatsapp.send_interactive_list: write
  whatsapp.upload_media: write
  whatsapp.create_message_template: write
  whatsapp.delete_message_template: write

  # ---------- Klaviyo ----------
  klaviyo.get_profile: read
  klaviyo.get_campaign: read
  klaviyo.list_profiles: read
  klaviyo.list_campaigns: read
  klaviyo.list_events: read
  klaviyo.validate_account: read
  # create_event 会往 Klaviyo 里写一条事件（并可能触发 flow）→ write
  klaviyo.create_event: write

  # ---------- AfterShip ----------
  aftership.get_tracking: read
  aftership.detect_couriers: read
