# 05 §1.1 / 31 §3.1：单个 Assignment 的 PermissionScope 编译成策略。
# sub = assignment_id，obj = 数据域，act = 操作。range 与 sensitivity 两维由 SQL 主门负责，
# 此处只做“域 × 操作”的二道门；任一门拒绝即拒绝。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && r.obj == p.obj && r.act == p.act
