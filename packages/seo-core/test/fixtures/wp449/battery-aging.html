<h1>How lithium batteries age</h1>
<p>Most lithium-ion cells keep about 80 % of their capacity after 500 full cycles when stored and charged at room temperature.</p>
<p>Heat is the biggest factor: cells kept above 35 °C age noticeably faster.</p>
