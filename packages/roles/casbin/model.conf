# 05 §1.1 / 31 §3.1：权限判定用完整元组 (assignment, domain, op, range, sensitivity)，任一维不满足即拒。
# sub 是 assignment_id 而不是 person_id：每次运行绑定一个 Assignment，不做跨 Assignment 并集。
[request_definition]
r = sub, dom, op, rng, sens

[policy_definition]
p = sub, dom, op, rng, sens

[policy_effect]
e = some(where (p.eft == allow))

# rangeCovers：授予 workspace 覆盖 assigned / own，授予 assigned 覆盖 own。
# sensAtMost：请求字段的敏感级不得高于该职责的 max_sensitivity。
[matchers]
m = r.sub == p.sub && r.dom == p.dom && r.op == p.op && rangeCovers(p.rng, r.rng) && sensAtMost(r.sens, p.sens)
