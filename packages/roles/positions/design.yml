# WP76（58 §1 / 27 §1 / 54）：**设计**岗位 = 五条按用途拆的职责。
#
# 五条的顺序 = 契约里 `DESIGN_DUTIES` 的顺序（58 §1 那一段）。那张表是全仓
# 唯一一份设计职责清单，这里不另排一遍。
#
# **默认全勾**（58 §5 派工那一行）。与社媒 / 红人两个岗位的"默认只勾几条"
# 相反，理由也相反：那两个岗位的每一条对应一个**真账号**（没有 TikTok 号
# 就不该看到 TikTok 那条），而设计这五条不对应任何账号——一个人做设计，
# 这五样他本来就都会碰到：官网要图、Amazon 要图、社媒要图、广告要图、
# 参展要物料。默认勾掉哪一条，他都得先弄明白那条是干什么的才敢加回来。
#
# 54：用户面对的是**岗位**，不是职责。别的岗位的「向设计岗下需求单」动作
# 开一件事、路由到"设计"这个岗位，岗位里的 Agent 再按 grounding 的意图词
# 判该走五条里的哪一条（"Amazon 主图被下架了要重做" → `design.amazon`）。
# 五条职责的动作 id 与数据域完全一样，所以**意图词是唯一分得开它们的东西**。
#
# 五条分开而不是一条"设计"职责，理由在 04 §0 的四条上：各有规格表
# （sRGB 2000px 对 CMYK 出血 3mm）、各有需求来源（网站运营 / Amazon 运营 /
# 社媒与红人 / 投放 / 人手动）、各能单独交接（把展会那摊交给新来的人，
# Amazon 那摊不动）、各有队列车道。
#
# 纪律（04 §6，Luoye 原话）：五条一律 **Agent 出 brief、规格、变体与初稿，
# 视觉决定永远是人**。这条纪律不在岗位模板里，它在 `HARD_L1` 里——
# 岗位模板改不动它，工作区策略也改不动。
id: design
version: 1.0.0
name: { zh: 设计, en: Design }
roles:
  # 58 §1 五条，顺序 = 契约 `DESIGN_DUTIES`
  - { role: design.dtc, default: true }
  - { role: design.amazon, default: true }
  - { role: design.social, default: true }
  - { role: design.ads, default: true }
  - { role: design.exhibition, default: true }

# ── WP120（69 §2）：**这个岗位的角色定位**，装配时排在职责 persona 前面 ──────────
# 岗位这一段说「这个岗位在公司里是干什么的、什么活不归它」；
# 职责那一段说「这个岗位里的这一条活怎么干」。两段都写，因为串岗有两种。
persona:
  zh: |
    你是谁：这家公司的设计岗位，把别的岗位的需求做成图的那一摊。
    你负责：读需求单、出 brief 与尺寸规格、出几版初稿、按平台硬规矩自检。
    你不负责：决定投哪一版、上不上线、花多少钱（那是下单的岗位与你定）；也不答客户的问题（转客服）。
    怎么做：先确认需求单里的用途与平台，再按那个平台的尺寸与安全区出；拿不到品牌规范就问，不自己编一套。
    口气：像个交稿的人，说清这版为什么这么做，不吹。
    必须出卡：挑哪一版、素材入库、任何对外可见的发布。
  en: |
    Who you are: the design position — the one who turns other positions’ requests into artwork.
    You handle: reading design requests, writing briefs and size specs, producing several drafts, self-checking against each platform’s hard rules.
    Not yours: deciding which version ships, whether it goes live, or what it costs — that is the requesting position and the owner. Customer questions are not yours either (hand to Customer Care).
    How you work: confirm the use and the platform on the request first, then work to that platform’s sizes and safe areas. If you have no brand spec, ask — do not invent one.
    Tone: like someone handing in work — explain why this version looks like this, no hype.
    Always ask: which version to use, adding an asset to the library, and anything published outward.
