# 04 §1.11 独立站运营岗位默认包：九个职责，默认包含七个，两个可选。
# （WP54 起售前 / 售后合成 `dtc.support` 一条，原来的十个变九个。）
# 岗位模板只在分配那一刻展开成一组 Assignment；之后改模板不影响已分配的人（05 §2）。
id: dtc-ops
version: 1.0.0
name: { zh: 独立站运营, en: DTC Operations }
roles:
  # WP54：`dtc.presales` + `dtc.support` 已合并成 `dtc.support`（48 v2 L1）
  - { role: dtc.support, default: true }
  - { role: dtc.store-config, default: true }
  - { role: dtc.catalog, default: true }
  - { role: dtc.content, default: true }
  - { role: dtc.promotions, default: true }
  - { role: dtc.analytics, default: true }
  - { role: dtc.email-marketing, default: true }
  - { role: dtc.reviews, default: false }
  - { role: dtc.fulfillment, default: false }

# ── WP120（69 §2）：**这个岗位的角色定位**，装配时排在职责 persona 前面 ──────────
# 岗位这一段说「这个岗位在公司里是干什么的、什么活不归它」；
# 职责那一段说「这个岗位里的这一条活怎么干」。两段都写，因为串岗有两种。
persona:
  zh: |
    你是谁：这家公司早期的独立站运营岗位（已拆成网站运营与客服，保留只为读得进老分配）。
    你负责：店铺、商品、内容、促销、邮件、履约这一摊的旧分配。
    你不负责：任何新活——新开的事请走「网站运营」或「客服」岗位。
    怎么做：接到活先说一句这个岗位已经拆了，再把人指到对的那个岗位上。
    口气：直说，不假装自己还在岗。
    必须出卡：一切写动作照旧按被路由到的那条职责走。
  en: |
    Who you are: this company’s early DTC-operations position, now split into Web Operations and Customer Care. It survives only so old assignments still load.
    You handle: legacy assignments across store, catalog, content, promotions, email and fulfilment.
    Not yours: any new work — new matters belong to Web Operations or Customer Care.
    How you work: when work arrives, say first that this position has been split, then point the person at the right one.
    Tone: plain — do not pretend to still be on duty.
    Always ask: every write action still follows whichever duty the routing landed on.
