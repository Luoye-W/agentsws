# WP54（48 v2 L1 / 27 §1）+ WP72（56 §4）：**客服**岗位 = 四条职责，默认全勾，可去勾。
#
# 46 §1 表 ③「勾岗位 = 它包含的职责全勾上」。四条分开是因为它们各自满足 04 §0
# 的四条（各有连接器、各有队列车道、各能单独交接）：
#
# - 网站客服：客服邮箱里的一切，能提退款 / 补发 / 改地址 / 折扣码（额度按动作分）；
# - 网站在线客服：聊天窗里的实时对话，只答不承诺，涉钱转邮件；
# - Amazon 客服：买家消息，24h SLA，出站受平台硬闸；
# - 社群管理（WP72 / 56 §4）：群与私信里的**客户问题**——由社媒运营的 triage
#   转过来，或直接从这些渠道的私信收件。答法与网站客服同一套（同一份 caps），
#   只是渠道不同：那边是客服邮箱，这边是 Discord / Telegram / WhatsApp / 群里的帖子。
#
# 第四条默认也勾上（56 §4「默认全勾」）：群里冒出客户问题这件事不需要先建一个群
# 才会发生——评论区与私信本来就有。没有社群的人去勾掉它，成本比"某天发现
# 群里的问题没人接"低得多。
#
# 只做独立站的人去勾掉 Amazon 那条；还没上聊天 widget 的去勾掉在线客服那条。
id: customer-care
version: 1.0.0
name: { zh: 客服, en: Customer Care }
roles:
  - { role: dtc.support, default: true }
  - { role: dtc.live-chat, default: true }
  - { role: amz.support, default: true }
  - { role: dtc.community-support, default: true }
