# WP54（48 v2 L1 第三条）：Amazon 客服 = 04 §2 的 `amz.buyer-messages` **改名**。
#
# 为什么改名而不是并进 `dtc.support`：04 §2 末段那句话没变——
# 「Amazon 与独立站的售后客服**不合并**：平台规则、消息模板、可做的动作完全不同，
# 硬合会让额度和 skill 都变成两套 if。共用的只有 `customer-care` 的说话纪律。」
# 改名只是把"买家消息"这个 Amazon 内部叫法，换成用户嘴里的"Amazon 客服"。
# 旧 id `amz.buyer-messages` 仍然读得进来（加载器的别名表）。
#
# 两条平台硬约束写在这里，不做成开关（48 §1.3 第三条）：
# 1. **24h SLA**：买家消息超过 24 小时没回会掉账户指标，所以升级时限是 24 小时以内的三档；
# 2. **出站硬闸**：站内信里不许出现外链、联系方式、营销语——它不是话术偏好，
#    是平台规则，违反会被封信道。闸在出站守卫里（`packages/channels` 的出站侧），
#    这里只把"这条职责受它管"标出来，让面板与审计看得见。
id: amz.support
version: 1.0.0
domain: amz
name: { zh: Amazon 客服, en: Amazon Buyer Support }
description: 亚马逊买家消息（寄生在客服邮箱的 relay）：站内信问答、订单与物流、退货退款引导、售后；24 小时回复 SLA，出站受平台硬闸约束

scopes:
  - { domain: order, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: shipment, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: customer, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: product, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: knowledge, ops: [read, stage], range: workspace, max_sensitivity: internal }
  - { domain: approval, ops: [read, stage, approve], range: own, max_sensitivity: internal }
  - { domain: skill, ops: [read], range: own, max_sensitivity: internal }

connectors:
  # 现在就能用的那条：买家消息寄生在客服邮箱上（Amazon relay 地址），认域名识别。
  - { kind: email, required: true, grants: [mail.read, mail.send], ownership: workspace }
  # 后续的 SP-API Messaging（退款额度等它接上再给，见下面的注释）。
  - {
      kind: amazon,
      required: false,
      grants: [messaging.read, messaging.send, orders.read],
      ownership: workspace,
    }

actions:
  # 站内信回复。`outbound_gate: amazon` 不是本 schema 的字段，闸由出站守卫按渠道判；
  # 这里用额度把"一天最多发多少封"钉住，其余交给闸。
  - id: reply_buyer_message
    target: customer
    kind: outbound_message
    mandate: { caps: { no_external_links: true, no_contact_details: true, no_marketing: true }, window: { max_count: 200, per: day } }
    route_to: role_holder
  # 48 §3 L1 表：「退款走 SP-API 时再给额度」——在那之前这条是纯提案，
  # 没有金额上限可言，因此 caps 为空且永远人审（hard_ceiling 在 automation 里）。
  - id: stage_refund
    target: order
    kind: staged_change
    requires_record_read: true
    mandate: { caps: {}, window: { max_count: 10, per: day } }
    review_cannot_be_disabled: true
    route_to: scope_manager

automation:
  reply_buyer_message:
    ceiling: L3
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]
  stage_refund:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [guardrail_hit, manual]

grounding:
  - {
      name: order_status,
      intent_terms: [订单, order, 包裹, package, shipment],
      cue_terms: [哪, where, 什么时候, when, 到了, arrived],
      tool: get_order,
      prefetch: true,
    }
  - {
      name: policy,
      intent_terms: [退, return, refund, 换, exchange],
      cue_terms: [可以, can, 能, 政策, policy],
      tool: search_policies,
      prefetch: true,
    }

skills:
  - { name: customer-care, tier: open, load: always }

home_blocks:
  - {
      id: amz.pending_replies,
      placement: queue,
      component: approval_lane,
      query: 'approvals.by_role(amz.support, reply_buyer_message)',
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  # 24h SLA 的三档（48 §1.1 表：SLA 三档）——逾期的排在最前面
  - {
      id: amz.sla_due,
      placement: alert,
      component: alert_list,
      query: 'sla.due(amz.support, 24h)',
      default_order: 1,
      pinnable: false,
      adaptive: false,
    }

notifications:
  - { event: amazon.sla_breach_imminent, mode: immediate, recipients: [role_holder, scope_manager] }
  - {
      event: 'approval.created:reply_buyer_message',
      mode: queue,
      recipients: [role_holder],
      escalate_after_hours: 8,
    }

# WP82（55 §3「域名白名单」那一行）：这条职责的浏览器只许打开哪些站。
#
# 不填 = 这条职责开不了浏览器（空白名单一律拒）。白名单是"允许"表不是"禁止"表，
# 忘了填的后果是不能用，不是随便逛。`*.example.com` 通配一切子域（www / m / 各语言站），
# 也通配 `example.com` 本身。真正打开哪一页仍由模型决定，我们只管"不许出这几个域"。
# **只开卖家后台**：这条职责是在 Amazon 卖家后台里处理买家消息与退货，
# 不需要、也不该打开 amazon.com 的前台（那是购物站，开了只会让 AI 在商品页上乱逛）。
# 三个区域各一个域名：北美 / 欧洲 / 日本，卖多区的卖家换区就换域名。
browser_scope:
  - sellercentral.amazon.com
  - sellercentral-europe.amazon.com
  - sellercentral-japan.amazon.com

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []

# WP84（54 §1 第 6 行）：冷启动用的两样。**不是权限**——能不能做仍由上面的
# actions 与额度说了算；点一条只是用这条职责在这个岗位下开一件事（54 §2）。
# quick_prompts：首页岗位卡下面那几个按钮，点一下就开干。
# task_examples：指导抽屉顶部的"这条职责典型能接什么活"，带"你会拿到什么"。

quick_prompts:
  - id: sla_due_soon
    label: { zh: "快超 24 小时的", en: "Close to the 24h deadline" }
    prompt: "买家消息里离 24 小时回复期限不到 4 小时的有哪些"
    kind: ask
  - id: draft_buyer_reply
    label: { zh: "起草站内信回复", en: "Draft a buyer message" }
    prompt: "这条买家消息问订单到哪了：查订单与配送状态，按平台规矩起草一条站内信（不留站外联系方式）"
    kind: start_task
  - id: return_guidance
    label: { zh: "退货怎么走", en: "Walk a buyer through a return" }
    prompt: "买家要退货：按亚马逊退货规则起草一条引导回复，说清退货窗口和运费谁出"
    kind: start_task
  - id: refund_card
    label: { zh: "退款先出卡", en: "Stage a refund" }
    prompt: "这条消息要求退款：按订单金额和政策出一张待我批的退款卡"
    kind: review

task_examples:
  - id: where_is_it
    title: { zh: "买家问物流", en: "A buyer asks where the parcel is" }
    description: "买家发站内信问「我的包裹几天到」。"
    expected_output: "一条 24 小时内可发出的站内信草稿，带真实配送状态；不含站外链接与联系方式（平台硬闸会拦）。"
  - id: return_request_amz
    title: { zh: "买家要退货退款", en: "A buyer wants to return and refund" }
    description: "买家说商品与描述不符，要退货退款。"
    expected_output: "一条按平台退货规则写的引导回复，加一张待你批的退款卡；金额超额度的不会自动发。"

# ── WP120（69 §2）：**角色定位**。提示里的「你是谁」，六段骨架一段不许少 ──────────
# 第三段「你不负责」是防串岗的那一条：69 §0 那条亲测记录（红人岗位回出客服的话）
# 就是因为提示里从头到尾没有这一句。改这一段之前先读 docs/69。
persona:
  zh: |
    你是谁：这家店的 Amazon 客服，站内信里对买家说话的那一位。
    你负责：买家消息的问答、订单与物流、退货退款引导、售后处理，24 小时内回。
    你不负责：改 listing 与价格→网站运营 / Amazon 设计；站外客户→网站客服；写开发信→红人营销；同事教你的中文原话一个字都不许进买家信。正文里不许有官网链接、外部邮箱、电话——平台硬闸会打回。
    怎么做：先查这一单再回；平台规矩与店里政策冲突时按平台的来，并在卡上说明。
    口气：克制、中性、按平台的措辞习惯，不热情过头。
    必须出卡：每一封站内信，以及退款。
  en: |
    Who you are: this shop’s Amazon support agent — the one who speaks to buyers in Buyer-Seller Messaging.
    You handle: buyer messages, order and shipping status, guiding returns and refunds, after-sales, within the 24-hour SLA.
    Not yours: editing listings or prices → Web Operations / Amazon Design; off-Amazon customers → DTC Website Support; outreach emails → Creator Marketing. And not one word of a colleague’s Chinese coaching may reach a buyer. Never put our own site link, an external email address or a phone number in the body — the outbound gate rejects it.
    How you work: look up the order first. Where platform rules and shop policy disagree, follow the platform and say so on the card.
    Tone: restrained, neutral, in the platform’s own register — not overly warm.
    Always ask: every message, and refunds.
