# 04 §7 工作区所有者：策略层规则、授权额度、职责分配、连接器授权、公司简报。
# 05 §0 不变量 1：公司的额度住在 WorkspacePolicy，只有 owner 能改；因此这些动作永远 L1（hard_ceiling）。
id: common.owner
version: 1.0.0
domain: common
name: { zh: 工作区所有者, en: Workspace Owner }
description: 策略层规则与授权额度、职责分配、连接器授权、公司简报；策略层变更永远人审

scopes:
  - { domain: policy, ops: [read, stage, approve], range: workspace, max_sensitivity: restricted }
  - { domain: approval, ops: [read, stage, approve], range: workspace, max_sensitivity: restricted }
  - { domain: event_log, ops: [read], range: workspace, max_sensitivity: restricted }
  - { domain: analytics, ops: [read], range: workspace, max_sensitivity: confidential }
  - { domain: knowledge, ops: [read, stage], range: workspace, max_sensitivity: internal }
  - { domain: skill, ops: [read, stage, approve], range: workspace, max_sensitivity: internal }
  - { domain: store_config, ops: [read], range: workspace, max_sensitivity: confidential }

connectors: []

actions:
  - id: change_policy
    target: policy
    kind: config_change
    mandate: { caps: {} }
    review_cannot_be_disabled: true
    route_to: owner
  - id: grant_assignment
    target: policy
    kind: config_change
    mandate: { caps: {} }
    review_cannot_be_disabled: true
    route_to: owner
  - id: authorize_connector
    target: store_config
    kind: config_change
    mandate: { caps: {} }
    protected_fields: [payment, tax, domain, currency]
    review_cannot_be_disabled: true
    route_to: owner

automation:
  change_policy:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  grant_assignment:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  authorize_connector:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]

skills:
  - { name: workspace-basics, tier: open, load: on_demand }
  - { name: policy-review, tier: open, load: on_demand }

home_blocks:
  - {
      id: owner.pending_escalations,
      placement: alert,
      component: alert_list,
      query: approvals.escalated(),
      default_order: 1,
      pinnable: false,
      adaptive: false,
    }
  - {
      id: owner.company_digest,
      placement: digest,
      component: digest_card,
      query: digests.company(),
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: owner.policy_changes,
      placement: queue,
      component: staged_change_list,
      query: changes.pending(common.owner),
      default_order: 20,
      pinnable: true,
      adaptive: false,
    }

notifications:
  - { event: approval.escalated, mode: immediate, recipients: [owner] }
  - { event: guardrail.hit, mode: immediate, recipients: [owner] }
  - { event: 'approval.created:change_policy', mode: immediate, recipients: [owner] }
  - { event: digest.ready, mode: digest, recipients: [owner], digest_schedule: '0 9 * * *' }

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane, scheduled_tasks]
  fallback: owner
  revoke_context_on_removal: true

requires: []

# WP84（54 §1 第 6 行）：冷启动用的两样。**不是权限**——能不能做仍由上面的
# actions 与额度说了算；点一条只是用这条职责在这个岗位下开一件事（54 §2）。
# quick_prompts：首页岗位卡下面那几个按钮，点一下就开干。
# task_examples：指导抽屉顶部的"这条职责典型能接什么活"，带"你会拿到什么"。

quick_prompts:
  - id: pending_approvals
    label: { zh: "等我批的有哪些", en: "What is waiting on me" }
    prompt: "现在等着我批的有哪些，按风险和等了多久排"
    kind: ask
  - id: who_does_what
    label: { zh: "谁在做什么", en: "Who does what here" }
    prompt: "这个工作区里谁持有哪些岗位和职责，有没有人的负责范围是空的"
    kind: ask
  - id: review_caps
    label: { zh: "看一遍额度", en: "Review the limits" }
    prompt: "把现在各条职责的自动化等级和额度列出来，指出松得不合适的"
    kind: review
  - id: connector_gaps
    label: { zh: "还差哪些连接", en: "What is still not connected" }
    prompt: "现在勾着的岗位里，还有哪些必需的连接没接上"
    kind: ask

task_examples:
  - id: weekly_governance
    title: { zh: "每周看一眼授权", en: "The weekly look at permissions" }
    description: "想知道这周有没有谁被放开了不该放开的口子。"
    expected_output: "一份按职责列的额度与自动化等级清单，标出和上周的差异；改动本身永远走待批卡。"
  - id: onboard_teammate
    title: { zh: "新人进来要开岗位", en: "A new teammate joins" }
    description: "招了一个人，要给他开客服岗位。"
    expected_output: "一份要建的分配清单（岗位默认勾的职责、负责范围、额度），逐条等你批，一条都不会自动生效。"

# ── WP120（69 §2）：**角色定位**。提示里的「你是谁」，六段骨架一段不许少 ──────────
# 第三段「你不负责」是防串岗的那一条：69 §0 那条亲测记录（红人岗位回出客服的话）
# 就是因为提示里从头到尾没有这一句。改这一段之前先读 docs/69。
persona:
  zh: |
    你是谁：这个工作区的所有者，规矩与授权归你。
    你负责：策略层规则与额度、职责分配、连接器授权、公司简报。
    你不负责：任何一条具体的业务活——客户问题转客服，商品与价格转网站运营，投放转投放，红人转红人营销。你不是"什么都能干的那个人"。
    怎么做：先说清这条改动影响到谁、多少单、能不能退回去，再提出来。
    口气：像个管事的人，先说代价再说好处。
    必须出卡：策略层的每一条改动、每一次分配与授权——它们永远人审，没有例外。
  en: |
    Who you are: the owner of this workspace — rules and grants are yours.
    You handle: policy-layer rules and limits, duty assignments, connector authorisations, the company briefing.
    Not yours: any concrete piece of operational work — customer questions go to Customer Care, products and prices to Web Operations, advertising to Paid Ads, creators to Creator Marketing. You are not “the person who can do anything”.
    How you work: before proposing a change, say who it affects, how many orders, and whether it can be undone.
    Tone: like someone accountable — cost first, benefit second.
    Always ask: every policy-layer change, every assignment and every authorisation — these are always human-reviewed, without exception.
