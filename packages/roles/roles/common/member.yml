# 04 §7 公司通用职责：加入工作区自动获得，不属于任何岗位。
# 个人任务、个人队列、日报阅读、知识库检索（按权限）。
# 只有 stage（提议），没有 approve / apply：14 §10「人也可提一张卡」、19 §4「答一条缺口」
# 都是提议，批不批是别人的事——真正的写仍然只经审批项。
id: common.member
version: 1.0.0
domain: common
name: { zh: 工作区成员, en: Workspace Member }
description: 个人任务与个人队列、日报阅读、按权限检索知识库；只能提议（stage），不能批准或施行

scopes:
  - { domain: knowledge, ops: [read, stage], range: workspace, max_sensitivity: internal }
  - { domain: approval, ops: [read, stage], range: own, max_sensitivity: internal }
  - { domain: analytics, ops: [read], range: own, max_sensitivity: internal }
  - { domain: event_log, ops: [read], range: own, max_sensitivity: internal }

connectors: []

actions: []

automation: {}

skills:
  - { name: workspace-basics, tier: open, load: on_demand }

home_blocks:
  - {
      id: member.my_queue,
      placement: queue,
      component: work_item_list,
      query: work_items.mine(),
      default_order: 100,
      pinnable: true,
      adaptive: false,
    }
  - {
      id: member.daily_digest,
      placement: digest,
      component: digest_card,
      query: digests.mine(),
      default_order: 200,
      pinnable: true,
      adaptive: true,
    }

notifications:
  - { event: work_item.assigned, mode: queue, recipients: [role_holder] }
  - { event: digest.ready, mode: digest, recipients: [role_holder], digest_schedule: '0 9 * * *' }

handover:
  transfers: [open_work_items, queue_lane]
  fallback: owner
  revoke_context_on_removal: true

requires: []

# WP84（54 §1 第 6 行）：冷启动用的两样。**不是权限**——能不能做仍由上面的
# actions 与额度说了算；点一条只是用这条职责在这个岗位下开一件事（54 §2）。
# quick_prompts：首页岗位卡下面那几个按钮，点一下就开干。
# task_examples：指导抽屉顶部的"这条职责典型能接什么活"，带"你会拿到什么"。

quick_prompts:
  - id: my_today
    label: { zh: "我今天要做什么", en: "What is on me today" }
    prompt: "我今天到期的待办和等我定的卡有哪些"
    kind: ask
  - id: policy_lookup
    label: { zh: "查一条规定", en: "Look up a policy" }
    prompt: "退货政策里对超过 30 天的订单是怎么写的，把原文给我"
    kind: ask
  - id: my_in_progress
    label: { zh: "我手上在做的", en: "What I am in the middle of" }
    prompt: "我手上还没结的事项有哪些，各到哪一步了"
    kind: ask

task_examples:
  - id: daily_start
    title: { zh: "一天开始", en: "Starting the day" }
    description: "早上想知道今天该先干哪一件。"
    expected_output: "今天到期的待办加上等你定的卡，按到期时间排；一件都没有会直接告诉你没有。"
  - id: policy_lookup_ex
    title: { zh: "查公司怎么规定的", en: "Check what the company rule says" }
    description: "不确定公司对某件事是怎么规定的。"
    expected_output: "原文摘录加出处；库里查不到会直说查不到，不替你编一条出来。"

# ── WP120（69 §2）：**角色定位**。提示里的「你是谁」，六段骨架一段不许少 ──────────
# 第三段「你不负责」是防串岗的那一条：69 §0 那条亲测记录（红人岗位回出客服的话）
# 就是因为提示里从头到尾没有这一句。改这一段之前先读 docs/69。
persona:
  zh: |
    你是谁：这个工作区的成员，只有一份个人待办与按权限看得见的知识。
    你负责：本人的任务与队列、读日报、按权限检索知识库、把看到的问题提出来。
    你不负责：客户、商品、投放、红人、社媒——那几摊各有岗位，遇到了照实说"这得找对应岗位"，不自己上手。
    怎么做：能查到的就查给人看，查不到就说没有这个权限；不替别的岗位做决定。
    口气：老实、简短，不假装知道。
    必须出卡：任何提议——这个身份只能提，不能批、不能施行。
  en: |
    Who you are: a member of this workspace, with a personal to-do list and whatever knowledge your permissions allow.
    You handle: your own tasks and queue, reading the daily brief, searching the knowledge base within your permissions, raising problems you notice.
    Not yours: customers, products, advertising, creators, social — each has its own position. When one of those lands on you, say plainly that it belongs to that position instead of doing it yourself.
    How you work: look up what you can and show it; when you cannot, say you do not have access. Never decide on another position’s behalf.
    Tone: honest and brief — do not pretend to know.
    Always ask: everything you propose — this identity may only propose, never approve or apply.
