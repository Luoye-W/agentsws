# docs/84 B2B 岗位的第 1 条职责：**业务**（WP171）。
#
# 五条职责的骨架写在这一份的文件头，另外四条不抄第二遍：
#
# - 按「人」切（docs/50 §0）：询盘、报价、样品、谈判、老客户是业务员一个人的活，合成这一条；
#   主动开发（`b2b.outbound`）常交给另一个人或外包；展会（`b2b.exhibition`）常有专人；
#   跟单与单证（`b2b.fulfillment`）小公司业务员自己做、大一点有专职跟单员。
# - 发信 / 报价 / 缴费 / 放单 / 付款一律 **L1 起步**（派工单）。报价、展会缴费、放单、
#   付款指示在 `@agentsws/core` 的 `HARD_L1` 里：yml 可以被工作区策略放宽，硬顶不行。
# - 回信里只要碰到价格、交期、认证、MOQ、独家、账期、保证，guardrail 就转人审
#   （`B2B_COMMITMENT_TERMS`，出处 BtoBAgents `domain/policy.ts` 那条"邮件含承诺要人审"）。
#
# 这一条特有的三件事：
#
# 1. **报价永远出卡**，授权四个数（单笔 1 万美元 / 毛利 20% / 折扣 5% / 账期 30 天）
#    只决定**谁批**：授权内业务员自己批，超出转上级（`scope_manager`），没有上级转老板
#    （docs/84 §11.1 第 3 条；`@agentsws/b2b-core` 的 `quoteApprover`）。四个数首次设置可改。
# 2. **报价版本不可改**：改价 = 新建一版（guardrail 的 `quote_version_immutable`）。
# 3. 离职交接出一张卡给老板批（`buildTransferPlan` 按地区 / 产品线分）。
#
# 技能：`b2b-inquiry`（询盘回复）、`quotation`（报价单），WP170 写的正文；`brand-voice` 公司层。
id: b2b.sales
version: 1.0.0
domain: b2b
name: { zh: 业务, en: Sales }
description: 询盘接待与回复、需求确认、报价与改价、寄样、谈判记录、老客户唤醒与复购、业务员离职交接

scopes:
  - { domain: b2b_account, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # 联系方式的明文在加密库里（只存 `email_ref`），这条 scope 管的是"这条记录看不看得到"
  - { domain: b2b_contact, ops: [read, stage], range: assigned, max_sensitivity: confidential }
  - { domain: b2b_opportunity, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # 报价是钱：毛利与底价是 confidential
  - { domain: b2b_quote, ops: [read, stage], range: assigned, max_sensitivity: confidential }
  - { domain: b2b_sample, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # 展会带回来的有意向线索会转到这里；出运进度要能答客户"货到哪了"——两样都只读
  - { domain: trade_show_lead, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: export_shipment, ops: [read], range: assigned, max_sensitivity: internal }
  # 知识六类（产品线 / 价格与 MOQ / 认证清单 / 交付能力 / 样品政策 / 售后规则）
  - { domain: knowledge, ops: [read], range: workspace, max_sensitivity: internal }
  - { domain: approval, ops: [read, approve], range: own, max_sensitivity: internal }

connectors:
  - { kind: email, required: false, grants: [mail.read, mail.send], ownership: workspace }
  # 沿用客服那条的 opt-in 与 24 小时窗口三道闸
  - { kind: whatsapp_business, required: false, grants: [read, send], ownership: workspace }
  # 待增加：连接目录里还没有日历（会议与样品跟进提醒要它）
  - { kind: calendar, required: false, grants: [read, write], ownership: person }

actions:
  # WP172：B2B 库里建 / 改一条客户、联系人、商机——读不经卡，写都经卡（L1 起）
  - id: stage_b2b_record
    target: b2b_account
    kind: staged_change
    mandate:
      caps: {}
      window: { max_count: 200, per: day }
    route_to: role_holder
  - id: stage_b2b_reply
    target: b2b_account
    kind: outbound_message
    mandate:
      caps: { max_replies_per_day: 60 }
      window: { max_count: 60, per: day }
    route_to: role_holder
  - id: stage_b2b_quote
    target: b2b_quote
    kind: staged_change
    requires_record_read: true
    mandate:
      # docs/84 §3.2 统一值（契约 `DEFAULT_B2B_QUOTE_MANDATE`）。超出任何一个 guardrail 多报一条，
      # 卡转上级；授权内这张卡落在业务员自己手上（`b2b-core` 的 `quoteApprover`）。
      caps: { max_amount_usd: 10000, min_margin_pct: 20, max_discount_pct: 5, max_payment_terms_days: 30 }
      per_change_limits: { max_items: 1 }
      window: { max_count: 20, per: day }
    protected_fields: [version, created_at, created_by]
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: stage_b2b_sample
    target: b2b_sample
    kind: staged_change
    mandate:
      caps: { max_samples_per_day: 10, sample_overdue_days: 3, feedback_overdue_days: 14 }
      window: { max_count: 10, per: day }
    route_to: role_holder
  - id: stage_b2b_account_transfer
    target: b2b_account
    kind: staged_change
    mandate:
      caps: {}
      window: { max_count: 5, per: day }
    review_cannot_be_disabled: true
    route_to: owner

automation:
  stage_b2b_record:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [guardrail_hit, manual]
  # 回信 L1 起，采纳率够了可以升 L2；碰承诺的那一封永远转人审（guardrail，不靠等级）
  stage_b2b_reply:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [guardrail_hit, customer_complaint, manual]
  stage_b2b_quote:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  stage_b2b_sample:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  stage_b2b_account_transfer:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]

skills:
  - { name: brand-voice, tier: open, load: always }
  # WP170 的正文（`@agentsws/skills` 的 `bundled/`）：询盘怎么回、报价单怎么写
  - { name: b2b-inquiry, tier: open, load: on_demand }
  - { name: quotation, tier: open, load: on_demand }

home_blocks:
  # docs/84 §1.2 面板（少字）：待回询盘 · 报价待审 · 样品在途 · 该唤醒的老客户
  - { id: b2b.sales.inquiries, placement: focus, component: table, query: b2b.inquiries, default_order: 10, pinnable: true, adaptive: true }
  - { id: b2b.sales.quotes, placement: queue, component: table, query: b2b.quotes_pending, default_order: 20, pinnable: true, adaptive: true }
  - { id: b2b.sales.samples, placement: role_view, component: table, query: b2b.samples, default_order: 30, pinnable: true, adaptive: true }
  - { id: b2b.sales.dormant, placement: role_view, component: table, query: b2b.dormant_accounts, default_order: 40, pinnable: true, adaptive: false }

grounding:
  # 54 §2：岗位路由在 B2B 这五条职责里按意图词判"这件事该走哪条"
  - {
      name: sales_intent,
      intent_terms: [询盘, 询价, 报价, 样品, 寄样, 谈判, 老客户, 复购, 唤醒, inquiry, RFQ, quotation, quote, sample, buyer],
      cue_terms: [MOQ, 起订量, 交期, 价格, 账期, 认证, 独家, 折扣, lead time, payment terms, FOB, CIF, EXW, DDP],
      tool: search_policies,
      prefetch: false,
    }
  # 19：回信里说到价格、交期、认证之前先查事实卡（承诺类知识永不自动发布）
  - {
      name: facts_before_reply,
      intent_terms: [回复询盘, 回客户, 报价, reply, quote],
      cue_terms: [价格, 交期, 认证, MOQ, 样品政策, 质保, price, lead time, certificate],
      tool: search_policies,
      prefetch: true,
    }

notifications:
  # 超授权的报价转上级：压着不动 = 客户在等价，8 小时就催
  - { event: 'approval.created:stage_b2b_quote', mode: immediate, recipients: [scope_manager], escalate_after_hours: 8 }
  - { event: 'approval.created:stage_b2b_account_transfer', mode: immediate, recipients: [owner], escalate_after_hours: 24 }
  # 改收款账户的红卡：立刻让人知道（docs/84 §11.3 防诈骗）
  - { event: 'guardrail.hit:payment_account_not_from_fact_card', mode: immediate, recipients: [role_holder, scope_manager] }
  - { event: 'approval.created:b2b_fraud_alert', mode: immediate, recipients: [role_holder, scope_manager, owner] }

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []

quick_prompts:
  - id: reply_inquiry
    label: { zh: "回这封询盘", en: "Reply to this inquiry" }
    prompt: "起草这封询盘的回复：先确认数量、目标价、认证、交期与付款方式，价格与交期只引事实卡"
    kind: start_task
  - id: draft_quote
    label: { zh: "出一版报价", en: "Draft a quote" }
    prompt: "按这个客户的需求出一版报价（FOB 深圳），超出授权的地方标出来"
    kind: review
  - id: samples_overdue
    label: { zh: "样品到哪了", en: "Where are the samples" }
    prompt: "列出还没寄出和寄出超过两周还没反馈的样品"
    kind: ask
  - id: wake_dormant
    label: { zh: "唤醒老客户", en: "Wake up old buyers" }
    prompt: "找出三个月没联系、以前下过单的客户，各起草一封跟进信"
    kind: start_task

task_examples:
  - id: inquiry_to_quote
    title: { zh: "从询盘到报价", en: "From inquiry to quote" }
    description: "来了一封询盘，想尽快回、再出一版正式报价。"
    expected_output: "一封确认需求的回信草稿，外加一版报价单；超出授权的报价会变成一张转给上级的卡。"
  - id: sample_followup
    title: { zh: "样品跟进", en: "Sample follow-up" }
    description: "寄出去的样品太多，记不清谁收到了、谁还没反馈。"
    expected_output: "一张样品清单：待寄 / 已寄 / 已签收 / 已反馈，超期的排最前面。"

persona:
  zh: |
    你是谁：B2B 岗位里做业务的人，从询盘到成交到复购。
    你负责：回询盘、确认需求、出报价与改价、寄样、记谈判、跟老客户、业务员离职时的交接清单。
    你不负责：找新客户与开发信→主动开发；展会→展会；生产、订舱、单证→跟单与单证；平台后台→B2B 平台运营；零售订单→客服。
    怎么做：先查客户与商机的往来，再回话；价格、交期、认证、MOQ 只引事实卡，查不到就说确认后回复；收款账户只认事实卡。
    口气：像靠谱的外贸业务员，简短、具体、不许诺。
    必须出卡：每一版报价、回信里有价格交期认证账期的、每次寄样、客户转交。
  en: |
    Who you are: the salesperson in the B2B position, from inquiry to order to repeat business.
    You handle: replying to inquiries, confirming requirements, quotes and revisions, samples, negotiation notes, existing buyers, and the handover list when a salesperson leaves.
    Not yours: finding new buyers and cold email → Outbound; trade shows → Trade Shows; production, booking and export documents → Order Follow-up & Export Docs; marketplace back-ends → B2B Marketplaces; retail orders → Customer Care.
    How you work: read the account and deal history before replying. Quote prices, lead times, certifications and MOQ only from fact cards; if it is not there, say you will confirm. Bank details come only from fact cards.
    Tone: like a reliable export salesperson — short, concrete, never promising.
    Always ask: every quote version, any reply mentioning price, lead time, certification or payment terms, every sample, every account handover.
