# 51 §2.3 邮件营销（WP64）。
#
# 网站运营岗位的第三条职责。它跟店铺管理最大的不同在**收信的是顾客，不是同事**：
# 一次群发出去，收不回来，也没有"撤回"这一说。所以这条职责的三件事都往紧了拧：
#
# 1. **发送永远 L1**（15 §2 的 `HARD_L1` 里有 `campaign_send`）。不是"初始 L1、
#    采纳率够了升 L2"，是**永远**——采纳率证明的是"这个 Agent 写的文案人爱看"，
#    证明不了"下一次的收件人名单是对的"。
# 2. **退订 / 抑制名单必查**，而且是 fail-closed：提案里不报"查过了"就 block。
#    规则本身在 `@agentsws/core` 的 `suppression.ts`，与 WP55 客服出站那条是**同一份**。
# 3. **自动流的触发条件不可由 Agent 放宽**。改一条流在账本上只是一行 `flow_edit`，
#    但把"弃购 60 分钟后发"改成"10 分钟后发"，等于当天多发出去几千封。
#    guardrail 里这一条是 block 不是 review：卡面上看不出会多发给多少人，
#    转人审等于让人替 Agent 拍脑袋。要放宽，人自己去 Klaviyo 后台改。
#
# 连接器写 `kind: email_marketing`，**平台中立**：今天只有 Klaviyo 一张卡，
# 而且是骨架（目录 + 只读动作 + 原生表单，真调用还没接）。没连的时候面板与工具
# 照 36 §3 明说"还没连"，不许拿空数据往下编。
id: dtc.email-marketing
version: 1.0.0
domain: dtc
name: { zh: 邮件营销, en: Email Marketing }
description: 弃购挽回、复购与再营销、新品与活动邮件、分群与订阅状态

scopes:
  # 分群、活动、自动流都挂在 campaign 这个域上（分群是"下一次发给谁"，不是客户档案）
  - { domain: campaign, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # 订阅状态与抑制名单是客户身上的字段：只读，改订阅状态是顾客自己的事
  - { domain: customer, ops: [read], range: assigned, max_sensitivity: internal }
  # 邮件模板的正文与图（内容与博客那条职责也碰 content，两条职责各自按动作限额）
  - { domain: content, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: analytics, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: product, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: knowledge, ops: [read], range: workspace, max_sensitivity: internal }
  - { domain: approval, ops: [read, approve], range: own, max_sensitivity: internal }

connectors:
  # 51 §2.3：Klaviyo 首选，Shopify Email 待增加。职责不写死是哪一家——
  # 写 `kind: email_marketing`，哪一张卡能用由连接目录说了算。
  - { kind: email_marketing, required: true, grants: [read], ownership: workspace }
  # 商品与订单读口（弃购挽回要知道购物车里是什么、复购要知道上次买了什么）
  - { kind: shop, required: false, grants: [read_products, read_orders], ownership: workspace }

actions:
  # 51 §2.3：每周发送次数 `max_campaigns_per_week` 默认 2。
  # 额度写在动作上，不写在职责上——"额度按动作分"那句话的落点。
  - id: stage_campaign_send
    target: campaign
    kind: staged_change
    mandate:
      caps: { max_campaigns_per_week: 2, max_campaign_audience: 20000 }
      per_change_limits: { max_items: 1 }
      window: { max_count: 2, per: week }
    review_cannot_be_disabled: true
    route_to: owner
  - id: stage_segment_edit
    target: campaign
    kind: staged_change
    mandate:
      caps: { max_segment_size: 50000 }
      window: { max_count: 10, per: day }
    route_to: scope_manager
  # 自动流：开关与文案能改，触发条件不能（受保护字段在 15 §2 的 `PROTECTED_FIELDS`）。
  - id: stage_flow_edit
    target: campaign
    kind: staged_change
    requires_record_read: true
    mandate:
      caps: { max_flows_touched_per_day: 3 }
      window: { max_count: 5, per: day }
    protected_fields: [trigger, trigger_conditions, trigger_filters, audience_filter]
    route_to: scope_manager

automation:
  # 15 §2：`campaign_send` 在 `HARD_L1` 里。这里的 `hard_ceiling: true` 是把同一件事
  # 在职责这一层也写出来——两处都说，改一处忘另一处的时候有人喊。
  stage_campaign_send:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  # 51 §2.3 写的是 L2，指的就是**初始**就在 L2。两条都改不动"发给谁、什么时候发"
  # 这件事本身——分群超过 `max_segment_size` 转人审，自动流的触发条件 Agent 根本碰不得。
  stage_segment_edit:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  stage_flow_edit:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]

skills: []

home_blocks:
  # 51 §2.3 面板三块：待审发送、自动流状态、近 30 天效果。
  - {
      id: email.pending_sends,
      placement: queue,
      component: staged_change_list,
      query: changes.pending(dtc.email-marketing),
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: email.flow_status,
      placement: focus,
      component: table,
      query: email.flows,
      default_order: 20,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: email.performance_30d,
      placement: role_view,
      component: table,
      query: email.campaign_performance,
      default_order: 30,
      pinnable: true,
      adaptive: false,
    }

notifications:
  - {
      event: 'approval.created:stage_campaign_send',
      mode: immediate,
      recipients: [owner],
      escalate_after_hours: 12,
    }
  - {
      event: 'guardrail.hit:suppression_list',
      mode: immediate,
      recipients: [role_holder, scope_manager],
    }

handover:
  transfers: [open_work_items, context, home_blocks]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []

# WP84（54 §1 第 6 行）：冷启动用的两样。**不是权限**——能不能做仍由上面的
# actions 与额度说了算；点一条只是用这条职责在这个岗位下开一件事（54 §2）。
# quick_prompts：首页岗位卡下面那几个按钮，点一下就开干。
# task_examples：指导抽屉顶部的"这条职责典型能接什么活"，带"你会拿到什么"。

quick_prompts:
  - id: abandoned_cart
    label: { zh: "弃购挽回怎么样", en: "How abandoned-cart mail is doing" }
    prompt: "最近 7 天弃购挽回邮件收回来多少单，打开率和点击率是多少"
    kind: ask
  - id: draft_campaign
    label: { zh: "起草一封活动邮件", en: "Draft a campaign email" }
    prompt: "按下周的活动起草一封邮件：主题行给三个备选，正文写一版"
    kind: start_task
  - id: segment_size
    label: { zh: "这个分群多少人", en: "How big is this segment" }
    prompt: "「90 天没下过单的老客」这个分群现在多少人，和上个月比多了还是少了"
    kind: ask
  - id: pre_send_check
    label: { zh: "发之前看一遍", en: "Check before it goes out" }
    prompt: "这封邮件发之前检查一遍：抑制名单、退订链接、分群人数、发送时间"
    kind: review

task_examples:
  - id: winback
    title: { zh: "做一次复购召回", en: "Run a win-back" }
    description: "想给 90 天没下单的老客发一封召回邮件。"
    expected_output: "分群人数、一封写好的邮件、一张待批的发送卡；发送永远要人点，抑制名单每次必查。"
  - id: cart_flow
    title: { zh: "弃购流程调一调", en: "Tune the abandoned-cart flow" }
    description: "弃购挽回的三封邮件效果不好，想改。"
    expected_output: "每一封的打开、点击、收回订单各一行，加一版改写建议；改动本身走待批卡。"

# ── WP120（69 §2）：**角色定位**。提示里的「你是谁」，六段骨架一段不许少 ──────────
# 第三段「你不负责」是防串岗的那一条：69 §0 那条亲测记录（红人岗位回出客服的话）
# 就是因为提示里从头到尾没有这一句。改这一段之前先读 docs/69。
persona:
  zh: |
    你是谁：网站运营岗位里做邮件营销的人。
    你负责：弃购挽回、复购与再营销、新品与活动邮件、分群与订阅状态、自动化流程。
    你不负责：客户一对一的回信→客服；通知邮件的模板→建站的邮件模板；改价与上架→店铺管理；买广告→投放。
    怎么做：发之前先看这批人是谁、多少人、上次给他们发是什么时候；退订与压制名单一个都不许绕过去。
    口气：像写信给人的人，短、有一件具体的事要说，不群发腔。
    必须出卡：每一次群发、改分群、改自动化流程。
  en: |
    Who you are: the person who runs email marketing, inside the web-operations position.
    You handle: abandoned-cart recovery, repeat purchase and re-engagement, launch and campaign emails, segments and subscription status, automated flows.
    Not yours: one-to-one replies to customers → Customer Care; notification templates → Site Building’s email-template duty; prices and publishing → the Store duty; buying ads → Paid Ads.
    How you work: before a send, check who this list is, how many people it is, and when they last heard from us. Unsubscribes and the suppression list are never to be bypassed.
    Tone: like someone writing to a person — short, with one concrete thing to say, no blast voice.
    Always ask: every send, every segment change, every flow change.
