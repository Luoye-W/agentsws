# 56 §4（WP72）：客服岗位的第四条职责——**社群管理**。
#
# 这条职责是 56 那条边界的另一半。社媒运营（`social.*` 九条）管的是内容、氛围、
# 活动、群规；群里与私信里冒出来的**客户的问题**不归它，归这一条：
# 售前问答、订单、物流、退换货、退款、保修、投诉。
#
# 两条来路：
#
# 1. **转客服卡**——社媒运营那边的 `social-core/triage` 判成 `customer_question`，
#    出一张卡路由到这条职责（54 §2 的岗位路由，判据就是两条职责 `description` 里
#    那两句话）。社媒运营**不答**，也不该答：它手上没有订单域。
# 2. **直接收件**——这些渠道的私信本来就可能直接进来，不一定先经过群里的帖子。
#
# **答法与 `dtc.support` 同一套**（56 §4）：同一批知识与事实卡、**同一份 caps**
# （退款 50 美元、补发一件、折扣 10%、拒付举证）、同一份承诺扫描词表。
# 不另起一套的理由很实在：同一个客户在邮件里问和在 Discord 里问，得到的答复
# 与能拿到的补偿必须一样，否则他会去试哪个渠道松。所以这里的动作 id、`mandate`
# 与 `protected_fields` 与 `roles/dtc/support.yml` **逐字相同**——改额度要两边一起改，
# 只改一边就是"换个渠道问能多退 50 块"。
#
# 与 `dtc.support` 真正不同的只有三处：
#
# 1. **渠道**：读的是社群线程与私信（`community_thread`），不是客服邮箱。
#    连接器因此换成八张社媒卡（任意一张连上就能干活），邮箱不是必需的。
# 2. **读得到线程，读不到成员名册**（56 §4）。`community_member` 那个域不在下面的
#    scopes 里——认不认得出这个人是哪个订单的买家，靠订单域自己查，不靠群名册。
#    成员名册是社媒运营那五条职责的东西（谁进得来、谁被禁言）。
# 3. **回复从 L2 起**（56 §4 写的 `L2 → L3`），比 `dtc.support` 的 L1 起高一档。
#    理由是渠道不同：邮件是一对一，群里的一条回复**所有人都看得见**，
#    所以第一版就让它能起草完直接排队，而不是每一条都从零开始。
id: dtc.community-support
version: 1.0.0
domain: dtc
name: { zh: 社群管理, en: Community Support }
description: 社群与私信里的客户问题：售前问答、订单状态与物流、退换货、退款、改地址、保修、投诉。客户的问题归我；内容、氛围、活动与群规归社媒运营

scopes:
  # 订单那一侧与 `dtc.support` 一模一样——答的是同一批问题
  - { domain: order, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: shipment, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: customer, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: knowledge, ops: [read, stage], range: workspace, max_sensitivity: internal }
  - { domain: discount, ops: [stage], range: assigned, max_sensitivity: internal }
  - { domain: approval, ops: [read, stage, approve], range: own, max_sensitivity: internal }
  - { domain: skill, ops: [read], range: own, max_sensitivity: internal }
  - { domain: product, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: inventory, ops: [read], range: assigned, max_sensitivity: internal }
  # 56 §4：**读线程，不读成员名册**。客户的问题在线程里；谁进得来、谁被禁言
  # 是社媒运营那五条职责的事，这条职责的 scopes 里没有 `community_member`。
  - { domain: community_thread, ops: [read, stage], range: assigned, max_sensitivity: internal }

connectors:
  # 订单、退款、折扣码都在这里——与 `dtc.support` 同一张卡、同一批权限
  - {
      kind: shopify,
      required: true,
      grants:
        [
          read_orders,
          write_orders,
          read_fulfillments,
          read_products,
          read_inventory,
          write_discounts,
        ],
      ownership: workspace,
    }
  - { kind: tracking, required: false, grants: [read], ownership: workspace }
  # 八张社媒卡（56 §1 那张表，Facebook 群组没有卡——那条渠道走受控浏览器）。
  # **全部 `required: false`**：连上任意一张就能在那条渠道上干活，一张都没连时
  # 转客服卡照样进得来（社媒运营那边人工贴进来的也算），只是回不出去。
  - { kind: meta_graph, required: false, grants: [manage_comments, manage_messages], ownership: workspace }
  - { kind: tiktok_content, required: false, grants: [manage_comments], ownership: workspace }
  - { kind: x_api, required: false, grants: [read_tweets, publish_tweets], ownership: workspace }
  - { kind: youtube_data, required: false, grants: [manage_comments], ownership: workspace }
  - { kind: reddit, required: false, grants: [read_posts, submit, privatemessages], ownership: workspace }
  - { kind: discord_bot, required: false, grants: [read_messages, send_messages], ownership: workspace }
  - { kind: telegram_bot, required: false, grants: [read_updates, send_messages], ownership: workspace }
  - {
      kind: whatsapp_business,
      required: false,
      grants: [read_messages, send_messages],
      ownership: workspace,
    }

actions:
  # 56 §4：**动作与额度沿用 `dtc.support` 那一份，不另起**。
  # 下面每条的 `mandate` 与 `roles/dtc/support.yml` 里同名那条逐字相同。
  - id: reply_customer
    # 回的是社群里的一条线程（群里的帖子 / 评论 / 私信），不是一封邮件
    target: community_thread
    kind: outbound_message
    mandate: { caps: {}, window: { max_count: 200, per: day } }
    route_to: role_holder
  - id: stage_refund
    target: order
    kind: staged_change
    requires_record_read: true
    mandate:
      caps: { max_auto_refund_amount: 50, currency: USD, within_policy_window_only: true }
      per_change_limits: { max_items: 1, no_repeat_target_field: true }
      window: { max_count: 20, per: day }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: stage_reship
    target: order
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { max_items_per_order: 1 }, window: { max_count: 10, per: day } }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: stage_address_change
    target: order
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { unfulfilled_only: true } }
    protected_fields: [order.total, order.currency, order.customer_id]
    route_to: role_holder
  - id: stage_discount_code
    target: discount
    kind: staged_change
    mandate:
      caps: { max_presales_discount_pct: 10, single_use_per_customer: true }
      per_change_limits: { max_items: 1 }
      window: { max_count: 20, per: day }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: draft_chargeback_evidence
    target: finance
    kind: staged_change
    mandate: { caps: {} }
    route_to: owner

automation:
  # 56 §4：回复 **L2 → L3**。群里的一条回复所有人都看得见，所以它不像邮件那样
  # 从 L1 起；但它仍然改不了钱——承诺扫描把"改得了钱"那一半直接拦死。
  reply_customer:
    ceiling: L3
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]
  # 下面五条与 `dtc.support` 逐字相同：同一个客户在两个渠道问，拿到的补偿必须一样
  stage_refund:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [guardrail_hit, manual]
  stage_reship:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  stage_address_change:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [manual]
  stage_discount_code:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  draft_chargeback_evidence:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]

grounding:
  # 54 §2：客服这个岗位里四条职责的路由判据。这一条与另外三条分得开的地方是
  # **渠道**（群、私信、评论区），不是问题本身——问题是一样的。
  - {
      name: community_channel,
      intent_terms: [群, 群里, 社群, 私信, DM, 评论区, Discord, Telegram, WhatsApp, Reddit, 群组],
      cue_terms: [有人问, 有人说, 有人在, 贴出来, 截图, 艾特, "@"],
      tool: list_community_threads,
      prefetch: false,
    }
  - {
      name: order_status,
      intent_terms: [订单, order, 包裹, package],
      cue_terms: [哪, where, 什么时候, when, 到了, arrived],
      tool: get_order,
      prefetch: true,
    }
  - {
      name: policy,
      intent_terms: [退, return, refund, 换, exchange],
      cue_terms: [可以, can, 能, 政策, policy],
      tool: search_policies,
      prefetch: true,
    }

skills:
  # 与 `dtc.support` 同一套技能（答法不因为换了渠道就变），外加品牌话术——
  # 群里说话的调子是公司层技能定的，不是这条职责自己编的（24）
  - { name: customer-care, tier: open, load: always }
  - { name: returns-policy-calc, tier: open, load: on_demand }
  - { name: chargeback-evidence, tier: open, load: on_demand }
  - { name: brand-voice, tier: open, load: always }

home_blocks:
  # 第一块就是转客服卡：这条职责的活多数从那里来
  - {
      id: community_support.handoffs,
      placement: focus,
      component: table,
      query: social.support_handoffs,
      default_order: 5,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: community_support.pending_replies,
      placement: queue,
      component: approval_lane,
      query: 'approvals.by_role(dtc.community-support, reply_customer)',
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: community_support.pending_changes,
      placement: queue,
      component: staged_change_list,
      query: changes.pending(dtc.community-support),
      default_order: 20,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: community_support.escalations,
      placement: alert,
      component: alert_list,
      query: events.escalations(dtc.community-support),
      default_order: 30,
      pinnable: false,
      adaptive: false,
    }

notifications:
  # 群里的投诉比邮件里的投诉更急：所有人都看得见
  - { event: customer.complaint, mode: immediate, recipients: [role_holder, scope_manager] }
  - {
      event: 'approval.created:reply_customer',
      mode: queue,
      recipients: [role_holder],
      escalate_after_hours: 4,
    }
  - {
      event: 'approval.created:stage_refund',
      mode: queue,
      recipients: [scope_manager],
      escalate_after_hours: 24,
    }
  # 社媒运营转过来一张卡：没人接 = 客户在群里干等着
  - {
      event: 'social.support_handoff',
      mode: immediate,
      recipients: [role_holder],
      escalate_after_hours: 4,
    }
  - {
      event: 'guardrail.hit:commitment_scan',
      mode: immediate,
      recipients: [role_holder, scope_manager],
    }

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []

quick_prompts:
  - id: open_handoffs
    label: { zh: "有哪些转过来的问题", en: "Handoffs waiting" }
    prompt: "社媒运营转过来的客户问题有哪些还没答？在群里公开等着的排前面"
    kind: ask
  - id: answer_in_thread
    label: { zh: "在群里答这一条", en: "Answer in the thread" }
    prompt: "这条群里的问题：查订单和物流，起草一条回帖；群里公开可见，别写任何没查过的日期"
    kind: start_task
  - id: refund_check
    label: { zh: "退款算一算", en: "Work out the refund" }
    prompt: "这一单要退款：按退货政策算能退多少、运费扣不扣，出一张待我批的退款卡"
    kind: review
  - id: same_question
    label: { zh: "这问题是不是问过很多遍", en: "Asked many times?" }
    prompt: "近 30 天群里重复最多的三个问题是什么？该不该写进群里的置顶或事实卡"
    kind: ask

task_examples:
  - id: handoff_order
    title: { zh: "群里有人问单到哪了", en: "Where is my order, in the group" }
    description: "Discord 里有人问「我上周下的单什么时候到」，社媒运营转了一张卡过来。"
    expected_output: "一条查过订单与物流之后写好的回帖草稿，带预计到达时间的依据；查不到就照实说查不到，不编日期。"
  - id: public_complaint
    title: { zh: "群里公开投诉", en: "A public complaint" }
    description: "有人在群里贴了破损商品的照片，下面已经有几个人跟帖。"
    expected_output: "一条先接住情绪、再给下一步的公开回帖草稿，外加一张补发或退款的待批卡；金额超额度的不会自己发出去。"
  - id: presale_in_dm
    title: { zh: "私信里的售前问题", en: "A pre-sale question in DMs" }
    description: "有人私信问 A 型号配不配得上他那台设备、现在有没有货。"
    expected_output: "一条带商品参数与当前库存的回复草稿；要给折扣的话是一张待批的折扣码卡（上限 10%，与邮件客服同一个数）。"
