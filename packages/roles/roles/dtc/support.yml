# 05 §5 的完整示例。
# 注：05 §5 原文 customer scope 上的 `agent_max_sensitivity: confidential` 已于 31 §3.3 撤销
# （v1 Agent 不持有高于 actor 的读权限），因此这里不再声明；加载器会把它当作未知字段拒绝。
#
# WP54（48 v2 L1）：本文件原来叫 `dtc/aftersales.yml`（`dtc.aftersales` 独立站售后客服）。
# 09-14 Luoye 定：客服不按售前 / 售后拆，**网站客服一条**吃下客服邮箱里的一切，
# 于是 `dtc.presales`（04 §1.1）与 `dtc.aftersales`（04 §1.2）合并成 `dtc.support`：
# 数据域、连接器、写动作与额度全部取并集，**额度按动作分，不按售前 / 售后分**。
# 售前 / 售后不再是模式，而是意图与知识的适用范围（stage）。
# 旧 id 仍然读得进来（加载器的别名表 `ROLE_ID_ALIASES`），已有分配在启动时迁移。
id: dtc.support
version: 2.0.0
domain: dtc
name: { zh: 网站客服, en: DTC Website Support }
description: 客服邮箱、网站表单里的一切：售前问答与推荐、订单状态与物流、退换货、退款、改地址、漏发错发破损、保修、投诉、拒付争议

scopes:
  - { domain: order, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: shipment, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: customer, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: knowledge, ops: [read, stage], range: workspace, max_sensitivity: internal }
  - { domain: discount, ops: [stage], range: assigned, max_sensitivity: internal }
  - { domain: approval, ops: [read, stage, approve], range: own, max_sensitivity: internal }
  - { domain: skill, ops: [read], range: own, max_sensitivity: internal }
  # 并自 `dtc.presales`（04 §1.1 数据域：商品读、库存读）——售前要答"有没有货、配不配得上"，
  # 而它跟售后读的是同一批商品，分成两条职责只会让同一个人身上挂两条一模一样的读权限。
  - { domain: product, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: inventory, ops: [read], range: assigned, max_sensitivity: internal }

connectors:
  - { kind: email, required: true, grants: [mail.read, mail.send], ownership: workspace }
  - {
      kind: shopify,
      required: true,
      grants:
        [
          read_orders,
          write_orders,
          read_fulfillments,
          read_products,
          read_inventory,
          write_discounts,
        ],
      ownership: workspace,
    }
  - { kind: tracking, required: false, grants: [read], ownership: workspace }
  - { kind: payment_dispute, required: false, grants: [disputes.read], ownership: workspace }

actions:
  - id: reply_customer
    target: customer
    kind: outbound_message
    mandate: { caps: {}, window: { max_count: 200, per: day } }
    route_to: role_holder
  - id: stage_refund
    target: order
    kind: staged_change
    requires_record_read: true
    mandate:
      caps: { max_auto_refund_amount: 50, currency: USD, within_policy_window_only: true }
      per_change_limits: { max_items: 1, no_repeat_target_field: true }
      window: { max_count: 20, per: day }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: stage_reship
    target: order
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { max_items_per_order: 1 }, window: { max_count: 10, per: day } }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: stage_address_change
    target: order
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { unfulfilled_only: true } }
    protected_fields: [order.total, order.currency, order.customer_id]
    route_to: role_holder
  # 并自 `dtc.presales`（04 §1.1 写操作）：折扣 ≤ 10%、单码单客单次。
  # 额度写在这个动作上而不是写在职责上——这就是"额度按动作分"那句话的落点。
  - id: stage_discount_code
    target: discount
    kind: staged_change
    mandate:
      caps: { max_presales_discount_pct: 10, single_use_per_customer: true }
      per_change_limits: { max_items: 1 }
      window: { max_count: 20, per: day }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: draft_chargeback_evidence
    target: finance
    kind: staged_change
    mandate: { caps: {} }
    route_to: owner

automation:
  reply_customer:
    ceiling: L3
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]
  stage_refund:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [guardrail_hit, manual]
  stage_reship:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  stage_address_change:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [manual]
  # 04 §1.1「发折扣码 L2 且必过额度」——上限按动作给，不因为它跟退款同在一条职责上就一起松。
  stage_discount_code:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  draft_chargeback_evidence:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]

grounding:
  - {
      name: order_status,
      intent_terms: [订单, order, 包裹, package],
      cue_terms: [哪, where, 什么时候, when, 到了, arrived],
      tool: get_order,
      prefetch: true,
    }
  - {
      name: policy,
      intent_terms: [退, return, refund, 换, exchange],
      cue_terms: [可以, can, 能, 政策, policy],
      tool: search_policies,
      prefetch: true,
    }

skills:
  - { name: customer-care, tier: open, load: always }
  - { name: returns-policy-calc, tier: open, load: on_demand }
  - { name: chargeback-evidence, tier: open, load: on_demand }

home_blocks:
  - {
      id: support.pending_replies,
      placement: queue,
      component: approval_lane,
      query: 'approvals.by_role(dtc.support, reply_customer)',
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: support.pending_refunds,
      placement: queue,
      component: staged_change_list,
      query: changes.pending(dtc.support),
      default_order: 20,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: support.overdue_orders,
      placement: focus,
      component: order_table,
      query: orders.overdue(assigned),
      default_order: 30,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: support.escalations,
      placement: alert,
      component: alert_list,
      query: events.escalations(dtc.support),
      default_order: 5,
      pinnable: false,
      adaptive: false,
    }

notifications:
  - { event: customer.complaint, mode: immediate, recipients: [role_holder, scope_manager] }
  - { event: payment.dispute_opened, mode: immediate, recipients: [role_holder, owner] }
  - {
      event: 'approval.created:stage_refund',
      mode: queue,
      recipients: [scope_manager],
      escalate_after_hours: 24,
    }
  - {
      event: 'approval.created:reply_customer',
      mode: queue,
      recipients: [role_holder],
      escalate_after_hours: 8,
    }
  - {
      event: order.overdue,
      mode: digest,
      recipients: [role_holder],
      digest_schedule: '0 9 * * *',
    }

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []

# WP84（54 §1 第 6 行）：冷启动用的两样。**不是权限**——能不能做仍由上面的
# actions 与额度说了算；点一条只是用这条职责在这个岗位下开一件事（54 §2）。
# quick_prompts：首页岗位卡下面那几个按钮，点一下就开干。
# task_examples：指导抽屉顶部的"这条职责典型能接什么活"，带"你会拿到什么"。

quick_prompts:
  - id: draft_return_reply
    label: { zh: "起草退货回复", en: "Draft a return reply" }
    prompt: "把这封退货来信按退货政策起草一封回复，先算清楚这一单还在不在退货期内"
    kind: start_task
  - id: where_is_order
    label: { zh: "查这单到哪了", en: "Where is this order" }
    prompt: "客户问包裹到哪了：查订单和物流轨迹，把结论和预计到达时间写成一封回信"
    kind: start_task
  - id: unanswered_mail
    label: { zh: "超时没回的来信", en: "Mail nobody answered" }
    prompt: "超过 8 小时还没回的客户来信有哪些，急的排前面"
    kind: ask
  - id: refund_check
    label: { zh: "退款算一算", en: "Work out the refund" }
    prompt: "这一单要退款：按退货政策算能退多少、运费扣不扣，出一张待我批的退款卡"
    kind: review
  - id: chargeback_evidence
    label: { zh: "拒付举证材料", en: "Chargeback evidence" }
    prompt: "这笔拒付：把订单、物流签收记录和往来邮件凑成一份举证材料草稿"
    kind: start_task

task_examples:
  - id: return_request
    title: { zh: "一封退货来信", en: "A return request" }
    description: "客户来信说尺码不合适想退货，东西还没寄回来。"
    expected_output: "一封写好的回信草稿，附上「这单在不在退货期内」的判断依据；退款金额超额度的会变成一张待你批的卡，不会自己发出去。"
  - id: damaged_parcel
    title: { zh: "破损或漏发", en: "Damaged or missing item" }
    description: "客户说收到时盒子压坏了、还少了一件配件，附了两张照片。"
    expected_output: "一张补发或退款的待批卡，带订单、物流签收记录和客户发来的照片；回信草稿一起给你。"
  - id: presale_fit
    title: { zh: "售前问能不能用", en: "A pre-sale fit question" }
    description: "客户问 A 型号配不配得上他家那台设备、现在有没有货。"
    expected_output: "一封带商品参数与当前库存的回信草稿；没货就顺手写清楚什么时候能到，不编日期。"

# ── WP120（69 §2）：**角色定位**。提示里的「你是谁」，六段骨架一段不许少 ──────────
# 第三段「你不负责」是防串岗的那一条：69 §0 那条亲测记录（红人岗位回出客服的话）
# 就是因为提示里从头到尾没有这一句。改这一段之前先读 docs/69。
persona:
  zh: |
    你是谁：这家店的网站客服，客服邮箱里对客户说话的那一位。前台只有你在说话。
    你负责：售前问答、订单与物流、退换货与退款、改地址、漏发错发破损、保修、投诉、拒付材料。
    你不负责：改商品与价格（转网站运营）、写开发信（转红人营销）、账号与群里的内容（转社媒运营）；同事教你的中文原话一个字都不许出现在客户信里。
    怎么做：先查这一单的真实记录，再引事实卡，最后写信；查不到就说查不到，不猜日期、不猜金额。
    口气：像个负责的人，短句，先结论后理由，不推卸。
    必须出卡：每一封信，以及退款、补发、改地址、发码。
  en: |
    Who you are: this shop’s website support agent — the one who speaks to customers in the support mailbox. You are the only voice the customer sees.
    You handle: pre-sales questions, order and shipping status, returns and refunds, address changes, missing/wrong/damaged items, warranty, complaints, chargeback evidence.
    Not yours: editing products or prices (hand to Web Operations), outreach emails (Creator Marketing), account and community content (Social Media). And not one word of a colleague’s Chinese coaching may appear in a customer email.
    How you work: look up this order’s real record first, then cite a fact card, then write. If you cannot find it, say so — never guess a date or an amount.
    Tone: like a responsible person — short sentences, conclusion first, no deflecting.
    Always ask: every message, plus refunds, reships, address changes and discount codes.
