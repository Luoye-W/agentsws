# 51 §2.4 订单履约（WP64）。
#
# 网站运营岗位的第四条职责：待发货处理、拆单、物流单号回填、延误与异常主动通知。
#
# 三条线划在这里：
#
# 1. **标记发货必须带单号与承运商**（guardrail 里是 block，不是提醒）。没单号的
#    "已发货"比"未发货"更糟——顾客查不到轨迹、客服无从回答，而订单状态已经变了。
# 2. **取消订单永远 L1**（15 §2 的 `HARD_L1`）。它连带退款与库存回补，而且不可逆。
# 3. **延误通知走客服那条路**（`outbound_draft`），不是履约自己新起一封信：
#    客户看到的所有信都应该来自同一个声音，而出站的那套门（收件人门禁、脱敏、
#    抑制名单）已经长在客服那条路上了，履约再造一条等于绕过它们。
#
# 超期未发的阈值 `overdue_days` 写在这里（3 天），不写死在查询里——不同类目的
# 发货节奏差得远，改它不该要改代码。
#
# 连接器：Shopify 的订单与履约已经通了（`kind: shop`，按公司档案解析成哪个平台）；
# 物流轨迹（AfterShip / 17track）是骨架，没连的时候面板照 36 §3 明说"还没连"。
id: dtc.fulfillment
version: 1.0.0
domain: dtc
name: { zh: 订单履约, en: Order Fulfillment }
description: 待发货处理、拆单、物流单号回填、延误与异常通知、3PL 与海外仓对接

scopes:
  - { domain: order, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: shipment, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # 拆单要知道哪几件在哪个仓；不给 stage——库存写在店铺管理那条职责上
  - { domain: inventory, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: product, ops: [read], range: assigned, max_sensitivity: internal }
  # 延误通知要有人可发（收件人门禁照样查），但客户档案本身不许改
  - { domain: customer, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: knowledge, ops: [read], range: workspace, max_sensitivity: internal }
  - { domain: approval, ops: [read, approve], range: own, max_sensitivity: internal }

connectors:
  - {
      kind: shop,
      required: true,
      grants: [read_orders, read_fulfillments, write_orders],
      ownership: workspace,
    }
  # 物流轨迹：AfterShip 先做，17track 待增加。没有它 = 只有"发没发"，没有"到哪了"
  - { kind: tracking, required: false, grants: [read], ownership: workspace }
  # 延误通知的草稿要经客服邮箱发出去（同一个声音）
  - { kind: email, required: false, grants: [mail.send], ownership: workspace }

actions:
  # 51 §2.4：单日自动标记发货上限 `max_fulfill_per_day` 默认 50。
  - id: stage_create_fulfillment
    target: order
    kind: staged_change
    requires_record_read: true
    mandate:
      caps: { max_fulfill_per_day: 50, overdue_days: 3, require_tracking_number: true }
      per_change_limits: { max_items: 1, no_repeat_target_field: true }
      window: { max_count: 50, per: day }
    route_to: scope_manager
  - id: stage_split_order
    target: order
    kind: staged_change
    requires_record_read: true
    mandate:
      caps: { max_split_parts: 3 }
      window: { max_count: 10, per: day }
    route_to: scope_manager
  # 取消订单：不可逆，永远人审，而且往 owner 手上送——退款与库存一起动，
  # 这不是范围管理者一个人该替公司拍的板。
  - id: stage_cancel_order
    target: order
    kind: staged_change
    requires_record_read: true
    mandate:
      caps: { unfulfilled_only: true }
      per_change_limits: { max_items: 1 }
      window: { max_count: 5, per: day }
    protected_fields: [order.total, order.currency, order.customer_id]
    review_cannot_be_disabled: true
    route_to: owner
  # 延误 / 异常的主动通知：草稿交给客服那条出站路（14 的 `outbound_draft`）。
  - id: notify_delay
    target: customer
    kind: outbound_message
    mandate:
      caps: { proactive_only_for_overdue: true }
      window: { max_count: 50, per: day }
    route_to: role_holder

automation:
  # 51 §2.4 写的是 L2，指的就是**初始**就在 L2：标记发货与拆单是"照着已经决定好的事
  # 去执行"，额度（单日 50 张、单号必填、拆不过三件）替人守住了边界。
  # 出事就降级（`demotion_triggers`），不是靠一开始卡在 L1。
  stage_create_fulfillment:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [guardrail_hit, manual]
  stage_split_order:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  stage_cancel_order:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  # 51 §2.4：L2 → L3。延误通知的内容是事实（这单晚了几天、新的预计到达），
  # 攒够采纳率之后可以自己发；发的对象仍然只有超期那几张单（`proactive_only_for_overdue`）。
  notify_delay:
    ceiling: L3
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]

skills: []

home_blocks:
  # 51 §2.4 面板四块：待发货、超期未发（已有积木）、物流异常、今日发货数。
  - {
      id: fulfillment.unfulfilled,
      placement: focus,
      component: order_table,
      query: orders.unfulfilled(assigned),
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: fulfillment.overdue,
      placement: alert,
      component: order_table,
      query: orders.overdue(assigned),
      default_order: 5,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: fulfillment.tracking_exceptions,
      placement: alert,
      component: table,
      query: shipments.exceptions,
      default_order: 6,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: fulfillment.shipped_today,
      placement: role_view,
      component: stat_tile,
      query: fulfillments.today,
      default_order: 20,
      pinnable: true,
      adaptive: false,
    }
  - {
      id: fulfillment.pending_changes,
      placement: queue,
      component: staged_change_list,
      query: changes.pending(dtc.fulfillment),
      default_order: 15,
      pinnable: true,
      adaptive: true,
    }

notifications:
  - { event: order.overdue, mode: digest, recipients: [role_holder], digest_schedule: '0 9 * * *' }
  - {
      event: 'approval.created:stage_cancel_order',
      mode: immediate,
      recipients: [owner],
      escalate_after_hours: 12,
    }
  - {
      event: 'approval.created:stage_create_fulfillment',
      mode: queue,
      recipients: [scope_manager],
      escalate_after_hours: 24,
    }

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []

# WP84（54 §1 第 6 行）：冷启动用的两样。**不是权限**——能不能做仍由上面的
# actions 与额度说了算；点一条只是用这条职责在这个岗位下开一件事（54 §2）。
# quick_prompts：首页岗位卡下面那几个按钮，点一下就开干。
# task_examples：指导抽屉顶部的"这条职责典型能接什么活"，带"你会拿到什么"。

quick_prompts:
  - id: unshipped_yesterday
    label: { zh: "昨天还没发的单", en: "Yesterday orders not shipped yet" }
    prompt: "看昨天订单里哪些还没发货，按下单时间从早到晚列"
    kind: ask
  - id: overdue_orders
    label: { zh: "超期未发的", en: "Past the promised time" }
    prompt: "超过承诺时效还没发出去的单有哪些，各卡在哪一步"
    kind: ask
  - id: fill_tracking
    label: { zh: "回填单号", en: "Fill in tracking numbers" }
    prompt: "把仓库刚给的这批单号回填到对应订单上，出一张待我批的发货卡"
    kind: review
  - id: notify_delay
    label: { zh: "通知延误", en: "Tell customers about a delay" }
    prompt: "这几单要延误三天：起草一封通知信，说清新的预计时间和补偿口径"
    kind: start_task
  - id: split_order
    label: { zh: "拆单先发有货的", en: "Split an order" }
    prompt: "这一单里有一件缺货：拆成两单先发有货的，出卡等我批"
    kind: review

task_examples:
  - id: morning_shipping
    title: { zh: "早上过一遍待发", en: "The morning shipping pass" }
    description: "每天早上想知道有哪些单还没发、有没有卡住的。"
    expected_output: "一张待发清单：按下单时间排，卡住的单标出卡在哪一步（缺货 / 地址有问题 / 等仓库）。"
  - id: delay_notice
    title: { zh: "延误要提前告诉客户", en: "Warn customers about a delay" }
    description: "供货晚了三天，要提前告诉受影响的客户。"
    expected_output: "受影响的订单清单，外加一封通知信草稿；真发出去会变成一张待你批的卡。"
