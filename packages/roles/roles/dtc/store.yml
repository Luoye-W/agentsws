# 51 §2.1 店铺管理：**一条职责、五个能力面**（WP63 补齐）。
#
# 它是 15 人 pack 里那条 `dtc.ops`（独立站运营）的新身份。旧 id `dtc.ops` 永远读得
# 进来（加载器的 `ROLE_ID_ALIASES`），已有分配在启动时迁移一次并记
# `assignment.role_migrated`——职责 id 是别人库里已经有的东西。
#
# 五个能力面（51 §2.1 那张表）与它们在下面的落点：
#
# | 能力面 | 读 | 写 |
# |---|---|---|
# | 店铺设置 | 店铺信息 / 政策页 / 运费税支付（只读）/ 导航 / 主题列表 | `stage_listing_edit`（政策页与独立页面）、`stage_publish_theme` |
# | 商品管理 | 商品 / 变体 / 库存 / 集合 / 元字段 | `stage_listing_edit`、`stage_price_change`、`stage_publish_product` / `stage_unpublish_product`、`stage_collection_edit`、`stage_inventory_adjust` |
# | 促销与折扣 | 折扣码 / 自动折扣 / 活动列表 | `stage_discount_code`（营销发码）、`stage_promotion`（全站活动） |
# | 数据日报 | 销售 / 订单 / 转化 / 流量 | **无写**，只出日报卡与异常卡（L3） |
# | 评价管理 | 评价列表与评分（评价应用连接器**待增加**） | `stage_review_reply`、`stage_review_invite` |
#
# 三条纪律，每一条都能在下面指到具体的行：
#
# 1. **额度按动作分，不按能力面分**（51 §2.1）。改价 20%、库存 50 件、促销 30%
#    各挂在各自那条动作的 `mandate.caps` 上——把它们合成一份"店铺管理的额度"，
#    就再也说不清"这次超的是哪一条"。
# 2. **结账 / 支付 / 税不给写动作**（51 §3 N2）。这三样人在后台自己改。所以下面
#    一条对应的动作都没有，`store_config` 那条 scope 也**只有 read**——
#    没有入口比有入口再加一道门更稳。
# 3. **上下架 / 全站活动 / 主题发布永远人审**。这三条不是靠这里的 `ceiling: L1` 拦的
#    （yml 是工作区策略可以放宽的），是靠 `@agentsws/core` 的 `HARD_L1` 硬顶拦的；
#    这里写 `hard_ceiling: true` 只是把同一句话说在人看得见的地方。
#
# 连接器写的是 `kind: shop`，**不写死 Shopify**：这个工作区的店铺后台是哪一个，
# 由公司档案里的「网站是用什么搭的」决定（51 §1 N0）。
id: dtc.store
version: 1.1.0
domain: dtc
name: { zh: 店铺管理, en: DTC Store Management }
description: 店铺设置、商品与库存、促销与折扣、数据日报、评价管理

scopes:
  # 数据日报那一面读的是销售与订单——没有这一条，19 §3 的过滤下推会把整个
  # 「店铺后台」分块从面板上静默拿掉（面板上一个数都没有，也没人说得出为什么）。
  # 只有 read：订单该由谁改是客服与订单履约那两条职责的事。
  - { domain: order, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: product, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # WP63：库存是自己一个域——商品能看不等于仓里的数能改（`inventory_adjust` 挂在它上面）
  - { domain: inventory, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # WP63：店铺设置那一面**只有 read**。结账 / 支付 / 税的写口就是这样被关掉的：
  # 不是"有动作但不给批"，是这条职责压根没有 stage 这个域的权限。
  - { domain: store_config, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: content, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: discount, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: campaign, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # WP63 评价管理：评价应用连接器待增加，权限先立着——面板照 36 §3 明说"还没连"
  - { domain: review, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: analytics, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: knowledge, ops: [read], range: workspace, max_sensitivity: internal }
  - { domain: approval, ops: [read, approve], range: own, max_sensitivity: internal }

connectors:
  # 51 §1 N0：平台中立的 `shop`——按公司档案解析成 shopify_admin / woocommerce。
  # 档案里选了没有连接器的平台（Magento / 其它）= 这条职责没有店铺连接，
  # 面板与工具照 36 §3 明说"这个平台还没接"。
  - { kind: shop, required: true, grants: [read_products, write_products], ownership: workspace }
  # 评价应用（Judge.me / Loox）：连接目录里已登记为"待增加"。`required: false`——
  # 没有它，店铺管理的其余四面照样能干活，只有评价那一块显示"还没连"。
  - { kind: reviews, required: false, grants: [read_reviews, write_reviews], ownership: workspace }

actions:
  # ── 店铺设置 / 商品管理：文案 ────────────────────────────────────────
  - id: stage_listing_edit
    target: product
    kind: staged_change
    requires_record_read: true
    mandate: { caps: {}, window: { max_count: 50, per: day } }
    route_to: scope_manager
  # ── 商品管理：价 ─────────────────────────────────────────────────────
  # 51 §2.1：改价 ≤ 20% 可自动（L2），超了就掉到人审（L1）。那个"掉"不是这里写的，
  # 是 guardrail 看着 `max_price_delta_pct` 当场判的——所以 ceiling 必须给到 L2，
  # 不然额内的那一半永远走不到。`review_cannot_be_disabled` 保证超额那一半
  # 不会被工作区策略关掉。
  - id: stage_price_change
    target: product
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { max_price_delta_pct: 20 }, window: { max_count: 20, per: day } }
    review_cannot_be_disabled: true
    route_to: scope_manager
  # ── 商品管理：上下架 ─────────────────────────────────────────────────
  # WP44：Admin GraphQL 的上下架写口对应 15 §2 的 publish_product / unpublish_product。
  # 上架是"让顾客能买到"，撤下是"让顾客买不到"——两件事都要有人点头，
  # 但撤下更急（多半是发现了合规或质量问题），所以给到 role_holder 手上，别卡在主管那儿。
  - id: stage_publish_product
    target: product
    kind: staged_change
    requires_record_read: true
    mandate: { caps: {}, window: { max_count: 20, per: day } }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: stage_unpublish_product
    target: product
    kind: staged_change
    requires_record_read: true
    mandate: { caps: {}, window: { max_count: 20, per: day } }
    review_cannot_be_disabled: true
    route_to: role_holder
  # ── 商品管理：集合 ───────────────────────────────────────────────────
  # 往「首页精选」里塞一件商品，改的是整家店的货架，所以它从 listing_edit 里分出来了。
  # 一次最多动 20 件：再多就不是"调整货架"而是"重排整个集合"，那得人看一眼。
  - id: stage_collection_edit
    target: product
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { max_collection_products: 20 }, window: { max_count: 20, per: day } }
    route_to: scope_manager
  # ── 商品管理：库存 ───────────────────────────────────────────────────
  # 51 §2.1 N5：库存调整 ≤ 50 件 L2；**直接设定永远 L1**（guardrail 里
  # `inventory_set_needs_review` 那一条，不看数字，只看是不是 `mode: set`）。
  - id: stage_inventory_adjust
    target: inventory
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { max_inventory_adjust: 50 }, window: { max_count: 30, per: day } }
    route_to: scope_manager
  # ── 促销与折扣：单码 ─────────────────────────────────────────────────
  # 51 §2.1：**营销发码与客服的安抚发码分账**。同一条 ChangeKind，两组 cap：
  # 客服那条职责配的是 `max_presales_discount_pct`，这里配的是
  # `max_promo_discount_pct` + `max_promo_uses`。两边各判各的，互不牵连。
  # 没有 `usage_limit` 的码（"无上限码"）在 guardrail 里直接转人审。
  - id: stage_discount_code
    target: discount
    kind: staged_change
    mandate:
      caps: { max_promo_discount_pct: 30, max_promo_uses: 500 }
      window: { max_count: 10, per: day }
    route_to: scope_manager
  # ── 促销与折扣：全站活动 ─────────────────────────────────────────────
  # 自动折扣 = 不用输码、全店生效。51 §2.1：永远 L1（`HARD_L1` 里也有它）。
  - id: stage_promotion
    target: campaign
    kind: staged_change
    mandate: { caps: { max_promotion_discount_pct: 30 }, window: { max_count: 5, per: day } }
    review_cannot_be_disabled: true
    route_to: owner
  # ── 店铺设置：主题发布 ───────────────────────────────────────────────
  # 43：主题走官方 CLI、未发布副本预览、**发布永远人审**（`HARD_L1`）。
  # 建站岗位（`site.builder`）也有这条动作；同一件事两条职责都提得动，
  # 谁提的由运行时那一刻挂的是哪条分配决定。
  - id: stage_publish_theme
    target: content
    kind: staged_change
    requires_record_read: true
    mandate: { caps: {}, window: { max_count: 3, per: day } }
    review_cannot_be_disabled: true
    route_to: owner
  # ── 评价管理 ─────────────────────────────────────────────────────────
  # 51 §2.1：回复 L2；**差评处理转客服 `dtc.support`**——低于 `review_reply_min_rating`
  # 的那些，guardrail 记一条 hit，卡转到客服那条职责手上，店铺管理这边不自己回。
  - id: stage_review_reply
    target: review
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { review_reply_min_rating: 3 }, window: { max_count: 30, per: day } }
    route_to: { role: dtc.support }
  # 邀评：额度之外还有一张合规词表（`REVIEW_INVITE_FORBIDDEN`）。
  # 拿好处换好评在哪个平台都是封号级违规，所以命中直接 block——
  # 不给"人点一下就发出去"的路径。
  - id: stage_review_invite
    target: review
    kind: staged_change
    mandate: { caps: { max_review_invites_per_day: 50 }, window: { max_count: 50, per: day } }
    route_to: scope_manager
  # ── WP76（58 §1）：向设计岗下需求单 ──────────────────────────────────
  # 这一条与上面每一条都无关，是**新加的独立段落**：它不改这条职责的任何
  # 既有行为，只多一个出口——店铺要图的时候，不用人再去设计岗手动开一件事（`design.dtc`）。
  #
  # 动作 = 开一件事并按 54 路由到**设计岗**（不是直接指定哪条设计职责：
  # 该走五条里的哪一条由设计岗自己的意图词判，54 §2）。
  # ChangeKind 是 `design_request`，**L3 自动**——它不出图、不花钱、
  # 不对外发一个字，下错了设计岗那边关掉就是了。
  - id: request_design
    target: design_request
    kind: staged_change
    mandate:
      caps: { max_design_requests_per_day: 5 }
      per_change_limits: { max_items: 1 }
      window: { max_count: 5, per: day }
    route_to: role_holder

automation:
  # 文案 L2（51 §2.1）
  stage_listing_edit:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [guardrail_hit, manual]
  # 改价：额内 L2、超额 L1。上限给到 L2，掉不掉由 guardrail 当场判
  stage_price_change:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [guardrail_hit, manual]
  # 上下架永远 L1（硬顶在 `HARD_L1`，这里只是把同一句话写在人看得见的地方）
  stage_publish_product:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  stage_unpublish_product:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  stage_collection_edit:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  # 库存：额内 L2；`mode: set` 由 guardrail 一律转人审
  stage_inventory_adjust:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  # 单码：额内且限量 L2
  stage_discount_code:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  # 全站活动永远 L1
  stage_promotion:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  # 主题发布永远 L1
  stage_publish_theme:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  stage_review_reply:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]
  stage_review_invite:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]
  # ── WP76（58 §1）：向设计岗下需求单 ──────────────────────────────────
  # L3 自动：下一张需求单不产生任何外部可见的东西。真正要人点的在设计岗
  # 那一侧（变体 L2 出卡给人挑、入库 L1 永远人定）。
  request_design:
    ceiling: L3
    initial: L3
    promotion: { adoption_rate_min: 0.9, window_weeks: 2, min_samples: 20 }
    demotion_triggers: [manual]

# 51 §2.1 异常卡的阈值（销售骤降 / 库存断货 / 转化异常）。
# 数字在这里而不是在代码里：什么叫"骤降"，卖家具的和卖快消的不是一个数。
thresholds:
  # 库存 ≤ 这个数就算"告急"（面板上的「库存告急数」与断货异常卡都看它）
  low_stock_quantity: 5
  # 销售额比对比期跌掉这么多个百分点 → 出一张"销售骤降"卡
  sales_drop_pct: 30
  # 转化率比对比期跌掉这么多个百分点 → 出一张"转化异常"卡
  conversion_drop_pct: 25
  # 评分低于这个数的评价进"差评表"（与 `review_reply_min_rating` 同一条线）
  bad_review_rating: 3

skills: []
home_blocks:
  # 36 §3 待审改动：**listing / 价 / 上下架 / 促销各一条车道**。
  # 为什么分车道而不是一张大表：这四种卡该看的东西不一样——文案看 diff、
  # 改价看幅度、上下架看影响面、促销看力度与限量。混在一起，人只能一张张点开。
  - {
      id: store.pending_listing,
      placement: queue,
      component: staged_change_list,
      query: changes.pending_listing,
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: store.pending_price,
      placement: queue,
      component: staged_change_list,
      query: changes.pending_price,
      default_order: 11,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: store.pending_publish,
      placement: queue,
      component: staged_change_list,
      query: changes.pending_publish,
      default_order: 12,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: store.pending_promotion,
      placement: queue,
      component: staged_change_list,
      query: changes.pending_promotion,
      default_order: 13,
      pinnable: true,
      adaptive: true,
    }
  # 库存告急表（阈值见上面的 `thresholds.low_stock_quantity`）
  - {
      id: store.low_stock,
      placement: alert,
      component: table,
      query: inventory.low_stock,
      default_order: 20,
      pinnable: true,
      adaptive: false,
    }
  # 差评表：评价应用连接器还没接，这一块照 36 §3 明说"还没连"，不出空表
  - {
      id: store.bad_reviews,
      placement: alert,
      component: table,
      query: reviews.negative,
      default_order: 21,
      pinnable: true,
      adaptive: false,
    }
  # 日报卡：L3 自动出，看完归档（51 §2.1 数据日报那一面唯一的产出）
  - {
      id: store.daily_report,
      placement: digest,
      component: table,
      query: store.daily_report,
      default_order: 30,
      pinnable: false,
      adaptive: false,
    }
notifications:
  - {
      event: 'approval.created:stage_price_change',
      mode: queue,
      recipients: [scope_manager],
      escalate_after_hours: 24,
    }
  # 上下架与全站活动永远人审，卡压着不动比压着一条文案严重得多——12 小时就催
  - {
      event: 'approval.created:stage_publish_product',
      mode: queue,
      recipients: [scope_manager],
      escalate_after_hours: 12,
    }
  - {
      event: 'approval.created:stage_promotion',
      mode: immediate,
      recipients: [owner],
      escalate_after_hours: 12,
    }
  # 日报是"看一眼就归档"的东西，别一条条弹——按天汇总
  - {
      event: 'digest.daily_report',
      mode: digest,
      recipients: [role_holder],
      digest_schedule: '0 9 * * *',
    }
handover:
  transfers: [open_work_items, context, home_blocks]
  fallback: scope_manager
  revoke_context_on_removal: true
requires: []

# WP84（54 §1 第 6 行）：冷启动用的两样。**不是权限**——能不能做仍由上面的
# actions 与额度说了算；点一条只是用这条职责在这个岗位下开一件事（54 §2）。
# quick_prompts：首页岗位卡下面那几个按钮，点一下就开干。
# task_examples：指导抽屉顶部的"这条职责典型能接什么活"，带"你会拿到什么"。

quick_prompts:
  - id: yesterday_numbers
    label: { zh: "昨天卖得怎么样", en: "Yesterday's numbers" }
    prompt: "把昨天的销售额、订单数、转化率和前一天比一比，只说变化大的那几项"
    kind: ask
  - id: low_stock
    label: { zh: "快断货的商品", en: "What is running out" }
    prompt: "按最近 7 天的卖法，哪些商品快断货了，给我一份补货清单"
    kind: ask
  - id: price_change
    label: { zh: "改一个价", en: "Change a price" }
    prompt: "把这个商品降价 10%，出一张待我批的改价卡，附上它最近 7 天的销量"
    kind: review
  - id: new_discount
    label: { zh: "做一个折扣码", en: "Create a discount code" }
    prompt: "做一个 8 折折扣码，限单客一次、下周日到期，出卡等我批"
    kind: review
  - id: reply_reviews
    label: { zh: "回一轮评价", en: "Reply to this week reviews" }
    prompt: "这周还没回的评价按好评差评分开，差评先给我起草回复"
    kind: start_task

task_examples:
  - id: daily_check
    title: { zh: "每天早上看一眼", en: "The morning check" }
    description: "开店一天下来，想知道昨天有没有出岔子。"
    expected_output: "一张日报卡：销售额、订单数、转化、异常项各一行；哪一项过了阈值会单独出一张异常卡，不用你自己盯。"
  - id: price_adjust
    title: { zh: "给一批商品调价", en: "Adjust prices on a batch" }
    description: "季末想给一批商品统一降价。"
    expected_output: "一张待批的改价卡，列出每个商品改前改后的价、影响多少个变体；你批了才写回店铺。"
  - id: restock
    title: { zh: "算下周补多少货", en: "Work out next week restock" }
    description: "想知道下周该补哪些货、各补多少。"
    expected_output: "一份按最近销量算出来的补货清单，断货风险最高的排最前面，每条附上估计能撑几天。"

# ── WP120（69 §2）：**角色定位**。提示里的「你是谁」，六段骨架一段不许少 ──────────
# 第三段「你不负责」是防串岗的那一条：69 §0 那条亲测记录（红人岗位回出客服的话）
# 就是因为提示里从头到尾没有这一句。改这一段之前先读 docs/69。
persona:
  zh: |
    你是谁：网站运营岗位里管店铺本身的人。
    你负责：店铺设置、商品与库存、价格、促销与折扣码、数据日报、评价回复与邀评。
    你不负责：客户一对一的问答与退款→客服；网站这个壳怎么搭→建站；账号与社群→社媒运营；买广告→投放。
    怎么做：动商品与价格前先看这一条现在是什么样、最近卖得怎么样；数拿不到就说拿不到，别按印象改价。
    口气：像管店的人，说人话，先讲影响多少单。
    必须出卡：改价、上下架、发促销与折扣码、调库存、发布主题、每一条评价回复。
  en: |
    Who you are: the person who runs the shop itself, inside the web-operations position.
    You handle: shop settings, products and inventory, prices, promotions and discount codes, the daily numbers, review replies and review invitations.
    Not yours: one-to-one customer questions and refunds → Customer Care; how the site itself is built → Site Building; accounts and communities → Social Media; buying ads → Paid Ads.
    How you work: before touching a product or a price, look at what it is now and how it has been selling. If you cannot get the numbers, say so — never reprice on impression.
    Tone: like someone running a shop — plain words, lead with how many orders this affects.
    Always ask: price changes, publishing or unpublishing, promotions and discount codes, inventory adjustments, publishing a theme, every review reply.
