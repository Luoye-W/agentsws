# WP191（docs/86 §5）：社媒运营的内容账号组：**Facebook 主页运营**（从 `social.meta` 拆出）。
#
# 内容账号组各条职责的骨架**完全相同**（56 §2 上半行）：动作 id、数据域、审批等级
# 一个都不许改（54：同构的职责只靠意图词分得开）。不同的只有：渠道连接器、额度、
# grounding 的意图词、persona、快捷提示，还有下面那一段"这条渠道特有的部分"。
# 骨架为什么长这样，写在 `social/meta.yml` 的文件头里；每条渠道的定义怎么来的，
# 写在 docs/86（WP191 调研：开源技能、职业标准、平台官方规则、行业数据）。
#
# 这条渠道特有的部分（docs/86 §3.2）：
#
# 1. **与 Instagram 共用 `meta_graph` 一张卡**（Luoye 09-29：连一次、批一次）。拆的是职责，
#    不是连接：同一次 Facebook 登录授权里同时要主页与 IG 的权限。
# 2. **排期两格必须一起写**（`published: false` + `scheduled_publish_time`），官方要求时间
#    在 10 分钟到 30 天之间；超出窗口的由我们自己的调度器到点再发。落点在
#    `@agentsws/social-core` 的 `channels/meta.ts`（`facebook` 与老 `meta` 是同一份实现）。
# 3. **发布权限要过 App Review**：连上就能读，能发要审——连不上与发不出去是两句话。
#    API 发 Reels 每主页 24 小时 30 条；主页快拍的素材不能是发过的。
# 4. **Facebook 群组不归这条**（`social.facebook-group`，浏览器模式）；Messenger 里的
#    客户问题也不归这条（转客服）。意图词里不写"群组 / 小组 / group"，路由才分得开。
# 5. **原创被硬执行**：搬运、加边框变速、拼接都算不原创，会被降推荐、取消变现；
#    **同一条不许原样搬到 IG**——这是拆成两条的理由（docs/86 §2 规律 3）。
#
# 「Reels 拿触达、图文拿深度、群组做社群」的分工参考了 social-media-skills/skills 的
# facebook-strategy（MIT），用自己的话写，未搬原文。
#
# 边界（56 表头，Luoye 09-16 定）：内容、氛围、活动、群规归我；
# **客户的问题不归我，转客服**（`dtc.community-support`）。下面 `description` 与
# `grounding` 的意图词就是 54 §2 岗位路由判这件事的依据——写不足 = 路由不到。
id: social.facebook
version: 1.0.0
domain: social
name: { zh: Facebook 主页运营, en: Facebook Page }
description: Facebook 主页（我们自己的）：帖子、Reels 与快拍的排期发布、回评论、主页资料、近 30 天表现。内容、氛围、活动归我；客户的问题不归我，转客服

scopes:
  - { domain: social_account, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: community_thread, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: knowledge, ops: [read], range: workspace, max_sensitivity: internal }
  - { domain: skill, ops: [read], range: own, max_sensitivity: internal }
  - { domain: product, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: approval, ops: [read, approve], range: own, max_sensitivity: internal }

connectors:
  # `required: false`：没连也能排内容、写草稿、攒审批——真发出去那一跳才需要它。
  # 与 `social.instagram` 共用这一张（连一次、批一次，docs/86 §5）。
  - { kind: meta_graph, required: false, grants: [read_pages, read_insights, publish_posts, manage_comments], ownership: workspace }

actions:
  # 额度写在**动作**上不写在职责上（同 51 §2.3）。数从哪来见 docs/86 §3.1。
  - id: stage_post
    target: social_account
    kind: staged_change
    mandate:
      # 一天 2 条（docs/86 §3.1：行业建议一天 1–2 条）。原 `social.meta` 是两个号合计 3 条。
      caps: { max_posts_per_day: 2 }
      per_change_limits: { max_items: 1 }
      window: { max_count: 2, per: day }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: reply_comment
    target: community_thread
    kind: outbound_message
    mandate:
      caps: { max_comment_replies_per_day: 50 }
      window: { max_count: 50, per: day }
    route_to: role_holder
  - id: stage_profile_edit
    target: social_account
    kind: staged_change
    mandate:
      caps: {}
      per_change_limits: { max_items: 1 }
      window: { max_count: 5, per: week }
    # 改 handle 连提都不许提（`@agentsws/core` 的 `PROTECTED_FIELDS`）
    protected_fields: [handle, username, account_id, external_id]
    review_cannot_be_disabled: true
    route_to: owner
  # WP76（58 §1）→ WP191：原 `social.meta` 上那条「向设计岗下需求单」随拆分带过来。
  # L3 自动：下一张需求单不产生任何外部可见的东西（→ `design.social`）。
  - id: request_design
    target: design_request
    kind: staged_change
    mandate:
      caps: { max_design_requests_per_day: 5 }
      per_change_limits: { max_items: 1 }
      window: { max_count: 5, per: day }
    route_to: role_holder

automation:
  # **发布永远 L1**（56 §2 / 15 §2 的 `HARD_L1`）。
  stage_post:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  # 回评论 L2 → L3：能升是因为承诺扫描把"改得了钱"那一半直接拦死。
  reply_comment:
    ceiling: L3
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 50 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]
  stage_profile_edit:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  request_design:
    ceiling: L3
    initial: L3
    promotion: { adoption_rate_min: 0.9, window_weeks: 2, min_samples: 20 }
    demotion_triggers: [manual]

skills:
  - { name: brand-voice, tier: open, load: always }
  # WP220：社媒研究（爆款帖、评论、竞品拆解；改编自 social-media-research-skills，取数只走许可的口）
  - { name: social-research, tier: open, load: on_demand }

home_blocks:
  - {
      id: social.facebook.calendar,
      placement: focus,
      component: table,
      query: social.content_calendar,
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: social.facebook.queue,
      placement: queue,
      component: table,
      query: social.publish_queue,
      default_order: 20,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: social.facebook.performance,
      placement: role_view,
      component: table,
      query: social.performance_30d,
      default_order: 30,
      pinnable: true,
      adaptive: false,
    }
  - {
      id: social.facebook.comments,
      placement: queue,
      component: table,
      query: social.pending_comments,
      default_order: 40,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: social.facebook.handoffs,
      placement: role_view,
      component: table,
      query: social.support_handoffs,
      default_order: 50,
      pinnable: true,
      adaptive: false,
    }

grounding:
  # 54 §2：内容组各条的动作 id 与数据域完全一样，**意图词是唯一分得开它们的东西**。
  # 不写 Instagram / IG（那是 `social.instagram`）、不写群组（那是 `social.facebook-group`）。
  - {
      name: facebook_intent,
      intent_terms: [Facebook, FB, 脸书, 主页, 粉丝专页, Facebook Page, FB Reels, Messenger, page],
      cue_terms: [发, 排期, 定时, 评论, 回复, 粉丝, 触达, 互动, 涨粉, 简介, 置顶, 快拍],
      tool: list_social_posts,
      prefetch: false,
    }
  # 19：文案里说到产品、价格、时效、政策之前先查事实卡
  - {
      name: facts_before_post,
      intent_terms: [文案, 发帖, 起草, 上新, 活动, post, caption, announce],
      cue_terms: [价格, 折扣, 包邮, 时效, 保修, 参数, 库存, price, discount, warranty],
      tool: search_policies,
      prefetch: true,
    }
  # 56 的边界：客户的问题不归我。意图词写足，54 的路由才判得到"转客服"
  - {
      name: customer_question_goes_to_support,
      intent_terms: [订单, 发货, 物流, 退款, 退货, 保修, 怎么用, order, refund, shipping, warranty],
      cue_terms: [我的, 什么时候, 还没, 坏了, my, when, not received, broken],
      tool: route_to_community_support,
      prefetch: false,
    }

notifications:
  # 发布永远人审，卡压着不动 = 这条内容错过了它的时间点
  - {
      event: 'approval.created:stage_post',
      mode: immediate,
      recipients: [role_holder],
      escalate_after_hours: 4,
    }
  - {
      event: 'approval.created:reply_comment',
      mode: queue,
      recipients: [role_holder],
      escalate_after_hours: 12,
    }
  - {
      event: 'guardrail.hit:commitment_scan',
      mode: immediate,
      recipients: [role_holder, scope_manager],
    }
  - { event: 'social.schedule_conflict', mode: queue, recipients: [role_holder] }

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane, scheduled_tasks]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []

quick_prompts:
  - id: week_plan
    label: { zh: "排下周的内容", en: "Plan next week" }
    prompt: "按这周的表现和手上的素材，给 FB 主页排下周的内容，一天一条左右，Reels 和图文轮着来，撞车的说清楚"
    kind: start_task
  - id: draft_post
    label: { zh: "起草一条", en: "Draft a post" }
    prompt: "给这次上新起一条 FB 主页的帖子，配文短一点、别堆标签，价格和时效只写事实卡里有的"
    kind: start_task
  - id: comments_waiting
    label: { zh: "有哪些评论等着回", en: "Comments waiting" }
    prompt: "主页上现在有哪些评论还没回？哪些是客户的问题该转客服、哪些我自己回，分开列"
    kind: ask
  - id: last_30d
    label: { zh: "这个月发得怎么样", en: "How did the last 30 days go" }
    prompt: "近 30 天主页发的内容里，触达和互动最好的三条是哪几条，它们有什么共同点"
    kind: ask

task_examples:
  - id: weekly_calendar
    title: { zh: "排一周的内容", en: "Fill a week of the calendar" }
    description: "下周有一次上新，手上有几张图和一段视频。"
    expected_output: "一份按天排好的主页日历（每条写清形式、时间、文案），撞车的地方直接给下一个空档；每一条都要你点一下才真发出去。"
  - id: comment_triage
    title: { zh: "把评论分一分", en: "Sort the comments" }
    description: "一条爆了的帖子下面有几十条评论，来不及一条条看。"
    expected_output: "按六类分好的一张表：客户的问题已经变成转客服卡，合作询问提示转红人营销，夸和投诉给出回复草稿，垃圾按规矩处理。"
  - id: not_the_group
    title: { zh: "主页和群组分开", en: "Page vs group" }
    description: "想在 Facebook 群组里发一条公告。"
    expected_output: "说清楚这是 Facebook 群组那条职责的事（走受控浏览器、群发永远人审），这条只管主页。"

# WP179（Luoye 09-29「官方功能优先」）：官方网页搜索（用 DeepSeek 账号 / key 搜）与抓公开网页。
# WP220：研究技能要上网查新闻、帖子、话题；reddit.com / x.com 的公开页面也能抓（Luoye 10-05，不用品牌账号）。
# 每条运行上限走 thresholds.web_search_per_run / web_fetch_per_run（不写 = 5 / 10）。
web_tools: [web_search, web_fetch]

# ── WP120（69 §2）：**角色定位**。提示里的「你是谁」，六段骨架一段不许少 ──────────
# 第三段「你不负责」是防串岗的那一条。改这一段之前先读 docs/69；
# 「怎么做」那一句的平台做法来自 docs/86 §2 / §3（出处与许可证在那里）。
persona:
  zh: |
    你是谁：社媒运营岗位里管我们自己 Facebook 主页的人。
    你负责：主页帖子、Reels 与快拍的排期发布、回评论、主页资料、近 30 天表现。
    你不负责：订单、退款、物流→客服（评论区冒出来的也转）；找红人→红人营销；买广告→投放；别人的版→公共关系；Facebook 群组→群组那条。
    怎么做：先看主页最近发过什么、评论在聊什么；配文短、不堆标签不诱导互动；不把 IG 那条原样搬来；拿不准的按客户问题转走。
    口气：像社区里的人，接地气、不官腔、不承诺。
    必须出卡：发布与排期、改账号资料、任何对外可见的回复。
