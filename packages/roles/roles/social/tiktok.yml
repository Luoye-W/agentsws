# 56 §2 社媒运营的内容账号组：**TikTok 运营**（WP72；WP191 按 docs/86 充实）。
#
# 内容账号组各条职责的骨架**完全相同**（56 §2 上半行）：动作 id、数据域、审批等级
# 一个都不许改（54：同构的职责只靠意图词分得开）。不同的只有：渠道连接器、额度、
# grounding 的意图词、persona、快捷提示，还有下面那一段"这条渠道特有的部分"。
# 骨架为什么长这样，写在 `social/meta.yml` 的文件头里；每条渠道的定义怎么来的，
# 写在 docs/86（WP191 调研：开源技能、职业标准、平台官方规则、行业数据）。
#
# 这条渠道特有的部分（docs/86 §3.2）：
#
# 1. **发布接口是申请制**（Content Posting API，与红人那条用的 Research API 要分别申请）。
#    **没过审计的应用发出去的只有自己看得见**、账号还得设成私密——"发出去了"不等于
#    "大家看得到"，卡面与准备说明里要写清。
# 2. **发布是两跳**：init 拿 publish_id，TikTok 抓素材后轮询状态；"发出去了"要等轮询回来才算。
#    发之前必须先查 `creator_info`；**可见范围要人亲手选**、商业内容声明开关默认关——
#    这两格替人选就违反了 TikTok 的内容分享规范。
# 3. **没有开放的评论读写接口**。待回评论这一块在这条渠道上是空的——空的理由要说出来。
# 4. **不进推荐的内容**：搬运没有二创、带别家水印、极短或纯静图（For You 资格标准）。
#    开头三秒定生死；粉丝数与过去的爆款不是推荐的直接因素（TikTok 2020）。
#
# 「三秒钩子」「一周 3–5 条起、做得到再加」参考了 coreyhaines31/marketingskills 的 social（MIT）
# 与 msitarzewski/agency-agents 的 TikTok 角色（MIT），用自己的话写，未搬原文。
#
# 边界（56 表头，Luoye 09-16 定）：内容、氛围、活动、群规归我；
# **客户的问题不归我，转客服**（`dtc.community-support`）。下面 `description` 与
# `grounding` 的意图词就是 54 §2 岗位路由判这件事的依据——写不足 = 路由不到。
id: social.tiktok
version: 1.0.0
domain: social
name: { zh: TikTok 运营, en: TikTok }
description: TikTok 账号（我们自己的）：短视频排期与发布、钩子与配文、回评论、账号资料、近 30 天表现。内容、氛围、活动归我；客户的问题不归我，转客服

scopes:
  - { domain: social_account, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: community_thread, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: knowledge, ops: [read], range: workspace, max_sensitivity: internal }
  - { domain: skill, ops: [read], range: own, max_sensitivity: internal }
  - { domain: product, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: approval, ops: [read, approve], range: own, max_sensitivity: internal }

connectors:
  # `required: false`：没连也能排内容、写草稿、攒审批——真发出去那一跳才需要它。
  # 申请制；没过审计时发出去的只有自己看得见（docs/86 §3.2）。
  - { kind: tiktok_content, required: false, grants: [read_profile, read_videos, publish_video], ownership: workspace }

actions:
  # 额度写在**动作**上不写在职责上（同 51 §2.3）。数从哪来见 docs/86 §3.1。
  - id: stage_post
    target: social_account
    kind: staged_change
    mandate:
      # 一天 3 条（docs/86 §3.1：平台自己建议一天 1–4 条，行业数一周 2–5 条起；3 是"别刷屏"的线）。
      caps: { max_posts_per_day: 3 }
      per_change_limits: { max_items: 1 }
      window: { max_count: 3, per: day }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: reply_comment
    target: community_thread
    kind: outbound_message
    mandate:
      caps: { max_comment_replies_per_day: 50 }
      window: { max_count: 50, per: day }
    route_to: role_holder
  - id: stage_profile_edit
    target: social_account
    kind: staged_change
    mandate:
      caps: {}
      per_change_limits: { max_items: 1 }
      window: { max_count: 5, per: week }
    # 改 handle 连提都不许提（`@agentsws/core` 的 `PROTECTED_FIELDS`）
    protected_fields: [handle, username, account_id, external_id]
    review_cannot_be_disabled: true
    route_to: owner

automation:
  # **发布永远 L1**（56 §2 / 15 §2 的 `HARD_L1`）。
  stage_post:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  # 回评论 L2 → L3：能升是因为承诺扫描把"改得了钱"那一半直接拦死。
  reply_comment:
    ceiling: L3
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 50 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]
  stage_profile_edit:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]

skills:
  - { name: brand-voice, tier: open, load: always }
  # WP220：社媒研究（爆款帖、评论、竞品拆解；改编自 social-media-research-skills，取数只走许可的口）
  - { name: social-research, tier: open, load: on_demand }

home_blocks:
  - {
      id: social.tiktok.calendar,
      placement: focus,
      component: table,
      query: social.content_calendar,
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: social.tiktok.queue,
      placement: queue,
      component: table,
      query: social.publish_queue,
      default_order: 20,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: social.tiktok.performance,
      placement: role_view,
      component: table,
      query: social.performance_30d,
      default_order: 30,
      pinnable: true,
      adaptive: false,
    }
  - {
      id: social.tiktok.comments,
      placement: queue,
      component: table,
      query: social.pending_comments,
      default_order: 40,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: social.tiktok.handoffs,
      placement: role_view,
      component: table,
      query: social.support_handoffs,
      default_order: 50,
      pinnable: true,
      adaptive: false,
    }

grounding:
  # 54 §2：内容组各条的动作 id 与数据域完全一样，**意图词是唯一分得开它们的东西**。
  - {
      name: tiktok_intent,
      intent_terms: [TikTok, 抖音国际版, 短视频, dou, 合拍, 拼接, 挑战赛, 草稿箱, 钩子, short video],
      cue_terms: [发, 排期, 定时, 播放, 完播, 观看时长, 点赞, 评论, 分享, 粉丝, 涨粉, 话题, 标签],
      tool: list_social_posts,
      prefetch: false,
    }
  # 19：文案里说到产品、价格、时效、政策之前先查事实卡
  - {
      name: facts_before_post,
      intent_terms: [文案, 发帖, 起草, 上新, 活动, post, caption, announce],
      cue_terms: [价格, 折扣, 包邮, 时效, 保修, 参数, 库存, price, discount, warranty],
      tool: search_policies,
      prefetch: true,
    }
  # 56 的边界：客户的问题不归我。意图词写足，54 的路由才判得到"转客服"
  - {
      name: customer_question_goes_to_support,
      intent_terms: [订单, 发货, 物流, 退款, 退货, 保修, 怎么用, order, refund, shipping, warranty],
      cue_terms: [我的, 什么时候, 还没, 坏了, my, when, not received, broken],
      tool: route_to_community_support,
      prefetch: false,
    }

notifications:
  # 发布永远人审，卡压着不动 = 这条内容错过了它的时间点
  - {
      event: 'approval.created:stage_post',
      mode: immediate,
      recipients: [role_holder],
      escalate_after_hours: 4,
    }
  - {
      event: 'approval.created:reply_comment',
      mode: queue,
      recipients: [role_holder],
      escalate_after_hours: 12,
    }
  - {
      event: 'guardrail.hit:commitment_scan',
      mode: immediate,
      recipients: [role_holder, scope_manager],
    }
  - { event: 'social.schedule_conflict', mode: queue, recipients: [role_holder] }

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane, scheduled_tasks]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []

quick_prompts:
  - id: week_plan
    label: { zh: "排下周的视频", en: "Plan next week" }
    prompt: "按这周的播放和手上的素材，给 TikTok 排下周的视频，一天不超过一条，撞车的说清楚"
    kind: start_task
  - id: draft_post
    label: { zh: "起草一条", en: "Draft a post" }
    prompt: "给这条视频写开头三秒的钩子、一段配文和话题标签，按品牌话术来，价格和时效只写事实卡里有的"
    kind: start_task
  - id: hook_ideas
    label: { zh: "三个开头", en: "Three hooks" }
    prompt: "同一条视频给我三个不同的开头三秒，各写一句为什么会有人停下来"
    kind: start_task
  - id: comments_waiting
    label: { zh: "有哪些评论等着回", en: "Comments waiting" }
    prompt: "现在有哪些评论还没回？哪些是客户的问题该转客服、哪些我自己回，分开列"
    kind: ask
  - id: last_30d
    label: { zh: "这个月发得怎么样", en: "How did the last 30 days go" }
    prompt: "近 30 天发的视频里，播放和完播最好的三条是哪几条，它们有什么共同点"
    kind: ask

task_examples:
  - id: weekly_calendar
    title: { zh: "排一周的视频", en: "Fill a week of the calendar" }
    description: "下周要推一个新品，手上有几段素材。"
    expected_output: "一份按天排好的日历（每条写清钩子、配文、话题、什么时间发），撞车的地方直接给下一个空档；每一条都要你点一下才真发出去。"
  - id: hook_rewrite
    title: { zh: "重写开头三秒", en: "Rewrite the first three seconds" }
    description: "上一条完播率很低，想换个开头重发。"
    expected_output: "三个新开头，每个一句话说清为什么会让人停下；提醒哪些改法算原创、哪些（加边框、变速）平台不认。"
  - id: audit_pending
    title: { zh: "没过审计时发出去看得见吗", en: "Before the audit" }
    description: "发布接口批了，但应用还没过 TikTok 的审计。"
    expected_output: "说清楚：没过审计时经接口发出去的只有自己看得见；在此之前建议把视频放进草稿箱、你在 App 里点发布。"
  - id: rival_outliers
    title: { zh: "拆一下竞品这个月的爆款", en: "Break down a rival's top posts" }
    description: "老板说：「拆一下竞品这个月的爆款帖。」"
    expected_output: "一张表：每条帖子的播放、跟它自己中位数比的倍数（大爆 / 明显 / 小爆）、为什么火；样本不到 10 条就写置信低；最后几条我们能拍的想法。照着写的草稿另出卡等你批。"

# WP179（Luoye 09-29「官方功能优先」）：官方网页搜索（用 DeepSeek 账号 / key 搜）与抓公开网页。
# WP220：研究技能要上网查新闻、帖子、话题；reddit.com / x.com 的公开页面也能抓（Luoye 10-05，不用品牌账号）。
# 每条运行上限走 thresholds.web_search_per_run / web_fetch_per_run（不写 = 5 / 10）。
web_tools: [web_search, web_fetch]

# ── WP120（69 §2）：**角色定位**。提示里的「你是谁」，六段骨架一段不许少 ──────────
# 第三段「你不负责」是防串岗的那一条。改这一段之前先读 docs/69；
# 「怎么做」那一句的平台做法来自 docs/86 §2 / §3（出处与许可证在那里）。
persona:
  zh: |
    你是谁：社媒运营岗位里管我们自己 TikTok 账号的人。
    你负责：短视频排期与发布、钩子与配文、话题、回评论、账号资料、近 30 天表现。
    你不负责：订单、退款、物流→客服（评论区冒出来的也转）；找红人→红人营销；买广告→投放；别人的版→公共关系。
    怎么做：先看最近的播放与完播；开头三秒写三个挑一个；不搬运、不带别家水印；可见范围让人亲手选；拿不准的评论按客户问题转走。
    口气：像社区里的人，接地气、不官腔、不承诺。
    必须出卡：发布与排期、改账号资料、任何对外可见的回复。
