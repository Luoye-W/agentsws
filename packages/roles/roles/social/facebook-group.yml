# 56 §2 社媒运营的第 5 条职责：**Facebook 群组运营**（WP72）。
#
# 这是**社群组五条的骨架样板**（56 §2 下半行）——后面四条（Reddit / Discord /
# Telegram 群组 / WhatsApp）的动作、额度与面板与这一份逐字相同，不同的只有三样：
# 渠道连接器、grounding 的意图词、还有各自那一段"这条渠道特有的部分"。
# 内容组四条的骨架写在 `social/meta.yml` 的文件头里，两组不互相抄。
#
# 社群组与内容组的差别只有一句话：内容组管的是**我们说什么**（发布、排期、回评论），
# 社群组管的是**群里发生什么**（谁进得来、群规、群发、私信、删禁封）。所以：
#
# - 五个写动作：`approve_member`（入群审核 L2）、`stage_broadcast`（群发**永远 L1**）、
#   `reply_thread`（私信 / 回帖 L2 → L3）、`stage_rules_edit`（改群规 L1）、
#   `moderate`（删帖 / 禁言 L2，**封禁 L1**——分档在 guardrail 的 switch 里按
#   `after.action` 判，不在这条职责上，见 `@agentsws/core` 的
#   `COMMUNITY_MODERATION_L1_ACTIONS`）；
# - 三个默认额度（56 §7）：群发 1 / 周、私信 30 / 天、审核动作 20 / 天；
# - 五块面板：待审入群、活跃度、待处理帖子、群发队列、转客服计数。
#
# 这条渠道特有的三件事：
#
# 1. **它没有连接卡**。Facebook Groups API 已经停了（56 §1），所以 `connectors: []`
#    且 `mode: browser`：动作走第三栏的受控浏览器（36 §9 / 55 §3）。
#    界面上这两句话不一样——「去连接」与「这条走浏览器」——所以空的 `connectors`
#    不够用，得有 `mode` 这一格才分得开（见契约 `RoleDefinition.mode` 的注释）。
# 2. **浏览器只是手，不是授权**。走浏览器的写动作**照样先出卡**：群发是 L1、
#    改群规是 L1、封禁是 L1，一条都不因为"反正是人自己的浏览器"就松。
# 3. **执行器待 WP73 接**（56 §6）。在此之前这条职责出的是"脚本描述 + 一张卡"，
#    到点了提醒人自己去点一下——**不假装已经发出去了**
#    （`@agentsws/social-core` 的 `channels/facebook-group.ts`）。
#
# 边界（56 表头，Luoye 09-16 定）：内容、氛围、活动、群规归我；
# **客户的问题不归我，转客服**（`dtc.community-support`）。下面 `description` 与
# `grounding` 的意图词就是 54 §2 岗位路由判这件事的依据——写不足 = 路由不到。
id: social.facebook-group
version: 1.0.0
domain: social
name: { zh: Facebook 群组运营, en: Facebook Group }
description: 我们自己的 Facebook 群组：入群审核、群规、群公告与群发、群里的讨论与私信、删帖禁言。内容、氛围、活动、群规归我；客户的问题不归我，转客服

# 56 §1：Groups API 已停，动作走第三栏受控浏览器。九条职责里只有这一条是 browser。
mode: browser

scopes:
  # 群本身是一条 `social_account`（我们自己开的号 / 群，见契约 `SocialAccount`）
  - { domain: social_account, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # 成员名册。**只有社群组五条读得到它**——内容组四条与客服的社群管理都读不到
  - { domain: community_member, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # 帖子、评论、私信都落在线程上
  - { domain: community_thread, ops: [read, stage], range: assigned, max_sensitivity: internal }
  # 19：群公告里说到产品、价格、时效、政策之前先查事实卡
  - { domain: knowledge, ops: [read], range: workspace, max_sensitivity: internal }
  # 24：品牌话术是**公司层技能**，这条职责只读不编（`social-core` 的 voice.ts）
  - { domain: skill, ops: [read], range: own, max_sensitivity: internal }
  - { domain: product, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: approval, ops: [read, approve], range: own, max_sensitivity: internal }

# 56 §1：**这条渠道没有连接器可连**（不是"这条职责不需要连接器"）。
# 空数组 + `mode: browser` 两格一起读，界面上才说得出那句对的话。
connectors: []

actions:
  # 56 §2 社群组的五个写动作。额度写在**动作**上不写在职责上（同 51 §2.3）。
  - id: approve_member
    target: community_member
    kind: staged_change
    mandate:
      # 一次一个人。挡的是"一口气把 300 个申请全批了"那一下——
      # 批错一个踢出去就是了，批错三百个这个群就不是原来那个群了
      caps: { max_members_per_change: 1 }
      per_change_limits: { max_items: 1 }
    route_to: role_holder
  - id: stage_broadcast
    target: community_member
    kind: staged_change
    mandate:
      # 一周一条（56 §7）。这不是技术上限，是"别让人退群"的那条线
      caps: { max_broadcasts_per_week: 1 }
      per_change_limits: { max_items: 1 }
      window: { max_count: 1, per: week }
    # 群发换收件群 = 发给了另一批人（`@agentsws/core` 的 `PROTECTED_FIELDS`）
    protected_fields: [account_id, external_id]
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: reply_thread
    target: community_thread
    kind: outbound_message
    mandate:
      caps: { max_dm_per_day: 30 }
      window: { max_count: 30, per: day }
    route_to: role_holder
  - id: stage_rules_edit
    target: social_account
    kind: staged_change
    # 15 §2 `RECORD_READ_KINDS`：改群规之前先把那段正文读全。
    # 拿一份摘要覆盖这个群的法律，与拿摘要改商品文案是同一件事
    requires_record_read: true
    mandate:
      caps: {}
      per_change_limits: { max_items: 1 }
      window: { max_count: 2, per: week }
    protected_fields: [account_id, external_id]
    review_cannot_be_disabled: true
    route_to: owner
  - id: moderate
    target: community_thread
    kind: staged_change
    mandate:
      # 一天 20 个动作（56 §7）。超了转人审，不拦——刷屏那天本来就该多删几条
      caps: { max_moderations_per_day: 20 }
      per_change_limits: { max_items: 1 }
      window: { max_count: 20, per: day }
    route_to: role_holder

automation:
  # 入群审核 L2：批错一个人，踢出去就是了
  approve_member:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [guardrail_hit, manual]
  # **群发永远 L1**（56 §2 / §0）。15 §2 的 `HARD_L1` 里有 `community_broadcast`，
  # 这里的 `hard_ceiling` 是把同一件事在职责这一层也写出来——两处都说，
  # 改一处忘另一处的时候有人喊（同 51 §2.3 的 `campaign_send`）。
  stage_broadcast:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  # 私信 / 回帖 L2 → L3（56 §2）：能升是因为它改不了钱——承诺扫描把"改得了钱"
  # 那一半直接拦死（`social-core` 的 `checkOutbound`，用的是全仓那一份词表）。
  reply_thread:
    ceiling: L3
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 50 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]
  # 改群规 L1：群规是这个群的法律，放宽一条等于把垃圾闸门打开
  stage_rules_edit:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]
  # 删帖 / 禁言 L2；**封禁那一档由 guardrail 按 `after.action` 升到 L1**，
  # 不在这里写第二遍——写两份迟早各改各的
  moderate:
    ceiling: L2
    initial: L2
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]

skills:
  - { name: brand-voice, tier: open, load: always }

home_blocks:
  # 56 §2 社群组五块：待审入群 / 活跃度 / 待处理帖子 / 群发队列 / 转客服计数。
  # 顺序就是一天的顺序——面板读下来就是这条职责在干什么。
  - {
      id: social.facebook-group.pending_members,
      placement: queue,
      component: table,
      query: social.pending_members,
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: social.facebook-group.activity,
      placement: role_view,
      component: table,
      query: social.community_activity,
      default_order: 20,
      pinnable: true,
      adaptive: false,
    }
  - {
      id: social.facebook-group.threads,
      placement: queue,
      component: table,
      query: social.pending_threads,
      default_order: 30,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: social.facebook-group.broadcasts,
      placement: focus,
      component: table,
      query: social.broadcast_queue,
      default_order: 40,
      pinnable: true,
      adaptive: true,
    }
  # 转客服计数：这条职责**没有**答客户问题，但它要看得见自己转出去了多少
  - {
      id: social.facebook-group.handoffs,
      placement: role_view,
      component: table,
      query: social.support_handoffs,
      default_order: 50,
      pinnable: true,
      adaptive: false,
    }

grounding:
  # 54 §2：岗位路由在**一个岗位的职责集合内**按职责名 / 描述短语 / 意图词 /
  # 动作 id / 数据域这五样判"这件事该走哪条"。九条社媒职责的动作 id 与数据域
  # 完全一样，所以在社媒运营这个岗位里，**意图词就是唯一分得开它们的东西**。
  - {
      name: facebook_group_intent,
      intent_terms: [Facebook 群组, FB 群, 群组, 小组, 脸书群, group, Facebook group],
      cue_terms: [入群, 申请, 审核, 群规, 公告, 群发, 置顶, 删帖, 禁言, 封, 活跃],
      tool: list_community_threads,
      prefetch: false,
    }
  # 19：群公告里说到产品、价格、时效、政策之前先查事实卡
  - {
      name: facts_before_broadcast,
      intent_terms: [公告, 群发, 广播, 通知, broadcast, announce],
      cue_terms: [价格, 折扣, 包邮, 时效, 保修, 参数, 库存, price, discount, warranty],
      tool: search_policies,
      prefetch: true,
    }
  # 56 的边界：客户的问题不归我。意图词写足，54 的路由才判得到"转客服"
  - {
      name: customer_question_goes_to_support,
      intent_terms: [订单, 发货, 物流, 退款, 退货, 保修, 怎么用, order, refund, shipping, warranty],
      cue_terms: [我的, 什么时候, 还没, 坏了, my, when, not received, broken],
      tool: route_to_community_support,
      prefetch: false,
    }

notifications:
  # 群发永远人审，卡压着不动 = 这条公告错过了它的时间点
  - {
      event: 'approval.created:stage_broadcast',
      mode: immediate,
      recipients: [role_holder, scope_manager],
      escalate_after_hours: 4,
    }
  - {
      event: 'approval.created:approve_member',
      mode: queue,
      recipients: [role_holder],
      escalate_after_hours: 24,
    }
  # 封禁要人点，而且要让人知道是谁被封了
  - {
      event: 'approval.created:moderate',
      mode: queue,
      recipients: [role_holder],
      escalate_after_hours: 8,
    }
  # 承诺扫描拦下来：立刻让人知道——它意味着起草那一跳写了不该写的话
  - {
      event: 'guardrail.hit:commitment_scan',
      mode: immediate,
      recipients: [role_holder, scope_manager],
    }
  # 抑制名单：群发提案里混进了退订过的人
  - { event: 'guardrail.hit:suppression_list', mode: immediate, recipients: [role_holder] }

# WP73（55 §3「域名白名单」）：这条职责的浏览器只能开 Facebook。
#
# 真闸在 `dsh-adapter` 的 `checkBrowserNavigation`（这一份 → `EffectiveConfig.browser_scope`
# → `RunRequest.allowed_hosts`），只看 `browser_navigate` 与 `browser_tabs{new}` 的 URL；
# `@agentsws/social-core` 的 `FACEBOOK_GROUP_HOSTS` 是适配器自己那第二道，两处写的
# 是同一份（对不上的时候 `social-core/test/facebook-group.test.ts` 会喊）。
#
# **不与红人那条 `kol.facebook` 共用**：那条要开 `fb.com` 的短链去看别人的主页，
# 这条只进我们自己的群。白名单是"允许"表，多开一个域就是多开一扇门。
browser_scope:
  - '*.facebook.com'
  - facebook.com

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane, scheduled_tasks]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []

quick_prompts:
  - id: pending_members
    label: { zh: "有谁在等着进群", en: "Who is waiting to join" }
    prompt: "现在有哪些入群申请没处理？按他们填的答案判一下哪些像广告号，分开列"
    kind: ask
  - id: draft_broadcast
    label: { zh: "起草一条群公告", en: "Draft an announcement" }
    prompt: "给这次活动起一条群公告，按品牌话术来，价格和时效只写事实卡里有的；受众和抑制剔除数要写在卡上"
    kind: start_task
  - id: threads_waiting
    label: { zh: "群里有哪些帖子要处理", en: "Threads waiting" }
    prompt: "群里现在有哪些帖子和私信没处理？哪些是客户的问题该转客服、哪些我自己回、哪些按群规删，分开列"
    kind: ask
  - id: group_health
    label: { zh: "这个群还活着吗", en: "How is the group doing" }
    prompt: "近 30 天这个群的发帖数、回帖数、活跃人数怎么样，比上个月是涨是跌"
    kind: ask

task_examples:
  - id: join_requests
    title: { zh: "一批入群申请", en: "A batch of join requests" }
    description: "一夜之间来了四十个入群申请，不知道哪些是真人。"
    expected_output: "一张按「像真人 / 像广告号 / 判不准」分好的表，每条写清判据；批与拒都要你一条条点，不会一口气全批。"
  - id: announcement
    title: { zh: "发一条群公告", en: "Send an announcement" }
    description: "周末有一次限时活动，想在群里说一声。"
    expected_output: "一张群发卡：正文、发给多少人、从名单里剔掉了几个退订过的人，都写在卡面上；要你点一下才发得出去，一周最多一条。"
  - id: spam_wave
    title: { zh: "群里刷起了广告", en: "A wave of spam" }
    description: "有几个号在群里连发外链广告。"
    expected_output: "按群规分好级的一张表：删帖与禁言你点一下就生效，封禁单独出一张卡（把人从群里永久赶出去这件事只能人点）。"

# ── WP120（69 §2）：**角色定位**。提示里的「你是谁」，六段骨架一段不许少 ──────────
# 第三段「你不负责」是防串岗的那一条：69 §0 那条亲测记录（红人岗位回出客服的话）
# 就是因为提示里从头到尾没有这一句。改这一段之前先读 docs/69。
persona:
  zh: |
    你是谁：社媒运营岗位里管我们自己 Facebook 群组 的人。
    你负责：入群审核、群规、群公告与群发、群里的讨论与私信、删帖禁言。
    你不负责：订单、退款、物流→客服（群里冒出来的也转）；找红人→红人营销；买广告→投放；别人的地盘→公共关系。
    怎么做：先看群里在聊什么、群规怎么写的；Groups 没有可用接口，动作都走受控浏览器，做不到的就说做不到；处罚先说清违反了哪一条，别凭印象封人。
    口气：像群里一个靠谱的人，短，不当众晒订单信息。
    必须出卡：群发与公告、改群规、封禁与移出、拿不准的入群审核。
  en: |
    Who you are: the person running our own Facebook 群组, inside the social-media position.
    You handle: membership approvals, group rules, announcements and broadcasts, discussions and DMs inside the group, removing posts and muting.
    Not yours: orders, refunds and shipping → Customer Care, including the ones raised in the group; creators → Creator Marketing; ads → Paid Ads; other people’s turf → Public Relations.
    How you work: read what the group is talking about and what the rules say. There is no usable Groups API, so everything runs through the controlled browser; when something cannot be done, say so. Before any sanction, name the rule that was broken — never ban on impression.
    Tone: like a dependable person in the group — short, never show someone’s order details in public.
    Always ask: broadcasts and announcements, rule changes, bans and removals, and any membership call you are unsure about.
