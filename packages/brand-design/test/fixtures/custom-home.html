<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>云岚茶事</title>

  <style>
    body{margin:0;background:#fdfcf9;color:#23302b;font-family:"Noto Serif SC",serif;font-size:17px;line-height:1.8}
    h1{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:500;line-height:1.2}
    h2{font-size:28px;font-weight:500}
    .masthead{background:#2f5d50;color:#fdfcf9;padding:48px}

  <main>
    <div class="tile">明前龙井</div><div class="tile">白毫银针</div><div class="tile">正山小种</div>

  <footer class="foot">
    <span class="rule"></span><span class="rule"></span><span class="rule"></span>
