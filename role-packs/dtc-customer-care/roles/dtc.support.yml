# 官方职责包 agentsws/dtc-customer-care 里的职责定义。
# 与内置的 packages/roles/roles/dtc/support.yml 同一份，差别只有 skills 的版本下限：
# customer-care 的正文由共享包 @agentsws/support-core 提供（33 §1），装包时按 min_version 解析。
# home_blocks / actions / automation / notifications 一个字都没动——1c 只装能力，不改职责形状。
#
# WP54：本文件原来叫 `dtc.aftersales.yml`；售前 / 售后合并成 `dtc.support`（48 v2 L1）之后
# 跟着内置那份一起改名，旧 id 由加载器的别名表兜住。
id: dtc.support
version: 2.0.0
domain: dtc
name: { zh: 网站客服, en: DTC Website Support }
description: 客服邮箱（和网站表单）里的一切：售前问答与推荐、订单状态与物流、退换货、退款、改地址、漏发错发破损、保修、投诉、拒付争议

scopes:
  - { domain: order, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: shipment, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: customer, ops: [read, stage], range: assigned, max_sensitivity: internal }
  - { domain: knowledge, ops: [read, stage], range: workspace, max_sensitivity: internal }
  - { domain: discount, ops: [stage], range: assigned, max_sensitivity: internal }
  - { domain: approval, ops: [read, stage, approve], range: own, max_sensitivity: internal }
  - { domain: skill, ops: [read], range: own, max_sensitivity: internal }
  # 并自 `dtc.presales`（04 §1.1 数据域：商品读、库存读）——售前要答"有没有货、配不配得上"，
  # 而它跟售后读的是同一批商品，分成两条职责只会让同一个人身上挂两条一模一样的读权限。
  - { domain: product, ops: [read], range: assigned, max_sensitivity: internal }
  - { domain: inventory, ops: [read], range: assigned, max_sensitivity: internal }

connectors:
  - { kind: email, required: true, grants: [mail.read, mail.send], ownership: workspace }
  - {
      kind: shopify,
      required: true,
      grants:
        [
          read_orders,
          write_orders,
          read_fulfillments,
          read_products,
          read_inventory,
          write_discounts,
        ],
      ownership: workspace,
    }
  - { kind: tracking, required: false, grants: [read], ownership: workspace }
  - { kind: payment_dispute, required: false, grants: [disputes.read], ownership: workspace }

actions:
  - id: reply_customer
    target: customer
    kind: outbound_message
    mandate: { caps: {}, window: { max_count: 200, per: day } }
    route_to: role_holder
  - id: stage_refund
    target: order
    kind: staged_change
    requires_record_read: true
    mandate:
      caps: { max_auto_refund_amount: 50, currency: USD, within_policy_window_only: true }
      per_change_limits: { max_items: 1, no_repeat_target_field: true }
      window: { max_count: 20, per: day }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: stage_reship
    target: order
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { max_items_per_order: 1 }, window: { max_count: 10, per: day } }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: stage_address_change
    target: order
    kind: staged_change
    requires_record_read: true
    mandate: { caps: { unfulfilled_only: true } }
    protected_fields: [order.total, order.currency, order.customer_id]
    route_to: role_holder
  # 并自 `dtc.presales`（04 §1.1 写操作）：折扣 ≤ 10%、单码单客单次。
  # 额度写在这个动作上而不是写在职责上——这就是"额度按动作分"那句话的落点。
  - id: stage_discount_code
    target: discount
    kind: staged_change
    mandate:
      caps: { max_presales_discount_pct: 10, single_use_per_customer: true }
      per_change_limits: { max_items: 1 }
      window: { max_count: 20, per: day }
    review_cannot_be_disabled: true
    route_to: scope_manager
  - id: draft_chargeback_evidence
    target: finance
    kind: staged_change
    mandate: { caps: {} }
    route_to: owner

automation:
  reply_customer:
    ceiling: L3
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [customer_complaint, guardrail_hit, manual]
  stage_refund:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 30 }
    demotion_triggers: [guardrail_hit, manual]
  stage_reship:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  stage_address_change:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [manual]
  # 04 §1.1「发折扣码 L2 且必过额度」——上限按动作给，不因为它跟退款同在一条职责上就一起松。
  stage_discount_code:
    ceiling: L2
    initial: L1
    promotion: { adoption_rate_min: 0.95, window_weeks: 4, min_samples: 20 }
    demotion_triggers: [guardrail_hit, manual]
  draft_chargeback_evidence:
    ceiling: L1
    initial: L1
    hard_ceiling: true
    promotion: { adoption_rate_min: 1, window_weeks: 0, min_samples: 0 }
    demotion_triggers: [manual]

grounding:
  - {
      name: order_status,
      intent_terms: [订单, order, 包裹, package],
      cue_terms: [哪, where, 什么时候, when, 到了, arrived],
      tool: get_order,
      prefetch: true,
    }
  - {
      name: policy,
      intent_terms: [退, return, refund, 换, exchange],
      cue_terms: [可以, can, 能, 政策, policy],
      tool: search_policies,
      prefetch: true,
    }

skills:
  - { name: customer-care, min_version: 1.0.0, tier: open, load: always }
  - { name: returns-policy-calc, tier: open, load: on_demand }
  - { name: chargeback-evidence, tier: open, load: on_demand }

home_blocks:
  - {
      id: support.pending_replies,
      placement: queue,
      component: approval_lane,
      query: 'approvals.by_role(dtc.support, reply_customer)',
      default_order: 10,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: support.pending_refunds,
      placement: queue,
      component: staged_change_list,
      query: changes.pending(dtc.support),
      default_order: 20,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: support.overdue_orders,
      placement: focus,
      component: order_table,
      query: orders.overdue(assigned),
      default_order: 30,
      pinnable: true,
      adaptive: true,
    }
  - {
      id: support.escalations,
      placement: alert,
      component: alert_list,
      query: events.escalations(dtc.support),
      default_order: 5,
      pinnable: false,
      adaptive: false,
    }

notifications:
  - { event: customer.complaint, mode: immediate, recipients: [role_holder, scope_manager] }
  - { event: payment.dispute_opened, mode: immediate, recipients: [role_holder, owner] }
  - {
      event: 'approval.created:stage_refund',
      mode: queue,
      recipients: [scope_manager],
      escalate_after_hours: 24,
    }
  - {
      event: 'approval.created:reply_customer',
      mode: queue,
      recipients: [role_holder],
      escalate_after_hours: 8,
    }
  - {
      event: order.overdue,
      mode: digest,
      recipients: [role_holder],
      digest_schedule: '0 9 * * *',
    }

handover:
  transfers: [open_work_items, context, home_blocks, queue_lane]
  fallback: scope_manager
  revoke_context_on_removal: true

requires: []
