# 官方插件的**审过的清单**（WP180）——设置 →「官方插件」只列这里的、也只许装这里的。
#
# 规矩（docs/42 红线 7「官方功能优先」+ WP179 B 类结论「包一层就能开」）：
# - 清单外的一律直接拒（服务进程 + 完整 profile 里的守门插件两处都拒）；
# - 装 / 升级 / 卸载一律出卡（`official_plugin`），卡上写的就是下面每一项的字段；
# - 装完 profile patch（`cordis.patch.yml`）一个字节都不许变；锁定表里的行谁都改不动。
#
# 每一项都逐个核过（出处都是 dsh 0.2.1-alpha.2 安装里自带的那一份，路径 `node_modules/@deepseek-ai/<包>/`）：
# - `license`：包里 `package.json` 的 `license` 字段 + `LICENSE` 文件第一行（都是「MIT License / Copyright (c) 2026 DeepSeek」）；
# - `rows`：包里 `cordis.patch.yml` 的 `insert` 行（`packages/dsh-adapter/test/official-plugins.test.ts` 逐项对照，上游改了就红）；
# - `tools`：包的 README「Model Experience」写的模型面工具；
# - `network`：README 里写到的出网（下载、上报）。
#
# 为什么现在只有 `shipped` 一种来源：上游 `@deepseek-ai/dsh-app-boot` 的 `OPTIONAL_BUNDLES`（0.2.0 起
# 「实验能力改成可选插件包」；0.2.1-alpha.2 是十一个）的包**随 dsh 安装一起发、默认关着**——"装"就是选进来，不下载、不跑 pnpm。
# 以后要加 npm 上的官方包，照同样的字段加一项、`source: npm`、版本写死。
#
# WP293（dsh 0.2.1-alpha.2）重审：
# - **删掉「自动化任务」**（`dsh-experimental-schedule-bundle`）：官方把这个包删了（`dsh-app-boot` 的 `RETIRED_BUNDLES`，
#   加载 profile 时自动从 bundle 列表里摘掉），定时任务改成 Web 组合自己挂、默认就开；我们这边也改成内置、一直开
#   （`apps/server/src/server.ts`），不用再装；
# - 团队协作、语音输入两项：插进来的行、工具、出网逐项复核没变，只改版本号；
# - **新加五项**（官方新的可选包，判 A：只在本机、不把业务数据发给第三方）：查找旧对话、接力循环、常驻终端、
#   标题跟随、代码副本。常驻终端只在官方完整 profile 里有（和官方 `bash` 同一套沙箱）；我们自己的两档运行时不挂它——
#   那边 `bash` 的每条命令要过我们的命令白名单，`terminal_send` 不过这一关，真要接进两档得先让门禁管住它；
# - **没放进来、等 Luoye 定**：`dsh-experimental-cot-translation-bundle`（思考过程机器翻译：默认把推理原文发给
#   edge.microsoft.com，可选 translate.googleapis.com——C 类）、`dsh-experimental-inspector-profile`（调试工具：本机
#   127.0.0.1:9230 开一个没有口令的调试口，能在宿主进程里执行任意代码，抓的网络记录不打码——B 类）、
#   `dsh-experimental-badge-skill-bundle`（「powered by dsh」徽章技能：技术上没问题，但可能把徽章加进给客户的内容里，产品上要定）。
#
# **没放进来的**：`@deepseek-ai/dsh-experimental-auto-review`（自动审阅）——它让模型自己判"放行"就按全权执行，
# 正好绕过出卡 / 授权（WP179 表二判 B）。不在清单上 = 点不了、装不上。

- name: '@deepseek-ai/dsh-experimental-agent-team-profile'
  version: 0.2.1-alpha.2
  source: shipped
  license: MIT
  title: 团队协作
  summary: 让 AI 叫几个队友分工做一件事，共用一张任务表，互相发消息。
  tools:
    [
      spawn_teammate,
      list_agents,
      send_message,
      interrupt_agent,
      wait_agent,
      team_task_create,
      team_task_get,
      team_task_list,
      team_task_update,
    ]
  network: false
  rows: [agent-team, tool-agent-team, ui-agent-team]

