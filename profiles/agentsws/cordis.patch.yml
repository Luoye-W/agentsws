# ——————————————————————————————————————————————————————————————————————
# 生效的第四条（WP177，dsh 0.2.0-rc.1）：共享上报通道、反馈上报、插件清单上报三行关死（C 类）。
# WP177 原来还关了 `web-search-deepseek`，WP179 按"官方功能优先"撤了（见文件头）；下面那段历史说明留着当出处。
#
# 0.2.0-rc.1 往 `dsh-base` 的 patch 里 **insert 了一行新服务**（出处：上游
# `packages/bundle/base/cordis.patch.yml` 的 diff，`dsh-v0.1.7-rc.2...dsh-v0.2.0-rc.1`）：
#
#     - id: otel
#       name: '@deepseek-ai/dsh-otel'
#
# 并把它下面那行 `session-telemetry-otel` 改成经 `otel` 发，收件地址从
# `harness-telemetry.deepseeksvc.com` 换成 `dsh-otel-collector.deepseeksvc.com`。
#
# 为什么关（出处都是上游各包 README 的 Summary / Use this package）：
# - `otel`：「Mount one `otel` service to create ordinary-event and Session-log reporting channels」——
#   它是**上报通道的工厂**。单独挂着不发东西（「Mounting alone … sends nothing」），但它存在的
#   唯一用途就是上报；关掉它，任何要 `inject: ['otel']` 的上报插件都起不来（fail-closed），
#   上游哪天往 base 里再加一个产品埋点（`dsh-host-product-telemetry-otel` 已经在 web-app 里挂着）也白加。
# - `session-telemetry-otel`：**没有 `disabled` 表达式，任何组合默认就挂**，模式默认 `FEEDBACK_ONLY`：
#   用户一点"反馈"，就把**整条会话日志**（「message content, tool arguments and results, the system
#   prompt …」）连同匿名用户 id 发到 DeepSeek 的收集端。与 `session-log-deepseek` 同一类数据、同一个
#   收件方；0.1.7 起它就在 base 里，WP132 看到过但没锁（当时只判了"上报不换"），这一跳它换了通道和地址，补上。
# - `web-search-deepseek`：这一版起「A search initiated by a Session on the DeepSeek account route
#   authenticates with the account token」——用了 DeepSeek 账号的会话**不需要 API Key** 就能经它上网搜索。
#   这是一条新的出网路：绕开我们自己的数据接口路由（docs/75 / docs/81：计费、缓存、审计都在那一层）。
#   它没有单独关"账号令牌"的配置项（`resolveAccountToken` 写死在 `apply` 里），所以整行关；
#   原来那条用 `DEEPSEEK_API_KEY` 搜的路一起关掉——同样是绕开我们路由的出网，我们的两档运行时从没挂过它。
# - `plugin-package-inventory-deepseek`：不是这一跳新来的，是这次把组合里"不带 `disabled`、会上报"的行整体过一遍时
#   查出来的（docs/42 WP177 修订注）。README：「owns the `dsh_plugin_packages` field」——每次走官方 DeepSeek API 的请求
#   都附上当前挂着的**全部插件包清单**（含我们自己的包名与版本）。同 `session-log-deepseek` 一类（随请求上报），一起关。
#
# 同 WP93 / WP132：两档运行时的真实模块图里这四个包都是 0 命中（`harness.ts` 自己搭树，不读 bundle），
# 这四行管的是"哪天真起了完整 profile"那条路。钉住它们的测试：
# `packages/dsh-adapter/test/profile-lockdown.test.ts`（WP177 那四行）。
#
# WP179 重判：这三行加上第一条的 `session-log-deepseek` 都是 **C 类**（把用户业务数据发给第三方的上报），
# 本单**保持关**，逐条"打开会把什么数据发给谁"写在 `packages/dsh-adapter/README.md`，交 Luoye 定。
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
# ——————————————————————————————————————————————————————————————————————

# ——————————————————————————————————————————————————————————————————————
# WP144（docs/80）：电脑操控两行——**插进来、默认关**，选了才叠 `computer-use.on.patch.yml` 打开
# （docs/42 红线 7 的路线 (b)，与 deepseek-account 同一个形状）。
#
# 为什么这一层破例有一处 `insert`：dsh-base 里本来**没有**这两行（官方「no driver activates by
# default」，两个提供方都是 experimental、要显式挂）。不插进来，opt-in 文件就只能自己 insert，
# `--dump-config-schema` 在"没选"的时候看不见这两个 id——那就回到 WP133 要消灭的"看起来关了"。
# 所以插在 profile 层、写死 `disabled: true`：没选时组合树里有这两行、而且确定是关的；
# `profile-lockdown.test.ts` 的 `INSERTED_OFF` 表逐行对照 schema 校验 id 存在、插件没换人。
#
# 只挂 **MCP 提供方**（驱动是独立进程）；native 提供方在我们的进程里跑原生模块，
# 上游原话「原生崩溃可能终止该进程」，不挂、也不进依赖树。驱动路径只认服务进程给的绝对路径
# （数据目录里钉版本 + sha256 下载的那一份，`computer-use.lock.json`），不从 PATH 上找。
# `--direct`：驱动进程自己跑、权限记在启动它的应用上（macOS 的 TCC；别的平台本来就是直接跑）。
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
      disabled: true
    - id: computer-use-cua-driver-mcp
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-mcp'
      disabled: true
      config:
        command: !!js "process.env.AGENTSWS_CUA_DRIVER || 'agentsws-cua-driver-not-installed'"
        args: [mcp, --direct]
# ——————————————————————————————————————————————————————————————————————
