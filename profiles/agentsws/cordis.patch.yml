# agentsws profile 的 patch 层（16 §1）——**这份文件只放锁定**（WP133）。
#
# 组合顺序：dsh-base 的 patch → dsh-headless 的 patch → 这一层 → $DSH_HOME/cordis.patch.yml → `--patch`。
# 下面九行是 docs/42 红线 7 要的"上游默认会开、我们必须关"的锁定，一行都不许是占位；
# 以前混在这里的占位注释（system-prompt / user-approval / preset 声明的写法）挪到了同目录 README。
#
# **WP179（Luoye 09-29「官方功能优先」）逐行重判过一遍**：锁定只留给两种——
# **B 真冲突**（打开会让我们的工具跑不起来，或会绕过出卡 / 授权 / 花钱闸）与
# **C 把用户业务数据发给第三方的上报**（交 Luoye 定，先关着）。
# 别的官方功能一律**不锁、接进来用**（A 类）。这一次撤了两行：
# - `web-search-deepseek`（A）：官方网页搜索，用 DeepSeek 账号免 key 搜（其次用户自己的 key）；
#   我们的两档运行时由 `packages/dsh-adapter/src/web.ts` 挂官方 `dsh-web` + `dsh-tool-web` +
#   `dsh-web-fetch-http` + 这个包的 `DeepSeekSearchProvider`，只在外面包了凭据 / 审计 / 用量 / 次数上限。
# - `hmr`（A，跟官方）：不是冲突、也不外发；官方 headless 包自己就把它关着（一次性任务用不上热替换），
#   我们不再多写一行，组合结果跟官方走。
# 每一行归哪一类、为什么，整张表在 `packages/dsh-adapter/README.md`「逐行重判」一节。
#
# 为什么锁定就写在 profile 这一层、不拆成 bundle 的独立 patch 文件（WP133 实测，
# 出处：`@deepseek-ai/dsh-app-boot` 的 `lib/types/profile.d.ts` 里 `loadProfile` 的说明「Unreadable or
# incompatible bundles are reported on stderr and skipped; profile manifest and user patch errors still throw」）：
# 0.1.7 的 bundle 确实能按顺序挂多个 patch 文件，但 **bundle 层读不出来就跳过、照样启动**——
# 把锁定放进一个坏掉 / 缺失的 bundle，`plugin-manager` 就回到 `!ctx.get('profileContext')`（开）。
# profile 这一层解析失败则直接启动失败。锁定必须 fail-closed，所以留在这一层。
#
# 每一行的 id 都在测试里对照 dsh 自己导出的配置 schema（`dsh --dump-config-schema`）校验：
# id 不在当前 dsh 的组合里、或指向的插件换了人，就是红灯——上游 patch 一个不存在的 id
# 只打一行 warning（`patch: entry "<id>" not found`）然后跳过，也就是"静默什么都没关"。
# 加一行锁定 = 这里加一行 + `packages/dsh-adapter/test/profile-lockdown.test.ts` 的 `LOCKDOWN` 表加一行。

# ——————————————————————————————————————————————————————————————————————
# 生效的一条：把"会话日志随请求上报官方 API"关掉。
#
# dsh 0.1.6-alpha.1 把 `@deepseek-ai/dsh-session-log-deepseek` 的 `enabled`
# 默认值从 false 翻成了 **true**（出处：上游 `packages/session/session-log-deepseek/src/index.ts`
# 的 `Config` —— 0.1.5-rc.1 是 `z.boolean().default(false)`，0.1.6-alpha.1 是
# `z.boolean().default(true)`；README「Configuration」表同步从「Enable it only when…」
# 改成「Disable it only when…」）。这个插件由 dsh-base 的 patch 挂上
# （上游 `packages/bundle/base/cordis.patch.yml` 的 `- id: session-log-deepseek`），
# 打开时会把**整条 canonical Session 事件日志**作为 `dsh_session_log` 字段随每次
# 官方 DeepSeek API 请求增量上传。
#
# 这与 31 §3 / docs/39「数据留本地」直接冲突：会话日志里有客户原文、订单、
# 政策与工具入参。所以这里显式写死 false——不是靠"我们没装这个插件"这种巧合，
# 而是**即使哪天真的起了完整 profile 也不上报**。
# 钉住它的测试：`packages/dsh-adapter/test/telemetry.test.ts`。
# 自检条目：docs/39 §3.3 (d)。
#
# WP81 补一条查证（54（将改号 55）§1 第 0 行 Q1）：这个插件的"请求字段"**只对官方
# `dsh-llm-deepseek` 适配器生效**——它 `inject` 的 `deepseekLlmApiExtensions` 服务只由
# `dsh-deepseek-llm-api-extensions` 提供，而全仓唯一读它的地方是
# `packages/llm/llm-deepseek/src/index.ts` 里 `DeepSeekAdapter` 的 `prepareExtensions`。
# 我们的模型调用走 `packages/dsh-adapter/src/llm.ts` 自己的 `LlmAdapter`，
# **上传通路根本不存在**，所以不做 RunRequest 级的 `share_session_log` 开关
# （做一个没效果的开关比没有开关更糟）。这一行留着是另一道保险：哪天真起了完整
# profile、真接了官方 provider，它也还是关的。详见 `packages/dsh-adapter/AGENT-LAYER.md` §7。
- id: session-log-deepseek
  config:
    enabled: false
# ——————————————————————————————————————————————————————————————————————

# ——————————————————————————————————————————————————————————————————————
# 生效的第二条（WP93，dsh 0.1.6-alpha.2）：把 Plugin Manager 关死（WP179 重判：B 类，真冲突）。
# 原来同一段还关了 `hmr`——WP179 撤掉了（见文件头），下面那段历史说明留着当出处。
#
# alpha.2 往 `dsh-base` 的 patch 里 **insert 了两个新行**（出处：上游
# `packages/bundle/base/cordis.patch.yml` 的 diff）：
#
#     - id: tool-plugin-manager
#       name: '@deepseek-ai/dsh-plugin-manager/tools'
#       disabled: true
#     - id: plugin-manager
#       name: '@deepseek-ai/dsh-plugin-manager'
#       disabled: !!js "!ctx.get('profileContext')"
#
# 同一个 diff 里 `hmr` 从 `@deepseek-ai/cordis-plugin-hmr`（写死 `disabled: true`）
# 换成了 `@deepseek-ai/dsh-hmr`，默认值也翻成 `!ctx.get('profileContext')`。
# `profileContext` 的定义是「Present only in a profile launched by dsh」
# （上游 `packages/boot/app-boot/src/profile-context.ts`）——也就是说
# **`dsh --profile agentsws` 一起，这两个服务就是开的**。
#
# 为什么必须关：
# - `plugin-manager` 是"以宿主用户身份跑 pnpm，装任意包，装完的 Host 代码在沿进程里跑、
#   在工作区沙箱之外"（上游 README：「installed Host code executes in-process outside the
#   workspace sandbox」）。它还能改本 profile 的 `package.json` 与这份 patch 文件本身，
#   并且带一条 `approvedBuilds` 能替用户把 pnpm 挡下来的构建脚本放行——那正是
#   `pnpm-workspace.yaml` 的 `allowBuilds` 在守的那道门（16 §3 最严解释）。
#   与 31 §3.5「v1 的公司端执行器不装任何第三方代码」正面冲突。
# - `hmr` 会监视 profile 目录并**热替换模块**；我们这份 profile 写的是
#   `patchReload: startup`（启动时应用一次），运行中被换掉的组合不在任何基线的口径里。
#
# `tool-plugin-manager`（模型面的那个工具）上游已经写死 `disabled: true`，我们再写一遍：
# 默认值是上游可以单方面翻的，写在案上才算数（docs/42 红线 7）。
#
# 注意这三行**不是**"我们的组合里碰巧没有它"。两档运行时（`harness.ts` 自己搭树）
# 的真实模块图里确实一个都没有——WP93 用 ESM resolve 钩子实测过，
# `@deepseek-ai/dsh-plugin-manager` / `-hmr` 两档都是 0 命中。但红线 7 要的就是
# 不许拿这个当保证：这三行管的是"哪天真起了完整 profile"那条路。
# 钉住它们的测试：`packages/dsh-adapter/test/profile-lockdown.test.ts`。
#
# WP179 重判（B 类）：插件管理是"以宿主用户身份装任意第三方代码、在沙箱外跑、还能改写这份文件"——
# 装一个插件没有任何人批（绕过出卡 / 授权），装进来的插件还能把下面 C 类那几行上报悄悄打开。
# 包一层能开：装插件改成出卡、只从我们审过的清单装、装完不写 profile patch（另立一单，M）。
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
# ——————————————————————————————————————————————————————————————————————

# ——————————————————————————————————————————————————————————————————————
# 生效的第三条（WP132，dsh 0.1.7-rc.1）：配置写回、账号登录这三行关死。
#
# 0.1.7-rc.1 往 `dsh-base` 的 patch 里 **insert 了三行新服务**、换掉了一行（出处：上游
# `packages/bundle/base/cordis.patch.yml` 的 diff，`dsh-v0.1.6-alpha.2...dsh-v0.1.7-rc.1`）：
#
#     - id: config-editor
#       name: '@deepseek-ai/dsh-config-editor'
#       disabled: !!js "!ctx.get('profileContext')"
#     - id: settings
#       name: '@deepseek-ai/dsh-settings'            # 原来是 dsh-settings-file
#       disabled: !!js "!ctx.get('profileContext')"
#     - id: authorization
#       name: '@deepseek-ai/dsh-authorization'
#     - id: deepseek-account
#       name: '@deepseek-ai/dsh-deepseek-account-platform'
#
# 为什么关（出处都是上游各包 README 的 Summary / Use this package）：
# - `config-editor`：「Save plugin configuration in the active profile's patch and apply it
#   immediately」——它**写的就是这份文件**。开着它，运行中的任何一次表单保存都可能把上面
#   `session-log-deepseek` 的 `enabled: false` 或 `plugin-manager` 的 `disabled: true` 改回去；
#   `patchReload: startup` 也被它的"apply immediately"绕开。与 WP93 关 `hmr` 同一个理由。
# - `settings`：「Changes persist through the active profile's Cordis patch」，写回走的就是
#   `config-editor`；另外它启动后会把 `$DSH_HOME/settings.yaml` **导入一次并改名**
#   （`settings.yaml.imported`）——宿主用户目录里的文件被一个我们没要的服务动了。
# - `deepseek-account`：**没有 `disabled` 表达式，任何组合里默认就挂**。它是"用系统浏览器登录
#   DeepSeek 账号"的那一套：在宿主 webServer 上注册 `/oauth/callback`、向 platformOrigin 发
#   `/auth-api/v0/users/current`、`get_user_summary`（余额）、登出时后台重试最多 5 次，
#   还能给推理请求换 `x-dsh-auth-token`。这是默认打开的出网，红线 7 原文就是这一类。
#   我们的模型走自己的网关（`packages/dsh-adapter/src/llm.ts`），账号是 Agents 工坊自己的。
#
# WP134（09-24，Luoye 定做成第三种模型来源「用我的 DeepSeek 账号登录」）：`deepseek-account` 这一行
# **原样不动**——默认仍然关。用户在向导 / 设置里选了账号登录，才由服务进程用同目录的运行时 patch
# `deepseek-account.on.patch.yml`（`--patch`）把它打开；没选就不叠，官方模块不挂、不出网。
# 为什么是"另一份运行时 patch"而不是在这里写 `disabled: !!js "…"`：见那份文件的头注释。
# 钉住"没选关、选了开"：`profile-lockdown.test.ts` 的 WP134 那一组。
#
# `authorization` 不关：它是授权服务本身（`packages/dsh-adapter` 早就直接 import 它），不出网。
#
# 同 WP93：两档运行时的真实模块图里这三个包都是 0 命中（`harness.ts` 自己搭树，不读 bundle），
# 这三行管的是"哪天真起了完整 profile"那条路。钉住它们的测试：
# `packages/dsh-adapter/test/profile-lockdown.test.ts`（WP132 那一组）。
#
# WP179 重判：`config-editor` / `settings` 是 B 类（真冲突）——它们在运行中把表单保存**写回这份文件**并立刻生效，
# 一次保存就能把下面 C 类的上报（`session-log-deepseek` 等）打开，而那几行是要 Luoye 拍板的数据外发；
# 我们的产品也没有官方设置页这个入口。包一层能开：只许写不在锁定表里的行、或改写到 `$DSH_HOME` 那一层（另立一单，S–M）。
# `deepseek-account` 是 A 类、**已经接进来**（WP134：设置里选「用我的 DeepSeek 账号登录」就开，完整 profile 叠
# `deepseek-account.on.patch.yml`）；这一行留着是"没选时关"的那一半。
- id: config-editor
  disabled: true
- id: settings
  disabled: true
- id: deepseek-account
  disabled: true
