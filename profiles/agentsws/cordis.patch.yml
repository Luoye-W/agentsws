# agentsws profile 的 patch 层（16 §1）——**这份文件只放锁定**（WP133）。
#
# 组合顺序：dsh-base 的 patch → dsh-headless 的 patch → 这一层 → $DSH_HOME/cordis.patch.yml → `--patch`。
# 下面七行是 docs/42 红线 7 要的"上游默认会开、我们必须关"的锁定，一行都不许是占位；
# 以前混在这里的占位注释（system-prompt / user-approval / preset 声明的写法）挪到了同目录 README。
#
# 为什么锁定就写在 profile 这一层、不拆成 bundle 的独立 patch 文件（WP133 实测，
# 出处：`@deepseek-ai/dsh-app-boot` README「Unreadable or incompatible bundles are reported on
# stderr and skipped; profile manifest and user patch errors still throw」）：
# 0.1.7 的 bundle 确实能按顺序挂多个 patch 文件，但 **bundle 层读不出来就跳过、照样启动**——
# 把锁定放进一个坏掉 / 缺失的 bundle，`plugin-manager` 就回到 `!ctx.get('profileContext')`（开）。
# profile 这一层解析失败则直接启动失败。锁定必须 fail-closed，所以留在这一层。
#
# 每一行的 id 都在测试里对照 dsh 自己导出的配置 schema（`dsh --dump-config-schema`）校验：
# id 不在当前 dsh 的组合里、或指向的插件换了人，就是红灯——上游 patch 一个不存在的 id
# 只打一行 warning（`patch: entry "<id>" not found`）然后跳过，也就是"静默什么都没关"。
# 加一行锁定 = 这里加一行 + `packages/dsh-adapter/test/profile-lockdown.test.ts` 的 `LOCKDOWN` 表加一行。

# ——————————————————————————————————————————————————————————————————————
# 生效的一条：把"会话日志随请求上报官方 API"关掉。
#
# dsh 0.1.6-alpha.1 把 `@deepseek-ai/dsh-session-log-deepseek` 的 `enabled`
# 默认值从 false 翻成了 **true**（出处：上游 `packages/session/session-log-deepseek/src/index.ts`
# 的 `Config` —— 0.1.5-rc.1 是 `z.boolean().default(false)`，0.1.6-alpha.1 是
# `z.boolean().default(true)`；README「Configuration」表同步从「Enable it only when…」
# 改成「Disable it only when…」）。这个插件由 dsh-base 的 patch 挂上
# （上游 `packages/bundle/base/cordis.patch.yml` 的 `- id: session-log-deepseek`），
# 打开时会把**整条 canonical Session 事件日志**作为 `dsh_session_log` 字段随每次
# 官方 DeepSeek API 请求增量上传。
#
# 这与 31 §3 / docs/39「数据留本地」直接冲突：会话日志里有客户原文、订单、
# 政策与工具入参。所以这里显式写死 false——不是靠"我们没装这个插件"这种巧合，
# 而是**即使哪天真的起了完整 profile 也不上报**。
# 钉住它的测试：`packages/dsh-adapter/test/telemetry.test.ts`。
# 自检条目：docs/39 §3.3 (d)。
#
# WP81 补一条查证（54（将改号 55）§1 第 0 行 Q1）：这个插件的"请求字段"**只对官方
# `dsh-llm-deepseek` 适配器生效**——它 `inject` 的 `deepseekLlmApiExtensions` 服务只由
# `dsh-deepseek-llm-api-extensions` 提供，而全仓唯一读它的地方是
# `packages/llm/llm-deepseek/src/index.ts` 里 `DeepSeekAdapter` 的 `prepareExtensions`。
# 我们的模型调用走 `packages/dsh-adapter/src/llm.ts` 自己的 `LlmAdapter`，
# **上传通路根本不存在**，所以不做 RunRequest 级的 `share_session_log` 开关
# （做一个没效果的开关比没有开关更糟）。这一行留着是另一道保险：哪天真起了完整
# profile、真接了官方 provider，它也还是关的。详见 `packages/dsh-adapter/AGENT-LAYER.md` §7。
- id: session-log-deepseek
  config:
    enabled: false
