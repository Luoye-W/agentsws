packages:
  - packages/*
  - apps/*
  - role-packs/*
allowBuilds:
  esbuild: true
  better-sqlite3: true
  sqlite-vec: true
  # dsh 0.1.3-alpha.2 拖进来的原生构建：适配器不起子进程、不开 PTY，一律不构建（16 §3 最严解释）
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  fs-ext: false
  koffi: false
  node-pty: false
  protobufjs: false
