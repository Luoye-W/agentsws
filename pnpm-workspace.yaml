packages:
  - packages/*
  - apps/*
  - role-packs/*
# WP74：Schedule-X 的插件包（drag-and-drop / resize / calendar-controls）忘了声明
# preact 这一组 peer——`@schedule-x/calendar` 自己声明了，三个插件没有。pnpm 的严格
# 链接照着 package.json 建目录，于是插件在自己的 node_modules 里找不到
# `preact/jsx-runtime`，一 import 就炸。这里替上游补上那三行声明，不改代码、不放宽链接。
packageExtensions:
  '@schedule-x/drag-and-drop':
    peerDependencies:
      preact: '^10.19.2'
      '@preact/signals': '^2.0.2'
  '@schedule-x/resize':
    peerDependencies:
      preact: '^10.19.2'
      '@preact/signals': '^2.0.2'
  '@schedule-x/calendar-controls':
    peerDependencies:
      preact: '^10.19.2'
      '@preact/signals': '^2.0.2'
# WP92（55 §10）：腾讯 BrowserSkill 的 dsh 插件把 peer 写成 `^0.1.0-rc.6`，而我们整棵树
# 是 `0.1.6-alpha.2`——semver 的预发布规则下这两个**不相交**（预发布版只满足同一组
# major.minor.patch 上带预发布的比较符）。不管的话 pnpm 会去 registry 另找一份 dsh
# 装进插件自己的 node_modules，那等于同一棵组合里出现两份 `dsh-tools`，服务与 hook
# 全都对不上。所以把这三个 peer 的范围**钉到树里已经有的那一版**（作用域只到这个包，
# `包>peer` 的选择器写法），让它链现成的那一份。剩下三个 `dsh-client-ui-*` 与 react 是
# optional peer：插件那层 React 悬浮层是给 dsh 自己的 web 客户端用的，headless 组合里
# 一个都不加载，所以一个都不装。
# WP93（0.1.6-alpha.2）追加：`dsh-client-ui-primitives` 这一条以前不需要，因为那三个
# `dsh-client-ui-*` optional peer 对应的包**根本不在树里**，pnpm 没有可链的东西就跳过。
# alpha.2 把 `dsh-experimental-agent-team-web-profile` 加进了 `@deepseek-ai/dsh` 的依赖，
# 它 → `dsh-experimental-client-ui-agent-team` → `dsh-client-ui-primitives`，于是这个包
# 第一次进树，pnpm 开始给插件解析这条 optional peer，又撞上同一个"预发布不相交"的坑
# （`^0.1.0-rc.6` 与 `0.1.6-alpha.2` 无交集 → 去 registry 另找一份）。处理同上：钉到
# 树里已经有的那一版。另两个（`dsh-client-ui-attachment` / `dsh-client-ui-tool`）仍然
# 不在树里，所以仍然不写——等它们哪天也被拖进来再说。
overrides:
  '@wxg-prc-cpg/browser-skill-dsh-plugin>@deepseek-ai/dsh-attachment': '0.1.7-rc.2'
  '@wxg-prc-cpg/browser-skill-dsh-plugin>@deepseek-ai/dsh-tools': '0.1.7-rc.2'
  '@wxg-prc-cpg/browser-skill-dsh-plugin>@deepseek-ai/dsh-llm': '0.1.7-rc.2'
  '@wxg-prc-cpg/browser-skill-dsh-plugin>@deepseek-ai/dsh-client-ui-primitives': '0.1.7-rc.2'

# WP93（0.1.6-alpha.2）：`@deepseek-ai/dsh` 新拖进来的 `dsh-office-to-pdf`（侧边栏预览
# Word / Excel / PPT 的那条新功能）依赖 `@deepseek-ai/libreoffice-kit`，后者用
# optionalDependencies 挂着**五个平台包**，里面是整套 LibreOffice 程序（本机那一个
# darwin-arm64 就 259 MB）。它没有 install / postinstall，所以 `allowBuilds` 管不着它——
# 那一栏只挡"构建"，挡不住"下载 + 解包"。按 16 §3 最严解释与派工书"一律不构建、不装"：
# 用 `ignoredOptionalDependencies` 让 pnpm 连装都不装。
# 安全性：整条 office 预览是官方 web 客户端（`dsh-web-app`）的事，我们的 headless 组合
# 一个 `dsh-client-*` 都不挂（docs/34「唯一 import dsh 处」），少了这五个包照样起。
# 纯 JS 的 `@deepseek-ai/libreoffice-kit` 本体（168 KB）留着：它是 office-to-pdf 的硬依赖，
# 删了会让依赖图缺边；没有平台包时它只是转换不了，不影响加载。
#
# WP132（0.1.7-rc.1）：同一类第二次发作。`@deepseek-ai/dsh` 新拖进来的
# `dsh-experimental-voice-input-bundle` → `dsh-experimental-speech-to-text-sensevoice`
# （官方 web 客户端的「实验性语音转写」）硬依赖 `sherpa-onnx-node`（Apache-2.0，纯 JS 壳 104 KB），
# 后者用 optionalDependencies 挂着**六个平台包**，里面是 onnxruntime 与 sherpa-onnx 的
# 原生 `.node` / `.dylib`（本机 darwin-arm64 实测 33 MB）；同样没有 install 脚本，
# `allowBuilds` 管不着。我们的 headless 组合不挂任何语音 / `dsh-client-*` 插件
# （两档模块图实测零命中，见 packages/dsh-adapter/UPGRADE.md WP132 一节），所以平台包一律不装；
# `sherpa-onnx-node` 本体留着（硬依赖，删了依赖图缺边；没有平台包它只是加载时找不到原生库）。
# 写三条前缀而不是 `sherpa-onnx-*`：后者字面上也盖住 `sherpa-onnx-node` 本体，读的人会误会。
ignoredOptionalDependencies:
  - '@deepseek-ai/libreoffice-kit-*'
  - 'sherpa-onnx-darwin-*'
  - 'sherpa-onnx-linux-*'
  - 'sherpa-onnx-win-*'

allowBuilds:
  esbuild: true
  # Electron 的 postinstall 下载平台二进制；桌面壳（WP16）必须允许
  electron: true
  better-sqlite3: true
  sqlite-vec: true
  # dsh 0.1.6-alpha.2 拖进来的原生构建：适配器不起 dsh 自己的子进程、不开 PTY，一律不构建（16 §3 最严解释）
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false
  # WP41 升级新出现：dsh 的原生 addon 从"源码 + node-gyp"改成**预编译平台包**
  # （`@deepseek-ai/node-addon-system-<platform>` 是 optionalDependencies，装的是二进制）。
  # 它没有 install / postinstall，本来就不会触发构建；写死 false 是把纪律记在案上：
  # 上游哪天给它加回构建脚本，也不会因为默认值而悄悄跑起来。
  # WP89 复核：沙箱那条线（`dsh-sandbox-local`）把它列成 dependency，但 Linux 的
  # Landlock launcher 才用得上；macOS 走 Seatbelt（一个 `sandbox-exec` 命令，不碰 addon）。
  # 它仍然是预编译平台包（`@deepseek-ai/node-addon-system-<platform>` 走
  # optionalDependencies），没有 install / postinstall，`pnpm install --frozen-lockfile`
  # 一次构建都不跑——实测过。这一行保持 false。
  '@deepseek-ai/node-addon-system': false
  # WP70 补列：`node-addon-require-builtin` 家族（`cordis-plugin-loader` 的依赖，
  # 给插件加载器做 require-builtin 的 Node-API addon；0.1.5 → 0.1.6 跟着 dsh 一起动）。
  # 它在 0.1.5-rc.1 的树里就有，WP41 漏列了；同 node-addon-system 一样是**预编译平台包**
  # （`node-addon-require-builtin-<platform>` 走 optionalDependencies），没有 install /
  # postinstall，本来就不触发构建。写死 false 是补上那条纪律，不是行为变化。
  node-addon-require-builtin: false
  node-addon-native-custom-loader: false
  # 0.1.3-alpha.2 有、0.1.5-rc.1 没有了的两项，随包一起删：
  # - fs-ext（原生文件建议锁）：`dsh-session-persistence-jsonl` 不再 require 它 —— 这一条改变了
  #   WP30 对官方 sdk 档的判断，见 packages/dsh-adapter/UPGRADE.md §5
  # - @deepseek-ai/node-addon-landlock-run：Linux 沙箱 addon，被 node-addon-system 取代
  # squirrel.windows 打包器（electron-builder 的可选依赖）；Windows 我们出 NSIS，不需要它
  electron-winstaller: false
  # WP82：官方浏览器 provider（`dsh-experimental-browser-use-playwright-mcp`）拖
  # `@playwright/mcp` → `playwright` → `playwright-core`。playwright 的 postinstall
  # 会下载几百 MB 的浏览器二进制（16 §3 最严解释：不给原生 / 下载型依赖开构建）。
  # 我们两条路都不需要它下载：
  # - `attach`：接用户自己电脑上已经开着的 Chrome（`--cdp-endpoint`），根本不起浏览器；
  # - `launch`：一律带 `--executable-path` 指本机已装的 Chrome / Chromium。
  # 所以这两个写死 false —— 下载脚本没跑过，provider 照样能起（它只要 `cli.js` 那段 JS）。
  playwright: false
  playwright-core: false
  # workerd 是 Cloudflare 的运行时二进制（`wrangler dev` 与 vitest-pool-workers 才用它）。
  # CI 与本仓库只跑 `wrangler deploy --dry-run`（那一步只是 esbuild 打包 + 校验配置），
  # 用不到这个几十 MB 的下载，所以写死 false。真要在本机 `wrangler dev` 的人自己 approve 一次。
  workerd: false
minimumReleaseAgeExclude:
  - '@oomol-lab/connector@1.2.0'
  - electron@44.3.0
  # dsh 0.1.6-alpha.2（WP93 升级）。上游预发布节奏比 minimumReleaseAge 的静默期快，
  # 不排除就解析不到这一版；pnpm 把整棵 dsh 传递依赖树都写进来（一包一条、写死版本）——
  # 排除的是"这一个版本"，不是这个包：下一版出来还得再决定一次，不会自动放行。
  # 0.1.6-alpha.1 那批 240 条**整批替换**成 alpha.2 的 253 条（不是叠加：pnpm 默认会写成
  # `<包>@0.1.6-alpha.1 || 0.1.6-alpha.2`，等于把旧版一起继续放行，全部改回单版本写法）。
  # 多出来的 13 条全部是 alpha.2 新进树的包，一条都不是我们主动加的：
  #   dsh-plugin-manager / dsh-hmr（`@deepseek-ai/dsh` 的新直接依赖，顶掉了
  #   `@deepseek-ai/cordis-plugin-hmr`——那一个是唯一消失的包，它不带 dsh 前缀，
  #   本来就不在这张表里）；
  #   dsh-experimental-agent-team{,-profile,-web-profile} / dsh-experimental-tool-agent-team /
  #   dsh-experimental-client-ui-agent-team / dsh-client-ui-slots（Team 模式那一摞）；
  #   dsh-workspace-changes / dsh-office-to-pdf / dsh-lazy-require /
  #   dsh-client-ui-plugin-manager / dsh-client-ui-sidebar-browser（回合末文件改动卡、
  #   Office 预览、侧边栏浏览器——都是官方 web 客户端那条线，我们不挂）。
  # 两个容易记错的：`dsh-tool-present` 在上游从 `packages/fs/` 挪到了 `packages/deliverables/`，
  # **npm 包名没变**，所以这张表里既不新增也不删除；`dsh-skill-office` 是上游新包，但
  # 没进我们的树（没人依赖它），所以不在这里。详见 packages/dsh-adapter/UPGRADE.md 第三节 §2。
  # 上一跳（WP70，0.1.5-rc.1 → 0.1.6-alpha.1）删掉的是 dsh-code-runtime /
  # dsh-code-runtime-worker-thread / dsh-workflow-worker-thread 三个。
  - '@deepseek-ai/dsh@0.1.7-rc.2'
  - '@deepseek-ai/dsh-acp@0.1.7-rc.2'
  - '@deepseek-ai/dsh-acp-app@0.1.7-rc.2'
  - '@deepseek-ai/dsh-agent@0.1.7-rc.2'
  - '@deepseek-ai/dsh-agent-default-model@0.1.7-rc.2'
  - '@deepseek-ai/dsh-agent-instructions@0.1.7-rc.2'
  - '@deepseek-ai/dsh-agent-loop@0.1.7-rc.2'
  - '@deepseek-ai/dsh-agent-preset@0.1.7-rc.2'
  - '@deepseek-ai/dsh-agent-preset-registry@0.1.7-rc.2'
  # WP86：从"传递依赖"升为 `dsh-adapter` 的**直接依赖**（55 §4 第三层：职责 preset
  # 承载连接）。它的 `inject` 是 `['loader','sessionProjections']`，所以一起升上来的
  # 还有 `@deepseek-ai/cordis-plugin-loader@1.0.3` 与 `-include@1.0.7`——那两个是
  # cordis 侧的包（不跟 dsh 的版本走），本来就在树里，不需要排除静默期。
  - '@deepseek-ai/dsh-agent-tool-presentation@0.1.7-rc.2'
  - '@deepseek-ai/dsh-anonymous-user-id@0.1.7-rc.2'
