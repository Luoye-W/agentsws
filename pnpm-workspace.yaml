packages:
  - packages/*
  - apps/*
  - role-packs/*
# WP74：Schedule-X 的插件包（drag-and-drop / resize / calendar-controls）忘了声明
# preact 这一组 peer——`@schedule-x/calendar` 自己声明了，三个插件没有。pnpm 的严格
# 链接照着 package.json 建目录，于是插件在自己的 node_modules 里找不到
# `preact/jsx-runtime`，一 import 就炸。这里替上游补上那三行声明，不改代码、不放宽链接。
packageExtensions:
  '@schedule-x/drag-and-drop':
    peerDependencies:
      preact: '^10.19.2'
      '@preact/signals': '^2.0.2'
  '@schedule-x/resize':
    peerDependencies:
      preact: '^10.19.2'
      '@preact/signals': '^2.0.2'
  '@schedule-x/calendar-controls':
    peerDependencies:
      preact: '^10.19.2'
      '@preact/signals': '^2.0.2'
# WP92（55 §10）：腾讯 BrowserSkill 的 dsh 插件把 peer 写成 `^0.1.0-rc.6`，而我们整棵树
# 是 `0.1.6-alpha.1`——semver 的预发布规则下这两个**不相交**（预发布版只满足同一组
# major.minor.patch 上带预发布的比较符）。不管的话 pnpm 会去 registry 另找一份 dsh
# 装进插件自己的 node_modules，那等于同一棵组合里出现两份 `dsh-tools`，服务与 hook
# 全都对不上。所以把这三个 peer 的范围**钉到树里已经有的那一版**（作用域只到这个包，
# `包>peer` 的选择器写法），让它链现成的那一份。剩下三个 `dsh-client-ui-*` 与 react 是
# optional peer：插件那层 React 悬浮层是给 dsh 自己的 web 客户端用的，headless 组合里
# 一个都不加载，所以一个都不装。
overrides:
  '@wxg-prc-cpg/browser-skill-dsh-plugin>@deepseek-ai/dsh-attachment': '0.1.6-alpha.1'
  '@wxg-prc-cpg/browser-skill-dsh-plugin>@deepseek-ai/dsh-tools': '0.1.6-alpha.1'
  '@wxg-prc-cpg/browser-skill-dsh-plugin>@deepseek-ai/dsh-llm': '0.1.6-alpha.1'

allowBuilds:
  esbuild: true
  # Electron 的 postinstall 下载平台二进制；桌面壳（WP16）必须允许
  electron: true
  better-sqlite3: true
  sqlite-vec: true
  # dsh 0.1.6-alpha.1 拖进来的原生构建：适配器不起 dsh 自己的子进程、不开 PTY，一律不构建（16 §3 最严解释）
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false
  # WP41 升级新出现：dsh 的原生 addon 从"源码 + node-gyp"改成**预编译平台包**
  # （`@deepseek-ai/node-addon-system-<platform>` 是 optionalDependencies，装的是二进制）。
  # 它没有 install / postinstall，本来就不会触发构建；写死 false 是把纪律记在案上：
  # 上游哪天给它加回构建脚本，也不会因为默认值而悄悄跑起来。
  # WP89 复核：沙箱那条线（`dsh-sandbox-local`）把它列成 dependency，但 Linux 的
  # Landlock launcher 才用得上；macOS 走 Seatbelt（一个 `sandbox-exec` 命令，不碰 addon）。
  # 它仍然是预编译平台包（`@deepseek-ai/node-addon-system-<platform>` 走
  # optionalDependencies），没有 install / postinstall，`pnpm install --frozen-lockfile`
  # 一次构建都不跑——实测过。这一行保持 false。
  '@deepseek-ai/node-addon-system': false
  # WP70 补列：`node-addon-require-builtin` 家族（`cordis-plugin-loader` 的依赖，
  # 给插件加载器做 require-builtin 的 Node-API addon；0.1.5 → 0.1.6 跟着 dsh 一起动）。
  # 它在 0.1.5-rc.1 的树里就有，WP41 漏列了；同 node-addon-system 一样是**预编译平台包**
  # （`node-addon-require-builtin-<platform>` 走 optionalDependencies），没有 install /
  # postinstall，本来就不触发构建。写死 false 是补上那条纪律，不是行为变化。
  node-addon-require-builtin: false
  node-addon-native-custom-loader: false
  # 0.1.3-alpha.2 有、0.1.5-rc.1 没有了的两项，随包一起删：
  # - fs-ext（原生文件建议锁）：`dsh-session-persistence-jsonl` 不再 require 它 —— 这一条改变了
  #   WP30 对官方 sdk 档的判断，见 packages/dsh-adapter/UPGRADE.md §5
  # - @deepseek-ai/node-addon-landlock-run：Linux 沙箱 addon，被 node-addon-system 取代
  # squirrel.windows 打包器（electron-builder 的可选依赖）；Windows 我们出 NSIS，不需要它
  electron-winstaller: false
  # WP82：官方浏览器 provider（`dsh-experimental-browser-use-playwright-mcp`）拖
  # `@playwright/mcp` → `playwright` → `playwright-core`。playwright 的 postinstall
  # 会下载几百 MB 的浏览器二进制（16 §3 最严解释：不给原生 / 下载型依赖开构建）。
  # 我们两条路都不需要它下载：
  # - `attach`：接用户自己电脑上已经开着的 Chrome（`--cdp-endpoint`），根本不起浏览器；
  # - `launch`：一律带 `--executable-path` 指本机已装的 Chrome / Chromium。
  # 所以这两个写死 false —— 下载脚本没跑过，provider 照样能起（它只要 `cli.js` 那段 JS）。
  playwright: false
  playwright-core: false
