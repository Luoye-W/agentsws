<div class="page">
  <div class="ph">
    <span class="pic"><svg class="gl"><use href="#g-pr"/></svg></span>
    <div>
      <h1>Reddit 运营</h1>
      <p class="stat"><span>刚建好，还没开工</span><span class="mid">·</span><span>2 条职责</span></p>
    </div>
    <div class="r"><a class="btn sm out" href="position-v2-settings.html"><svg class="ico s14"><use href="#i-more"/></svg>岗位设置</a></div>
  </div>
  <!-- 只有真缺必需的连接才出这一行；取数已由 Agents 工坊接口满足，所以不催 -->
  <div class="banner"><svg class="ico s14"><use href="#i-unlink"/></svg><span>回帖要用品牌自己的 Reddit 号，还没登记</span><button class="btn xs" type="button">去登记</button></div>
  <div class="ptabs"><div class="tabs"><a class="on">工作</a><a>记录</a><a href="position-v2-settings.html">设置</a></div></div>

  <div style="display:flex;flex-direction:column;gap:26px">
    <!-- 空的时候，交给它就是整页的主角 -->
    <div class="card first">
      <h2><svg class="ico s18" style="color:var(--ws-brand)"><use href="#i-send"/></svg>交给它第一件事</h2>
      <div class="box">
        <textarea id="firstText" placeholder="一句话说清要办什么，比如「这周 Reddit 上怎么说我们」"></textarea>
        <button class="btn pri" type="button"><svg class="ico s14"><use href="#i-send"/></svg>交给它</button>
      </div>
      <div class="sugs">
        <button class="sug" type="button">这周 Reddit 上怎么说我们</button>
        <button class="sug" type="button">哪些版适合我们</button>
        <button class="sug" type="button">r/SmartGlasses 的版规是什么</button>
        <button class="sug" type="button">起草一条 r/INMO 置顶公告</button>
      </div>
      <p class="tip">它自己挑职责去做，要你拍板的会回来找你<span class="hint" tabindex="0" data-hint="取数按价目扣积分，一次最多 3 积分；回帖、发帖每条都要你批。">?</span></p>
    </div>

    <section>
      <div class="sec-h"><h3>要你处理</h3></div>
      <div class="none-line"><svg class="ico s14"><use href="#i-check"/></svg>没有要你处理的</div>
    </section>

    <section>
      <div class="sec-h"><h3>工作</h3></div>
      <div class="vbar off">
        <div class="tabs"><a class="on"><svg class="ico s14"><use href="#i-list"/></svg>列表</a><a><svg class="ico s14"><use href="#i-board"/></svg>看板</a><a><svg class="ico s14"><use href="#i-cal"/></svg>日历</a><a><svg class="ico s14"><use href="#i-table"/></svg>表格</a></div>
        <div class="r"><button class="btn sm ghost" type="button"><svg class="ico s14"><use href="#i-filter"/></svg>筛选</button><button class="btn sm ghost" type="button"><svg class="ico s14"><use href="#i-group"/></svg>按状态</button></div>
      </div>
      <div class="card emptyv">
        <div class="ghost-rows"><i style="width:92%"></i><i style="width:70%"></i><i style="width:82%"></i></div>
        交给它的事、你的待办、排期，都会出现在这里
        <button class="btn sm out" type="button"><svg class="ico s14"><use href="#i-plus"/></svg>加一个待办</button>
      </div>
    </section>

    <section>
      <div class="sec-h"><h3>数字</h3></div>
      <div class="none-line"><svg class="ico s14"><use href="#i-chart"/></svg>Reddit 取数已通，开工后这里出数</div>
    </section>
  </div>
</div>
