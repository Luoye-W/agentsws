# WP276（docs/95 §4.3，决策 241 / 242）：**② 同事互联——交给对方，对方接下之后用接手人的规矩。**
#
# 何佳与林峰两个平级（`org_mode: peers`）。何佳手上一件「Volthaus 的报价跟进」（用她的 B2B 业务那条做），
# 这周出差，交给林峰：
# 1. 交出去那一刻主人还是何佳（对方没接下之前不形成责任）；
# 2. 林峰点「接下」——主人换成林峰，这件事之后起的运行用**林峰自己那条** B2B 业务分配
#    （职责规矩、模型设置、用量都是他的），何佳留作参与者；
# 3. 没人批谁：交接不经任何审批、不升级。
id: b2b/modes/peers-handoff-accepted
version: 1
dataset: { pack: b2b-3c-3p, seed: 42 }
org_mode: peers
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-10-08T10:00:00+08:00' }
events:
  - at: '+0m'
    work.matter: { who: p_he, title: Volthaus 的报价跟进, role: b2b.sales }
  - at: '+5m'
    work.handoff: { who: p_he, to: p_lin, title: Volthaus 的报价跟进, note: 我这周出差，你熟这个客户 }
  - at: '+30m'
    work.handoff_decide: { who: p_lin, title: Volthaus 的报价跟进, action: accept }
  - at: '+1h'
    clock.advance: {}
expected:
  work_handoffs:
    - title: Volthaus 的报价跟进
      state: accepted
      owner: p_lin
      runs_as: p_lin
      role: b2b.sales
  event_types: [handoff.offered, handoff.accepted]
  metrics:
    escalations: 0
    runs_failed: 0
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
rubric: >-
  交出去之后是不是对方点了接下才换主人？接下之后这件事的运行是不是用接手人自己那条职责？
