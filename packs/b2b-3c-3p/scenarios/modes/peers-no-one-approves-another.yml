# WP275（docs/95 §5，决策 222）：**两个平级（② 同事互联）——谁也不批谁，各自确认自己的。**
#
# 把这家店当成何佳与林峰两个平级的人在用（`org_mode: peers`）。两人各提一张超了上限的报价：
# 1. 何佳那张落回何佳、林峰那张落回林峰——公司模式里何佳的会转给林峰（他是销售经理）、
#    林峰的会转给老板，这里一张都不转；卡上没有「转给了…」，超了上限只要本人再确认一次；
# 2. 各自点通过（`actor.decide` 用的是**本人**手上的那张卡；要是卡落到别人手里，这一步就会报
#    「手上没有这张卡」）；
# 3. 不升级（`approval.escalated` 一条都没有）。
id: b2b/modes/peers-no-one-approves-another
version: 1
dataset: { pack: b2b-3c-3p, seed: 42 }
org_mode: peers
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-29T11:00:00+08:00' }
events:
  - at: '+0m'
    b2b.quote:
      who: p_he
      quote_id: quo_peer_he
      lines:
        - { sku: GaN65, description: GaN 65W charger UKCA, qty: 3000, unit_price_usd: 6.2 }
      margin_pct: 18.5
      discount_pct: 1
      payment_terms_days: 30
      incoterm: FOB
      incoterm_place: Shenzhen
  - at: '+5m'
    actor.decide: { who: p_he, item: $last_staged_change, action: approve }
  - at: '+10m'
    b2b.quote:
      who: p_lin
      quote_id: quo_peer_lin
      lines:
        - { sku: PB20K, description: 20000mAh power bank, qty: 2000, unit_price_usd: 9.5 }
      margin_pct: 17
      discount_pct: 0
      payment_terms_days: 45
      incoterm: FOB
      incoterm_place: Shenzhen
  - at: '+15m'
    actor.decide: { who: p_lin, item: $last_staged_change, action: approve }
  - at: '+1h'
    clock.advance: {}
expected:
  b2b:
    - kind: b2b_quote
      blocked: false
      approver: role_holder
      routed_to: p_he
      auto_approved: false
      stated_on_card: true
      reconfirm: true
      forwarded: false
    - kind: b2b_quote
      blocked: false
      approver: role_holder
      routed_to: p_lin
      auto_approved: false
      stated_on_card: true
      reconfirm: true
      forwarded: false
  staged_change_kinds: [b2b_quote]
  metrics:
    escalations: 0
    runs_failed: 0
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
rubric: >-
  两个平级的人各提一张超限报价，是不是各自落回自己、谁也没转给谁？卡上有没有「转给了」？
