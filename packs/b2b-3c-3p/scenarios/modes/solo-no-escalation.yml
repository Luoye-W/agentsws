# WP275（docs/95 §5，决策 222）：**一个人用（① 个人）——没有升级、没有转给老板，超限只再确认一次。**
#
# 把这家店当成何佳一个人在用（`org_mode: solo`）。同一张超了金额、毛利的报价，在公司模式里会转销售经理
# （见 `sales/quote-over-mandate-new-version.yml`）；一个人用时：
# 1. 卡落回何佳自己（`role_holder`），卡上一句「超了你设的上限（金额、毛利），要你再确认一次」，
#    不写「转给了…」；
# 2. 谁也不去点它：时钟走过两级升级时限（压到 4 / 8 工作小时，同 `ops/escalation-chain.yml`），
#    **一次都不升级**，只到点提醒本人（`approval.reminded`）；
# 3. 报价照旧 L1、永远出卡（硬闸关不掉）。
id: b2b/modes/solo-no-escalation
version: 1
dataset: { pack: b2b-3c-3p, seed: 42 }
org_mode: solo
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-29T09:00:00+08:00' }
policy:
  escalation_hours: { scope_manager: 4, owner: 8 }
events:
  - at: '+0m'
    b2b.quote:
      who: p_he
      quote_id: quo_solo_gan
      lines:
        - { sku: GaN65, description: GaN 65W charger UKCA, qty: 3000, unit_price_usd: 6.2 }
      margin_pct: 18.5
      discount_pct: 1
      payment_terms_days: 30
      incoterm: FOB
      incoterm_place: Shenzhen
  # 工作时间内往前走一整天：过了 4 与 8 工作小时两级
  - at: '+270m'
    clock.advance: {}
  - at: '+510m'
    clock.advance: {}
expected:
  b2b:
    - kind: b2b_quote
      blocked: false
      rules: [quote_amount_over_mandate, quote_margin_under_mandate]
      approver: role_holder
      routed_to: p_he
      auto_approved: false
      stated_on_card: true
      reconfirm: true
      forwarded: false
  staged_change_kinds: [b2b_quote]
  event_types:
    - approval.reminded
  metrics:
    escalations: 0
    applied_changes: 0
    runs_failed: 0
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
rubric: >-
  一个人用时，超了上限的报价卡上写的是「再确认一次」而不是「转给了老板」吗？一天没人点，有没有升级给别人？
