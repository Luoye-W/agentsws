# WP386（docs/103 v2）：信息监控拉一条 Google Alerts 的 RSS——数据链通了。
#
# 不联网：feed 里的条目由场景给，世界里拼成一条真 Atom feed（标题「Google Alert - Hexa Fittings」、链接包在
# google.com/url 跳转里），交给 `pr-core`（feedsmith）解析。断言三件事：
#
# 1. 条目都拉到了，feed 标题里盯的词拆出来当名字；
# 2. 跳转链接解开了（人点过去是那篇文章，不是 Google 的跳转页）；
# 3. 同一篇被两个站转载的标题不合并（按 URL 各算一条），同一个 URL 出现两次合并成一条。
id: pr/monitor-feed-pulled
version: 1
dataset: { pack: b2b-3c-3p, seed: 42 }
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-29T09:00:00+08:00' }
events:
  - at: '+0m'
    pr.feed:
      kind: google_alerts
      status: 200
      label: Hexa Fittings
      entries:
        - title: Hexa Fittings recalls a batch of units over overheating
          url: https://news.example/hexa-fittings-recall
          text: The company says a small batch may overheat.
        - title: Hexa Fittings vs Parker, a field test
          url: https://review.example/field-test
          text: We compared both in the field.
        - title: Hexa Fittings vs Parker, a field test
          url: https://review.example/field-test?utm_source=alerts
          text: Same article, tracking parameters added.
expected:
  pr_feed:
    ok: true
    fetched: 3
    kept: 3
    unique: 2
    label: Hexa Fittings
    links_unwrapped: true
  event_types:
    - simulation.pr_feed_pulled
  metrics:
    outbound_sent: 0
    runs_failed: 0
invariants:
  - no_write_without_stage
rubric: >-
  拉回来的每一条，人点过去是不是那篇文章本身？同一篇转来转去，是不是只算了一条？
