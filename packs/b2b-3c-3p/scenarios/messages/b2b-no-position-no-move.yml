# WP172（docs/84 §5 第 4 条，同 WP161 / WP163 的老规矩）：**没开 B2B 岗位，询盘不挪、不开事项**。
#
# 这个工作区没人持 B2B 职责了（世界里发生的一件事）。同一封询盘：分拣器不产出 `b2b`，
# 信留在收件箱，不开事项、不起 Run、不建 BtoBAgents 文件夹。
id: messages/b2b-no-position-no-move
version: 1
dataset: { pack: b2b-3c-3p, seed: 42 }
actors: {}
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-29T12:00:00+08:00' }
events:
  - at: '+0m'
    messages.disable_position: { position: b2b }
  - at: '+5m'
    messages.inbound:
      from: purchasing@northline.example
      subject: Quotation request - 20000mAh power bank
      body: Hello, we are a distributor in Canada. Please send your price list, MOQ and catalog for the 20000mAh power bank, FOB Shenzhen.
expected:
  message_triage:
    route: inbox
    moved: false
    intake: none
    opened_matter: false
    started_run: false
  event_types:
    - simulation.message_position_disabled
    - simulation.message_triaged
  metrics:
    runs_failed: 0
invariants:
  - no_write_without_stage
rubric: >-
  没开 B2B 岗位的店，这封询盘还在收件箱里、没被挪到一个没人看的文件夹里吗？
