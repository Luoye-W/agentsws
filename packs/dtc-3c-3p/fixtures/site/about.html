<body>
  <h1>我们从一块露营地的插座开始</h1>
  <p>
    2019 年，我们几个人在云南的一片营地上过夜，第二天早上所有人的手机都没电了。
    那天之后我们开始做便携电源：不追求参数表上最大的那个数字，只追求一件事——
    天亮的时候你手里的东西还有电。现在我们做电源、营地灯和一条用得住的线。
  </p>
  <p>
    我们不喜欢说"革命性"这种词。东西好不好用，露营回来的人自己知道。
  </p>
