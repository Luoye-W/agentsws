# WP402（决策 1140 / 1146）：**内置浏览器被拦、工坊云端也没读到 → 第 3 条路「通过插件在你自己的浏览器里读」**。
#
# 1. 第一天三款都由内置浏览器读到（只建底子）；
# 2. 第二天第一款就碰到验证页，云端替身也没回来；还没问过同意：**一页都不开**，出一张同意卡（只出一次），这一轮照实说没读到；
# 3. 第三天还是被拦、云端还是没回来；用户同意过了：在他自己的浏览器里只读打开这几款，Trail 500 真降了的价照报一条，
#    没扣积分（这条路不花钱）。
id: amazon/competitor-own-browser
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-10-19T09:00:00+08:00' }
events:
  - at: '+0m'
    competitor.read:
      competitor: Rival Gear
      source: amazon
      rows:
        - { product: B0TESTRG01, title: Trail 500, price: 1299, rating: 4.4, reviews: 2318, available: true }
        - { product: B0TESTRG02, title: Camp Lite, price: 999, rating: 4.1, reviews: 512, available: true }
        - { product: B0TESTRG03, title: Trail 700, price: 1599.99, rating: 4.6, reviews: 987, available: true }
  - at: '+24h'
    competitor.read:
      competitor: Rival Gear
      source: amazon
      blocked_at: B0TESTRG01
      cloud_down: true
      own_browser: unasked
      rows:
        - { product: B0TESTRG01, title: Trail 500, price: 1299, rating: 4.4, reviews: 2318, available: true }
        - { product: B0TESTRG02, title: Camp Lite, price: 999, rating: 4.1, reviews: 512, available: true }
        - { product: B0TESTRG03, title: Trail 700, price: 1599.99, rating: 4.6, reviews: 987, available: true }
  - at: '+48h'
    competitor.read:
      competitor: Rival Gear
      source: amazon
      blocked_at: B0TESTRG01
      cloud_down: true
      own_browser: granted
      rows:
        - { product: B0TESTRG01, title: Trail 500, price: 1149, rating: 4.4, reviews: 2318, available: true }
        - { product: B0TESTRG02, title: Camp Lite, price: 999, rating: 4.1, reviews: 512, available: true }
        - { product: B0TESTRG03, title: Trail 700, price: 1599.99, rating: 4.6, reviews: 987, available: true }
expected:
  competitor_changes: [price]
  competitor_via: [browser, none, extension]
  competitor_credits: 0
  event_types:
    - simulation.competitor_read
    - simulation.competitor_consent
    - simulation.competitor_change
  metrics:
    staged_changes: 0
    applied_changes: 0
    runs_failed: 0
    outbound_sent: 0
invariants:
  - no_write_without_stage
  - provenance_respected
rubric: >-
  内置浏览器被拦、云端也没读到时，是不是先问了一句同意（没同意之前一页都没开）？同意之后才在用户自己的浏览器里只读打开，
  照实报出 Trail 500 的降价，没有扣积分、也没有绕验证？
