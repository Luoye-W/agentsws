# WP428（决策 1246 改）：在线客服按置信度直接答——**知识库里没有出处的，转人**。
#
# 访客问运费：词表判成售前、能答；但这个品牌的知识库里没有运费那一条 → 模型（stub 剧本）
# 说不出有出处的话 → 不直接发，出一张卡给人批，聊天里说「稍等，马上帮你问」。
# 另一位访客问退款 → 不管把握多高，一律转人（第二张卡）。
# （两位访客分开：同一条会话转人之后、人批之前 AI 不再抢答，那是 WP417 定的。）
id: chat/no-source-goes-to-human
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
actors: {}
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-10-19T09:00:00+08:00' }
events:
  - at: '+0m'
    chat.visitor_message:
      visitor: ben@example.com
      text: Hi! How much is shipping to the US?
  - at: '+1m'
    clock.advance: {}
  - at: '+2m'
    chat.visitor_message:
      visitor: cara@example.com
      text: Can I get a refund for order #1002?
  - at: '+3m'
    clock.advance: {}
expected:
  chat_actions: [answer, human_review]
  # 运费那一句没出处 → 一张；退款 → 一张。没人点头，什么都没发出去
  approval_kinds: { outbound_draft: 2 }
  event_types:
    - simulation.chat_turn
    - simulation.chat_auto_answer
  reply_omits: ['refund approved', '已退款', '给你退', 'free shipping']
  metrics:
    applied_changes: 0
    outbound_sent: 0
    blocked_proposals: 0
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
  - fencing_covers_external
  - prompt_replayable
rubric: >-
  第一轮知识库里没有运费，是不是老实说「稍等，马上帮你问」而不是编一个运费；第二轮退款是不是明确转人、不承诺。
