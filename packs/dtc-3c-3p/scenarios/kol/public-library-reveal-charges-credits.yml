# WP68 / WP126（49 M2 / M4、48 §5.3，09-19 Luoye 定的新计费规则）：
# 官方数据接口**没有免费动作了**——浏览 / 搜索按 `data.kol.lookup`（0.2/次）收，
# 取回一个邮箱照旧扣 `data.kol.lookup`；查无此人 / 搜到 0 条不收钱。
#
# 这条题跑的是 `packages/kol-public` 那一份**真服务**（真钱包、真价目、真加密），
# 不是一个替身。理由很实在：这道题要钉的三件事——浏览收多少、reveal 扣多少、
# 贡献返额度真的能用——全是那一份代码算出来的。换成替身，断言就只是在验场景自己写的数。
#
# 09-18 Luoye 定（保留）：**送的免费额度可以用来看邮箱**。① 那一步往公共库回填了一条联系方式，
# 按 49 M4 的贡献奖励得了 1 积分（`granted`，有期限）；② 一分钱没充就去取，
# 先浏览后 reveal，用的都是这 1 积分——该取到，而且账上先扣送的那一份。
#
# 最后一条断言是隐私那一条：取回来的明文进本机加密库，库里那一行只留 key 名。
id: kol/public-library-reveal-charges-credits
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
actors: {}
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-07T09:00:00+08:00' }
events:
  # ① 公共库里已经有这个人（别的工作区 / 插件贡献过），而且有联系方式
  - at: '+0m'
    kol.public_creator:
      channel: youtube
      handle: cablekevin
      followers: 120000
      engagement_rate: 0.035
      email: kevin@creators.example
  # ② 一分钱没充就去取：浏览先扣 0.2，reveal 再扣 0.2——用的都是贡献奖励送的那 1 积分，**取得到**
  - at: '+10m'
    kol.public_reveal: { who: p_li, channel: youtube, handle: cablekevin }
  - at: '+20m'
    clock.advance: {}
  # ③ 充 100 积分再取一次：仍取得到，扣的还是 `data.kol.lookup` 那个价（先扣有期限的，再扣充的）
  - at: '+30m'
    kol.public_reveal: { who: p_li, channel: youtube, handle: cablekevin, topup: 100 }
  - at: '+4h'
    clock.advance: {}
expected:
  kol_reveal:
    # 第一次（一分钱没充）也取得到——花的是送的免费额度（09-18 Luoye 定，保留）
    first_refused: false
    # 第二次（充过 100 积分）取得到
    ok: true
    # **浏览按次收**不是一句文案，是账上的数（WP126：0.2/次，价目表说了算）
    browse_credits: '>0'
    # 取回一个邮箱要花钱（具体几分由 49 M4 的价目表说了算，这里只断言"不是 0"）
    reveal_credits: '>0'
  event_types:
    - simulation.kol_public_revealed
  metrics:
    runs_failed: 0
invariants:
  - no_write_without_stage
  - provenance_respected
rubric: >-
  "这一步要花多少钱、为什么这一次没花钱"，人从这两次的结果里读得出来吗？
