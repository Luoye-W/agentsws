# WP78（60 §1）→ WP338（决策 664 / 783，Luoye 10-15）：**在别人的地盘上，规矩人看、人判。**
#
# 两条路各走一遍：
#
# ① 版规原文写着禁自我推广的版 → 系统**不替人拦**：照样出一张要人点的卡，卡上带版规原文，
#    发不发由人看了原文自己定（以前是 block；Luoye 10-15 定不替用户预设推广规矩）。
# ② 允许厂商帖的版 → 同样提得上去，**永远人审**（`community_post` 在 `HARD_L1` 里）。
#    场景故意报 L3，看硬顶会不会把它按回来。
#
# 顺带钉住：版规原文**在卡面上**（「版规 N 条」，原文进详情）。
id: pr/external-post-needs-approval-and-rules
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
# 3 人公司里"运营"李默兼着公关那两条写动作；店主点卡
actors:
  p_wang: { approve: { policy: always_approve, latency: 10m..1h } }
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-07T09:00:00+08:00' }
events:
  # ① 版规写着禁自我推广的版：照样出卡、版规原文上卡，人判
  - at: '+0m'
    pr.external_post:
      who: p_li
      platform: reddit
      venue: BuyItForLife
      title: 三年后拆开我们自己的一代产品
      body: 把我们一代的机器拆了，说说哪几处设计撑住了三年、哪几处没撑住。
      rules:
        - 'Rule 1：No self-promotion — 含外链的厂商帖一律删'
        - 'Be civil'
      # 故意报 L3：硬顶照样把它按回人审
      level: L3
  # ② 允许厂商帖的版：提得上去，但要人点
  - at: '+1h'
    pr.external_post:
      who: p_li
      platform: reddit
      venue: OutdoorGear
      title: 二代户外电源的拆解与实测
      body: 电芯换了型号，循环次数从 500 提到 800。数据来自我们自己的测试。
      rules:
        - 'Vendors welcome: one post per month, flair required: Review, Discussion'
      flair: Review
      level: L3
  - at: '+3h'
    clock.advance: {}
expected:
  # 断言看的是**最后一条**（允许的那个版）：照样等人点
  pr_external_post:
    blocked: false
    rules_ok: true
    requested_level: L3
    # **HARD_L1**：报 L3 也落回人审
    auto_approved: false
    stated_on_card: true
  # 两条都进了队列（禁推广那一条不再被系统拦，由人看版规原文判）
  approval_kinds: { staged_change: 2 }
  event_types:
    - simulation.pr_external_post_staged
  metrics:
    runs_failed: 0
invariants:
  - no_write_without_stage
  - provenance_respected
  - fencing_covers_external
rubric: >-
  这张卡上"发到哪个版、那个版的版规原文是什么"，点它的人读完能自己判断发不发吗？
