# WP76（58 §1 / 04 §6）：**变体出卡给人挑，定稿入库永远人定**。
#
# 这条题是 04 §6 那句纪律在模拟里的样子——"Agent 出 brief、规格、变体与初稿，
# **视觉决定永远是人**"。三步各钉一件事：
#
# 1. **出变体是 L2**：初稿进的是待挑队列，一张都不会自己跑到顾客面前。
# 2. **人点了「就这张」**，才有后面那一张入库卡（`design.pick` 这个事件
#    代表的就是人的那一下；`picked_by` 由服务端按请求人盖，Agent 填不了）。
# 3. **入库是 L1 硬顶**：场景故意把等级报成 L3（等于有人在设置里把定稿开到了
#    全自动），15 §2 的 `HARD_L1` 里有 `asset_publish`，所以这一下必须被按住。
#
# 装一个人来点卡：没有他，那张入库卡只会一直压在队列里——而那恰恰也是对的，
# 只是看不出"人点过之后会怎样"。
id: design/variants-then-human-picks
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
actors:
  p_wang: { approve: { policy: always_approve, latency: 30m..2h } }
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-07T09:00:00+08:00' }
events:
  - at: '+0m'
    design.request:
      who: p_li
      from: dtc.store
      title: 秋季活动落地页 Banner
      need: 活动页要一张 Banner。目标：把“买二免一”说清楚。受众：老客。图上写“买二免一”。
      specs: [web.banner]
  # 出三版让人挑（额度是 6，这次只要三版）
  - at: '+30m'
    design.variants:
      who: p_li
      n: 3
  # 人点了「就这张」→ 出入库卡。等级故意报 L3，硬顶会把它按回人审
  - at: '+2h'
    design.pick:
      who: p_li
      level: L3
  - at: '+6h'
    clock.advance: {}
expected:
  design_variants:
    n: 3
    generated: 3
    image_model: true
    # L2：出卡给人挑，不自动
    auto_approved: false
  design_pick:
    staged: true
    # 报了 L3 也不许自动放行——04 §6 那条纪律不靠采纳率说话
    auto_approved: false
  staged_change_kinds: [design_request, design_brief, design_variant, asset_publish]
  event_types:
    - simulation.design_variants_staged
    - simulation.design_asset_picked
  metrics:
    runs_failed: 0
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
rubric: >-
  挑图那张卡上，"就这张"与"都不行再来"是不是并排的两个选择？只给一个"选一张"的界面，人会挑一张最不差的。
