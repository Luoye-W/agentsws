# WP167（docs/63 §D「收信一个入口」）：**只有判成客服的信才开事项、起 Run**。
#
# 以前同一只邮箱上有两条收信路：渠道那一路给 INBOX **每一封**新信开事项、起 Run，
# 订阅、通知都在工作台上变成一条事项、花一次模型钱。现在只有消息同步在收：它先分拣，
# 只有判成客服的信才交给客服那一路。
#
# 四封信：
#   ① 客户来信 → 交客服：开一条事项、起一次 Run
#   ② 订阅信（List-Unsubscribe）→ 只进消息页，规则层判的，一次模型都不花
#   ③ 平台通知（noreply@ 发件人）→ 只进消息页，规则层判的（WP167 顺手修了这一层从没命中过的 bug）
#   ④ 供应商来信 → 只进消息页
#
# 最后一封是 ③ 的一个变体（Auto-Submitted 的发货通知），`message_triage` 钉它：不开事项、不起 Run。
id: messages/one-intake-only-support-runs
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
actors: {}
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-27T09:00:00+08:00' }
events:
  - at: '+0m'
    messages.inbound:
      from: ann@customer.example
      subject: My order arrived damaged
      body: The box was crushed and the bottle is broken. I want a refund for order 1042.
  - at: '+2m'
    messages.inbound:
      from: news@brand-weekly.example
      subject: This week's picks
      body: Shop the new arrivals now.
      headers:
        list-unsubscribe: <https://brand-weekly.example/u>
  - at: '+4m'
    messages.inbound:
      from: noreply@payments.example
      subject: Your payout has been sent
      body: A payout of 1,204.00 USD is on its way to your bank account.
  - at: '+6m'
    messages.inbound:
      from: sales@packaging-supplier.example
      subject: 新报价单
      body: 附上这一批纸箱的报价，单价比上次低 3%。
  - at: '+8m'
    messages.inbound:
      from: shipping@carrier.example
      subject: Shipment 1042 delivered
      body: Your shipment was delivered today.
      headers:
        auto-submitted: auto-generated
expected:
  message_triage:
    route: inbox
    by: rule
    intake: none
    opened_matter: false
    started_run: false
    moved: false
    model_calls: 0
  message_intake:
    support: 1
    only_messages: 4
    matters_opened: 1
    runs_started: 1
  event_types:
    - simulation.message_triaged
  metrics:
    runs_failed: 0
invariants:
  - no_write_without_stage
  - provenance_respected
rubric: >-
  五封信里只有一封开了事项。人在工作台上看到的是「一条客户来信在处理」，
  而不是五条事项里混着订阅与通知吗？
