# WP113（63 §4）：**纠错教一次，下一封直达**。
#
# 人把一封信挪到客服，并勾了"以后这个发件人都这样"。那一下写下一条发件人规则，
# 而规则跑在**模型之前**（第 ② 层）——于是同一个发件人的下一封信直达，
# `model_calls` 从 1 变成 0。
#
# 这条题验的不只是"省了一次模型"：它验的是**"我教过它"这件事看得见**。
# 一个学不会的助手，用户第三次纠正之后就不会再纠正了。
id: messages/correction-teaches
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
actors: {}
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-07T09:00:00+08:00' }
events:
  # 第一封：规则分不出来 → 走模型（花 1 次）
  - at: '+0m'
    messages.inbound:
      from: orders@wholesale-partner.example
      subject: 本月对账单
      body: 附件是本月的对账明细，请核对后回签。
  # 人看了一眼，说"这类该归客服"，并勾了"以后这个发件人都这样"
  - at: '+30m'
    messages.correct:
      from: orders@wholesale-partner.example
      to: support
      remember_sender: true
  # 同一个发件人的下一封：规则直达，一次模型都不花
  - at: '+1h'
    messages.inbound:
      from: orders@wholesale-partner.example
      subject: 下月对账单
      body: 附件是下月的对账明细。
expected:
  message_triage:
    route: support
    by: rule
    # 教过一次之后：不再花模型
    model_calls: 0
    moved: true
    moved_to: kefuagents
  event_types:
    - simulation.message_corrected
    - simulation.message_triaged
  metrics:
    runs_failed: 0
invariants:
  - no_write_without_stage
rubric: >-
  第二封信直接进了客服，一次模型都没花。用户看得出"是因为我上次教过它"，
  还是会以为这次只是碰巧判对了？
