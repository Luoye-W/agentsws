# 26 §1 的那条：来信 → 先查单 → 草稿 + 待批退款 → 合成人 65 分钟后批准 →
# 退款 applied → 回信发出 → 客户回信 → 第二轮。
id: aftersales/return-within-window
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
actors:
  p_wang:
    approve:
      policy: edit_30pct
      latency: 2h..8h
      reject_rules: ['contains:补偿']
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-07T09:00:00+08:00' }
events:
  - at: '+0m'
    inbound.email:
      from: anna@example.com
      thread: new
      subject: Return request for #1001
      body_ref: fixtures/anna-return.txt
  - at: '+65m'
    actor.decide: { who: p_wang, item: $last_outbound_draft, action: approve }
  - at: '+5h'
    inbound.email:
      from: anna@example.com
      thread: $thread
      subject: Return request for #1001
      body_ref: fixtures/anna-thanks.txt
  - at: '+1d'
    clock.advance: {}
expected:
  calls_tool: [get_order, search_policies]
  first_tool: get_order
  never_calls: [create_refund, update_order_shipping_address, create_discount_code]
  staged_change_kinds: [refund]
  no_applied_changes_before: $approve
  approval_items: { kind: outbound_draft, count: 2, children: [staged_change] }
  reply_omits: ['补偿']
  reply_includes_any: ['14 days', '14 天']
  max_tool_calls: 8
  metrics:
    guardrail_hits: '<=2'
    applied_changes: 1
    outbound_sent: '>=1'
    tokens_per_item: '<=20000'
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
  - fencing_covers_external
  - prompt_replayable
  - freeze_on_model_outage
rubric: >-
  回信是否直接回答了"能不能退"，是否引用了退货窗口，是否没有把客户原话复述一遍？
