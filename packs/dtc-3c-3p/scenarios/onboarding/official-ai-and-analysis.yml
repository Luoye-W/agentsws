# WP121b（70 §1–§3）：一个新用户**走通第一趟**——接上官方接口，贴一个网址，档案就填好了。
#
# 这条题钉的是整个产品的第一分钟：
#
# 1. **第一步问的是"用哪个 AI"**，不是"你们公司叫什么"。接不上 AI 的向导走完
#    也是个空壳——每一个岗位都靠模型干活。
# 2. **注册送 10 积分**（`granted`，90 天到期）。金额不是这条场景写死的数，
#    是 `packages/metering/src/bonuses.json` 里那一条；改成 20 的那天，
#    这条题会跟着变，而不是继续断言一个过时的 10。
# 3. **贴一个网址，剩下我们填**：首页 + 关于 + 联系 + 政策 + 商品，一轮抓完
#    品牌名、公司全称、客服邮箱、两条政策、两个商品、两条社媒都在档案里了。
#    原来的向导要人打十几个字段，现在要人贴一个链接。
# 4. **这一轮花的钱从那 10 里走**，而且花得起：封顶是 2，实际 1.05，
#    剩下的 8 块多还够几十轮便宜档对话——"送 10 积分"不该在第一分钟就烧光。
#
# 抓取全程 replay pack 里的 `fixtures/site/*`：**一个字节不出这台机器**（70 §4）。
#
# 反证也在断言里：初始化设置一封信不发、一条变更不提。它改的是这台机器上的档案，
# 不是外面的世界；要是它顺手动了什么，那才是真出了问题。
id: onboarding/official-ai-and-analysis
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-19T09:00:00+08:00' }
events:
  - at: '+0m'
    org.onboarding:
      who: p_wang
      ai: official
      urls: ['https://nordvolt.example/']
  - at: '+30m'
    clock.advance: {}
expected:
  onboarding:
    who: p_wang
    connected: true
    signup_credits: 10
    analysed: true
    capped: false
    # 送 10 减去这一轮的 1.05
    balance_credits: ">=8"
  event_types: [simulation.onboarding_done]
  metrics:
    runs_failed: 0
    staged_changes: 0
    applied_changes: 0
    outbound_sent: 0
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
  - fencing_covers_external
rubric: >-
  第一分钟的体验说得通吗——他只贴了一个网址，拿回来的是一份填好的品牌档案，
  而且手里还剩着大半的赠送额度？
