# WP77（59 §2）：上线检查单**说得出缺什么，也说得出哪几项它补不了**。
#
# 三件事要钉住，每一件都是真发生的，不是场景自己判的：
#
# 1. **判断在纯函数里**。这张清单是 `@agentsws/site-core` 的 `runLaunchChecklist`
#    按世界里那份店铺事实算出来的——同一份事实每次得到同一张清单。场景里没有
#    一处写着"应该缺运费"，缺什么由那家合成店现在的样子决定。
# 2. **主题那一项真读一次 `theme list`**。清单上写的是线上现在那一份，
#    不是谁记得的那一份（同 `ops/theme-publish-needs-approval` 的 `before`）。
# 3. **它什么都不改，也不该是一张卡**（WP96，09-18）。14 的老规矩没变：Agent 主动
#    做的每一件事都进同一条账（`staged_change_kinds: [launch_check]` 还在）；变的是
#    投影到界面的那一步——只有要人**决定**的才是卡（36 §2），检查单一个决定都不要
#    人做，它是岗位面板里的**报表块**。所以现在钉的是 `panel_reports: 1`（报表块
#    有数）与 `queue_cards: 0`（审批队列里没有它）。
#
# 为什么这条题该在 3 人公司里：3 人公司的店就是店主自己搭的，检查单是他唯一
# 一份"还差什么"的清单。15 人公司里那张清单早就跑过了。
#
# 合成的那家店故意留着三个缺口（还挂在 myshopify 域名上、政策页只写了退换货、
# 运费一条都没配）——支付与税**是配好的**：那两项建站岗位改不了（51 §3 N2），
# 留成缺口只会让这条题在报一句"去后台自己点"。
id: site/launch-checklist-finds-gaps
version: 1
dataset: { pack: dtc-3c-3p, seed: 42 }
actors:
  # 检查单 route_to: role_holder——它落在跑它的那个人手上，不惊动别人
  p_wang:
    approve: { policy: always_approve, latency: 30m..2h }
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-07T09:00:00+08:00' }
events:
  # 店主自己跑一遍："还差什么才能开门"
  - at: '+0m'
    site.checklist:
      who: p_wang
  - at: '+6h'
    clock.advance: {}
expected:
  staged_change_kinds: [launch_check]
  # **上限**是 L3、**初始是 L2**（职责 yml 那一栏写的就是 `initial: L2 / ceiling: L3`）。
  # 升到 L3 要采纳率够了才行，那是 24 的学习回路的事，不是这条题。所以这里看到的
  # 是 L2 那一档：它什么都不改，但第一次跑仍然落在队列里等人看一眼。
  auto_approved: 0
  approval_kinds: { staged_change: 1 }
  # WP96：账本上有这一条，人的队列里没有——它落在岗位面板的报表块
  panel_reports: 1
  queue_cards: 0
  # 主题那一项是真读回来的
  calls_tool: [theme_list]
  event_types:
    - simulation.site_checklist_ran
    - change.staged
    - change.applied
  metrics:
    staged_changes: 1
    applied_changes: 1
    runs_failed: 0
    outbound_sent: 0
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
  - fencing_covers_external
  - prompt_replayable
rubric: >-
  这张卡把"缺了顾客买不成"与"缺了迟早出事"分开说了吗？支付与税那两项，
  它说清了"这一项我改不了，请你自己去后台"而不是给一个点不动的按钮吗？
