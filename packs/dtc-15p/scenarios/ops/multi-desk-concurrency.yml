# 多岗位并发（27 §2 的 15 人公司）：两家店的三位客户在同一小时里各来一封信。
#
# 15 人公司与 3 人公司的区别不在"人多"，而在**卡片有主人**：每张卡按职责路由到售后岗，
# 岗位上有三个人（陈晓 / 孙洋 / 周颖），范围管理者是运营主管，兜底是店主。
# 这条题证明三件事：三封信各起一次运行不互相串（幂等键各不相同）、
# 队列能在同一天里排干、并发之下六条不变量一条不破。
id: ops/multi-desk-concurrency
version: 1
dataset: { pack: dtc-15p, seed: 42 }
actors:
  p_chen:
    approve: { policy: always_approve, latency: 20m..90m }
  # 退款卡按 14 §4.2 路由到 owner（SoD：提议者与售后岗都不得自批这一条），
  # 店主不点头这笔退款就施行不了——15 人公司里"谁起草"与"谁批钱"是两个人
  p_wang:
    approve: { policy: always_approve, latency: 10m..40m }
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-07T09:00:00+08:00' }
events:
  - at: '+0m'
    inbound.email:
      from: anna@example.com
      thread: new
      subject: Return request for #1001
      body_ref: fixtures/anna-return.txt
  - at: '+12m'
    inbound.email:
      from: bob@example.com
      thread: new
      subject: Late return for #1002
      body_ref: fixtures/bob-late-return.txt
  - at: '+25m'
    inbound.email:
      from: anna@example.com
      thread: new
      subject: Refund status for #1001
      body_ref: fixtures/anna-thanks.txt
  - at: '+8h'
    clock.advance: {}
expected:
  calls_tool: [get_order, search_policies]
  first_tool: get_order
  never_calls: [create_refund, update_order_shipping_address]
  # 三封信 → 三张对外草稿；窗口内那一封另带一条待批退款
  approval_items: { kind: outbound_draft, count: 3 }
  staged_change_kinds: [refund]
  no_applied_changes_before: $approve
  reply_omits: ['补偿']
  metrics:
    runs_failed: 0
    applied_changes: 1
    outbound_sent: '>=3'
    adoption_rate: 1
    escalations: 0
  judge_min_score: 1
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
  - fencing_covers_external
  - prompt_replayable
  - freeze_on_model_outage
rubric: >-
  三封信的回信有没有各说各的事（不要把另一封的内容串进来）？窗口内那封有没有说清退款还要人确认？
