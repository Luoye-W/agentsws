# 54（WP69）：**开一件事是交给一个岗位，不是交给一条职责**。
#
# 用户面对的是「网站运营」「客服」，不是「店铺管理」「网站客服」。这条题证明那句话
# 在机制上真的成立，而且三处边界都守住了：
#
# 1. **同一套判据，不同岗位，不同结果**。判据在 `@agentsws/roles` 的 `routeWithinPosition`
#    里，全部来自职责定义本身（名字 / description / grounding / 动作 id / 数据域）。
#    「把 A 商品降价 10%」在网站运营里落到店铺管理；「Discord 群里有人问退货」在客服里
#    落到社群管理。公司改了职责定义，路由跟着变，不用改代码。
#
#    WP72（56 §4）之后这一句**必须带渠道**：客服岗位新加的「社群管理」与「网站客服」
#    的动作 id、额度、数据域逐字相同（56 §4「同一份 caps，不另起」），两条真正的差别
#    只有渠道。所以光说「客户问退货」在这个岗位里确实判不准——那句话本身不带答案，
#    判给谁都是猜。补上「Discord 群里」，它立刻判得准。
# 2. **路由不是权限并集**（05 §4）。赵宁同时持有网站运营那四条与客服那三条，但路由挑出
#    店铺管理之后，起 Run 用的就是**店铺管理那一条分配**——改价是它的动作，退款不是。
#    第三段的 `shop.price_change` 走的正是这条分配：真读商品 → 官方校验 → 一张改价卡。
# 3. **拿不准不猜**（54 §2）。同一句「把 A 商品降价 10%」交给**客服**岗位时，四条客服职责
#    各沾一点、谁也不比谁像——这时候出一张选择卡问一句，比替人选一条安全得多。
#
# 反过来说，这条题还钉住了一件容易忘的事：这一整套没有给任何人多一点权限。
# `assignments_not_unioned` 那条断言看的就是它——赵宁身上七条分配，没有任何一条
# 因为"它们同属一个岗位"而拿到了别人的动作。
id: org/task-opened-at-position-routes-to-duty
version: 1
dataset: { pack: dtc-15p, seed: 42 }
actors:
  # 改价那张卡落在运营主管李默手上：提案的是他手下赵宁那条店铺管理，职责分离自然满足
  p_li:
    approve: { policy: always_approve, latency: 10m..30m }
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-09-15T09:00:00+08:00' }
events:
  # ① 配岗：46 §1 ③「勾岗位 = 它包含的职责全勾上」。
  #    路由要在**多条职责之间**做才有意义，所以先把两个岗位都配齐。
  - at: '+0m'
    position.staff: { who: p_zhao, position: web-ops }
  - at: '+1m'
    position.staff: { who: p_zhao, position: customer-care }

  # ② 一句话交给网站运营 → 店铺管理（「商品」「价格」是它的判据词）
  - at: '+5m'
    position.open:
      who: p_zhao
      position: web-ops
      text: 把 A 商品降价 10%

  # ③ 那条职责真的去改了价：真读商品 → 官方 GraphQL 校验 → 一张改价卡进队列。
  #    129 → 99 降了 23%，超过 dtc.store 的 max_price_delta_pct: 20 → 转人审。
  - at: '+10m'
    shop.price_change:
      who: p_zhao
      product: prod_1
      price: 99
      note: 按岗位里那条店铺管理的规矩来
  #    主管李默按他的习惯点头（`actors` 里那条 `always_approve` 就是他的替身）

  # ④ 同一个人、另一个岗位：这一句落到社群管理（WP72 / 56 §4）。
  #    带渠道的那半句（「Discord 群里」）是唯一分得开它与网站客服的东西——
  #    两条职责的动作与额度逐字相同，差的只有渠道。
  - at: '+45m'
    position.open:
      who: p_zhao
      position: customer-care
      text: Discord 群里有人问退货

  # ⑤ 拿不准：同一句「把 A 商品降价 10%」交给客服岗位——四条客服职责各沾一点，
  #    谁也不比谁像。出一张选择卡问一句，不猜。
  - at: '+50m'
    position.open:
      who: p_zhao
      position: customer-care
      text: 把 A 商品降价 10%
  - at: '+2h'
    clock.advance: {}
expected:
  # 两句话各落到对的那条职责上（同一套判据，岗位不同结果不同）
  position_routed_to: [dtc.store, dtc.community-support]
  staged_change_kinds: [price_change]
  event_types:
    # 判准了的两条
    - simulation.position_routed
    # 拿不准的那一条：出了卡，没起 Run
    - simulation.position_ambiguous
    - change.staged
    - change.applied
  # 05 §4：赵宁身上七条分配，没有任何一条因为"同属一个岗位"拿到并集权限
  assignments_not_unioned: [p_zhao]
  metrics:
    staged_changes: 1
    applied_changes: 1
    # 降 23% 超了店铺管理那条 max_price_delta_pct: 20 → 至少命中一条 review
    guardrail_hits: '>=1'
    runs_failed: 0
    outbound_sent: 0
invariants:
  - no_write_without_stage
  - apply_only_after_approved
  - provenance_respected
  - fencing_covers_external
  - prompt_replayable
