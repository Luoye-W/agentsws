# WP393（docs/104 一期 A，C5 / C8）：**店铺管理「竞品动向」——配好之后第二天出一条降价，并说比你便宜多少**。
#
# 方案卡上用户确认了「降价 ≥10% 或降完比你便宜算要紧」、Trail 500 对标自家的 Ridge 500（$899）。
# 第一次读只建底子（简报不出）；第二天 Trail 500 两个款式降了 10%–12%，合成一条改价、写出「比你的 Ridge 500 便宜 $20」（按变得最多的那一款 $879 比），
# 进简报「竞品动向」。竞品监控自己零写：只读外部公开页面，不出卡、不改任何外部账号（docs/104 §5 第 4 条）。
id: store/competitor-store-vs-own
version: 1
dataset: { pack: dtc-15p, seed: 42 }
stand_ins: { provider: mock_open_connector, model: stub, clock: virtual, delivery: inbox }
clock: { start: '2026-10-19T09:00:00+08:00' }
events:
  # 方案卡点了「就这样」
  - at: '+0m'
    competitor.plan:
      rules: { price_drop_pct: 10, cheaper_than_own: true, new_products: true }
      own:
        - { key: ridge-500, title: Ridge 500, price: 899 }
      pairs:
        - { competitor: Rival Gear, product: '1001', own: ridge-500 }
  # 存下就先读一次当底子
  - at: '+1m'
    competitor.read:
      competitor: Rival Gear
      source: shop
      rows:
        - { product: '1001', variant: '1001-s', title: Trail 500, price: 899, available: true }
        - { product: '1001', variant: '1001-l', title: Trail 500, price: 999, available: true }
        - { product: '1002', variant: '1002-1', title: Camp Lite, price: 299, available: true }
  # 第二天：Trail 500 两个款式都降了（-10% / -12%），Camp Lite 没动
  - at: '+24h'
    competitor.read:
      competitor: Rival Gear
      source: shop
      rows:
        - { product: '1001', variant: '1001-s', title: Trail 500, price: 809, available: true }
        - { product: '1001', variant: '1001-l', title: Trail 500, price: 879, available: true }
        - { product: '1002', variant: '1002-1', title: Camp Lite, price: 299, available: true }
expected:
  competitor_changes: [price]
  competitor_brief: ['Rival Gear · Trail 500', '比你的 Ridge 500 便宜 $20']
  event_types:
    - simulation.competitor_plan
    - simulation.competitor_read
    - simulation.competitor_change
    - simulation.competitor_brief
  metrics:
    staged_changes: 0
    applied_changes: 0
    runs_failed: 0
    outbound_sent: 0
invariants:
  - no_write_without_stage
  - provenance_respected
rubric: >-
  第一天是不是只建了底子、简报没出？第二天是不是一条「Trail 500 两个款式降价 10%–12%」，
  并且直接说出「比你的 Ridge 500 便宜 $20」，而不是让人自己去算？
