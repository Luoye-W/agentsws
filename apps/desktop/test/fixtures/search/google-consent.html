<!doctype html>
<!-- WP454 夹具：Google 的 cookie 同意页（consent.google.com，欧盟出口常见）最小结构（手写）。AI 不点这里的任何按钮。 -->
<html><head><title>Before you continue to Google</title></head><body>
<h1>Before you continue to Google</h1>
<p>We use cookies and data to deliver and maintain Google services.</p>
<form action="https://consent.google.com/save" method="POST"><input type="hidden" name="set_eom" value="true"><button>Reject all</button></form>
<form action="https://consent.google.com/save" method="POST"><input type="hidden" name="set_eom" value="false"><button>Accept all</button></form>
</body></html>
