# 打包配置（13 §5「一个安装包把运行时带齐」）。
#
# WP111 起安装包里**带着一份 Node 22 与按它 ABI 编好的原生模块**（`extraResources`），
# 对方的机器上不需要装 Node、不需要 Docker。仍然**不签名、不公证**：
# 首次打开 Windows 要点「更多信息 → 仍要运行」、mac 要右键「打开」（docs/62 写了）。
appId: com.agentsws.desktop
productName: agentsws
copyright: Copyright © 2026 agentsws contributors
directories:
  output: release
  buildResources: build
# asar 关掉：服务进程是以 `ELECTRON_RUN_AS_NODE` 跑的子进程，
# 从 asar 里执行脚本要额外的 hook，v1 用平铺目录换确定性（见 README「打包」）。
asar: false
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/test/**'
# 捆绑的 Node（`scripts/fetch-node.mjs` 下的，sha256 钉在 node-runtime.lock.json 里）。
# `${platform}-${arch}` 展开成 `darwin-arm64` / `win32-x64` —— 与脚本建的目录名同一套。
extraResources:
  - from: vendor/node/${platform}-${arch}
    to: node
    filter:
      - '**/*'
  # WP181：审过的官方插件清单与锁定 patch（设置 → 官方插件要读它们；读不到整页"装不了"）。
  # 只带这两份——profile 里别的东西（package.json、说明）装好的桌面版用不上。
  # 桌面壳经 `AGENTSWS_PROFILE_DIR` 把 `<resources>/profiles/agentsws` 告诉服务进程；afterPack 查它们在不在。
  - from: ../../profiles/agentsws
    to: profiles/agentsws
    filter:
      - cordis.patch.yml
      - plugin-allowlist.yml
  # WP218：工作台的构建产物（vite build 出的 dist）。服务进程经 `AGENTSWS_STATIC_DIR` 在 `/` 托管它；
  # WP111 起一直漏了这一项，装好打开工作台是 404。afterPack 查 index.html 在不在，不在就打包失败。
  - from: ../workstation/dist
    to: workstation
    filter:
      - '**/*'
      - '!**/*.map'
# 打完包再做四件事（见 scripts/after-pack.mjs）：补齐 electron-builder 漏收的 pnpm 依赖、
# 把原生模块换成捆绑 Node 的 ABI 那份、用捆绑的 Node 冒烟一次 import、放第三方许可证。
# WP148：Electron 发行包刚解出来时先存下它自带的两份许可证（mac 上之后会被丢掉），
# afterPack 再把它们和按 `pnpm licenses list` 生成的第三方清单一起放进 `<resources>/licenses/`。
afterExtract: scripts/after-extract.mjs
afterPack: scripts/after-pack.mjs
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # 托盘常驻、不进 Dock（13 §5「无主窗口启动」）。
  extendInfo:
    LSUIElement: 1
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Agents 工坊
  uninstallDisplayName: Agents 工坊
  # WP111：未签名的 NSIS 照样能做应用内自动更新。
  # WP218：差分下载打开（出 `.exe.blockmap`，只下变了的块）。electron-updater 差分失败会自己退回整包下载，
  # 下完照样校 sha512——「更新到一半起不来」靠的是那道校验与装前自检，不靠整包。
  differentialPackage: true
  # 装 / 更新完自动打开（应用内「重启并更新」那一步也靠它重开）
  runAfterFinish: true
linux:
  target:
    - AppImage
  category: Office
# 不为 Electron 重建原生模块：服务进程跑在独立 Node 上（见 README「原生模块」）。
# better-sqlite3 11 编不过 Electron 44 的 V8 头，强行重建还会把仓库里给 Node 用的
# 那份 .node 覆盖掉。
npmRebuild: false
nodeGypRebuild: false
# WP218：更新源（写进安装包里的 `app-update.yml`，应用内更新查的就是它）。
# 主源 = 自有下载站 `https://dl.agentsws.com/<渠道>/`（R2 公开桶，按 stable / beta 分目录）；
# GitHub Releases 只做镜像与备用（客户端主源连不上时退过去查一次，见 src/update-feed.ts）。
# 这里写的是默认那一份；**真正打包走 `scripts/dist.mjs`**，它按 AGENTSWS_UPDATE_PROVIDER /
# AGENTSWS_UPDATE_BASE_URL / AGENTSWS_UPDATE_CHANNEL 与版本号用 `-c.publish.*` 覆盖。
# 渠道靠目录分：文件名始终是 latest*.yml（detectUpdateChannel: false）。
# electron-builder 自己**从不上传**（一律 `--publish never`）：上传由 release.yml 做（R2 + GitHub 同一套产物）。
detectUpdateChannel: false
publish:
  provider: generic
  url: https://dl.agentsws.com/beta
