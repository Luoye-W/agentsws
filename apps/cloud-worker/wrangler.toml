# Agents 工坊云 · 无服务器形态（WP114 / docs/64）
#
# 这个文件进仓库，所以它里面**一个密钥都没有**：
# `[vars]` 只放非敏感项（对外地址、上游地址、发件地址、版本号），
# 其余一律 `wrangler secret put <名字>`，由人在自己的终端里敲一次。
# 名字与去哪儿拿，见 docs/64 的 secrets 全表。
#
# 自建（Compose）形态在 `deploy/` 与 docs/61，**保留不删**。

name = "agentsws-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# node:crypto（sha256 / hmac / 定长比较）与 node:async_hooks（每请求的 principal
# 作用域）都要它。官方文档：这两个在 nodejs_compat 下是全支持的。
compatibility_flags = ["nodejs_compat"]

# 域名本来就在这个 Cloudflare 账号里，所以自定义域一步到位——
# 不用去后台点，也不用改 NS。
routes = [{ pattern = "cloud.agentsws.com", custom_domain = true }]

# ── Durable Objects ────────────────────────────────────────────────────
# 为什么是 DO 而不是 D1 / Supabase：DO 的 SQLite 是**同步** SQL、单对象单线程，
# 正好保住"钱的读写中间不该有一个 await"这条纪律（见 packages/metering/src/wallet.ts）。
# 换成异步口就得把钱包整片改成 async，而那等于把并发扣款的窗口打开。

# 账号 / 组织 / 链接令牌 / magic link / 限流 / 幂等（单例）
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountsDO"

# 钱包：每个组织一个（idFromName(org_id)）
[[durable_objects.bindings]]
name = "WALLET"
class_name = "WalletDO"

# 计量事件的只读副本（单例，WP115 / docs/65 §9）。
# 钱按组织切开之后没有一张跨全部组织的表，而运营后台的总览 / 台账要的正是那个。
# 每条计量事件由源头 WalletDO 抄一份进来（ctx.waitUntil，失败进待补队列、alarm 重投）。
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

# 公共红人库（单例，WP116 / docs/64 §10.2）。
# 这张红人表是**跨租户共享的一层事实**（48 §1.2）：一个人报的，所有人受益。
# 按组织切开就等于每个组织自己攒一份，公共库的全部价值就没了。所以只有一个名字。
# 钱不在这里——预扣与结算都在 WalletDO 里，这个对象拿到的钱包是一台录音机。
[[durable_objects.bindings]]
name = "KOL_PUBLIC"
class_name = "KolPublicDO"

# 红人营销增值服务的租户库（**每个组织一个**，WP118 / 64 §10.3）。
# 与上面那个公共库刚好相反：公共库是跨租户共享的一层事实（只有一个名字），
# 这一份是一个组织自己的私有数据，所以 `idFromName(org_id)`——对象边界就是
# 隔离边界，不靠"别忘了加 where org_id"。
# 它有 alarm：每天醒一次把到点的月费扣掉（幂等，重跑不会多扣）。
[[durable_objects.bindings]]
name = "KOL_TENANT"
class_name = "KolTenantDO"

# WP124：在线聊天官方转发——每工作区一个，只转发不落盘（docs/74）。
[[durable_objects.bindings]]
name = "CHAT_RELAY"
class_name = "ChatRelayDO"

# WP128：客服增值服务的托管实例——每个订阅的工作区一个（idFromName(workspace)）。
# 这个类同时出现在下面的 `[[containers]]` 里：运行时给它的 ctx.container 就是那个容器，
# 容器里跑同一份 apps/server（docs/74 §5、docs/64 §13）。
[[durable_objects.bindings]]
name = "HOSTED_INSTANCE"
class_name = "HostedInstanceDO"

# SQLite 存储后端。迁移在对象第一次唤醒时自己跑完——升级 = 再 deploy 一次。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountsDO", "WalletDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LedgerDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["KolPublicDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["KolTenantDO"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ChatRelayDO"]

# WP128：容器类必须是 SQLite 后端的 DO（官方 wrangler 配置文档的写法）
[[migrations]]
tag = "v6"
new_sqlite_classes = ["HostedInstanceDO"]

# ── 容器（WP128 / docs/64 §13） ────────────────────────────────────────
# `wrangler deploy` 会就地 build `deploy/Dockerfile.hosted` 并推到 Cloudflare 自己的
# 镜像仓库（要本机有 Docker）。镜像里没有任何工作区号与密钥。
#
# - instance_type = "basic"（1/4 vCPU、1 GiB 内存、4 GB 盘；镜像上限 = 盘）：
#   apps/server 空闲时本机实测约 75 MB（WP128 报告），但跑话轮、推快照（VACUUM INTO +
#   打 zip）时会涨，lite 的 256 MiB 余量太薄——OOM 就是聊天窗掉线，所以先上 basic。
#   费用见 docs/64 §13：basic 常驻一个月约 $8.5，**比 30 积分（约 $4.2）贵**；lite 约
#   $2.3。选哪档要 Luoye 定（报告第 3 节）。改这里要同步改 [vars] 的
#   AGENTSWS_HOSTED_INSTANCE_TYPE。
# - max_instances：同时最多几个容器 = 最多几个订阅的工作区（每个一个）。内测 50 够；
#   到顶后新订阅的工作区起不来容器（状态里如实写），先调大这个数再说共享版。
[[containers]]
class_name = "HostedInstanceDO"
image = "../../deploy/Dockerfile.hosted"
image_build_context = "../.."
instance_type = "basic"
max_instances = 50

# ── 快照桶（WP128） ────────────────────────────────────────────────────
# 容器的盘是临时的，工作区包每 6 小时推一份进来；停容器后留 30 天。
# 桶要先建一次：`wrangler r2 bucket create agentsws-hosted-snapshots`（docs/64 §13）。
[[r2_buckets]]
binding = "HOSTED_SNAPSHOTS"
bucket_name = "agentsws-hosted-snapshots"

# ── 运营后台的静态产物（WP115 / docs/65 §8） ───────────────────────────
# `apps/cloud-admin` 的 Vite 产物（base = "/admin/"）。
#
# `run_worker_first = ["/admin/*"]` 是这一段的关键：默认情况下 assets 会在到达
# Worker **之前**就把文件回掉，那样任何人都能拿到后台的 index.html 与那一坨 js。
# 先过 Worker 之后，`/admin/*` 要先问 AccountsDO 有没有后台会话——没有就 404，
# 连 index.html 都不给（扫描的人看到的与"这台机器上没有后台"一模一样）。
#
# `not_found_handling = "single-page-application"`：后台是前端路由，
# `/admin/users` 这类路径在产物里没有对应文件，要回 index.html 让它自己路由。
[assets]
directory = "../cloud-admin/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/admin/*", "/admin"]

# ── 发信 ───────────────────────────────────────────────────────────────
# Cloudflare Email Sending 的 binding。**没有密钥**——发信这块一把 key 都不用。
# 发件域要先在后台 / CLI 里开通（SPF + DKIM 两条 DNS，域在本账号就是一键）。
[[send_email]]
name = "EMAIL"

# ── 非敏感变量（进仓库） ───────────────────────────────────────────────
[vars]
AGENTSWS_CLOUD_BASE_URL = "https://cloud.agentsws.com"
AGENTSWS_CLOUD_PUBLIC_URL = "https://cloud.agentsws.com"
# 发件人显示名用产品名「Agents 工坊」，发件地址仍在 agentsws.com 上
AGENTSWS_CLOUD_MAIL_FROM = "Agents 工坊 <login@agentsws.com>"
# 内测期直接指一家 OpenAI 兼容的官方上游；以后换回自建的 New API 只改这一行
AGENTSWS_NEWAPI_BASE_URL = "https://api.deepseek.com/v1"
AGENTSWS_VERSION = "0.1.0"
# 官方转发每月对话上限（packages/metering/src/limits.json 是真源，这里只给 health 页展示）
AGENTSWS_CHAT_MONTHLY_CONVERSATIONS = "200"
# WP128：托管实例的容器规格（与上面 [[containers]].instance_type 保持一致；估算费用用）
AGENTSWS_HOSTED_INSTANCE_TYPE = "basic"
# WP155：官方数据接口的搜索数据用哪一家（docs/81 首选 dataforseo）。key 不在这里：
# `wrangler secret put AGENTSWS_SEARCH_DATA_KEY`（DataForSEO 填 login:password），没配 = 没开通
AGENTSWS_SEARCH_DATA_PROVIDER = "dataforseo"

# ── 打包 ───────────────────────────────────────────────────────────────
# better-sqlite3 是原生模块，Workers 上装不进去。云侧几个包的主入口里有它那一档
# 存储，但这个形态一条都用不上（库是 DO 自己的 SQLite）。换成一个"被 new 就抛
# 一句人话"的替身，见 src/node-stubs/better-sqlite3.ts。
[alias]
"better-sqlite3" = "./src/node-stubs/better-sqlite3.ts"
